      const {data,error,count}=await sb.from('ihale_sonuclari')
        .select('kazanan_firma,kazanan_teklif,sozlesme_bedeli,tenzilat_yuzde,kazanan_teklif_farki_yuzde,'

      const sat=data||[]; if(!sat.length) return;

      const kayitSayisi=Number(count)||sat.length;   // ihaleye ait TOPLAM sonuÃ§ satÄ±rÄ±
      const kesik=kayitSayisi>sat.length;            // tavana takÄ±ldÄ±k mÄ±?
      // lot_sayisi = ihalenin TOPLAM kÄ±sÄ±m sayÄ±sÄ±; sonuÃ§ kaydÄ± ondan az olabilir
      // (iptal/sonuÃ§suz kÄ±sÄ±m). Ä°kisinin bÃ¼yÃ¼ÄŸÃ¼ gerÃ§ek kÄ±sÄ±m sayÄ±sÄ±dÄ±r.
      const lot=Math.max(Number(s0.lot_sayisi)||0, kayitSayisi);
      const cokKisim=lot>1;
      const bedelOf=(x)=>Number(x.sozlesme_bedeli??x.kazanan_teklif)||0;

      // Tenzilat YALNIZ tek kÄ±sÄ±mlÄ± ihalede geÃ§erli (proje kuralÄ± â€” v1-firma-analiz
      // tenzilatDegeri() ile aynÄ±). lot_sayisi NULL (42.931 satÄ±r, gece iÅŸi henÃ¼z
      // dokunmamÄ±ÅŸ) da "bilinmiyor" sayÄ±lÄ±r: tek kÄ±sÄ±mlÄ± OLDUÄU kanÄ±tlanmadan gÃ¶sterme.
      const tekKisim = Number(s0.lot_sayisi)===1 && kayitSayisi===1;
      let tenzHtml;
      if(tekKisim){
        const v=(s0.tenzilat_yuzde!=null)?s0.tenzilat_yuzde:s0.kazanan_teklif_farki_yuzde;

        tenzHtml=`<div><b>Tenzilat</b><span class="kucuk" title="Ã‡ok kÄ±sÄ±mlÄ± ihalede EKAP kÄ±sÄ±m bazlÄ± yaklaÅŸÄ±k maliyet yayÄ±mlamadÄ±ÄŸÄ±ndan tenzilat hesaplanamaz">${num(lot)} kÄ±sÄ±mlÄ± â€” hesaplanamaz</span></div>`;
      }else{
        tenzHtml='<div><b>Tenzilat</b><span class="kucuk" title="Ä°halenin kÄ±sÄ±m sayÄ±sÄ± henÃ¼z doÄŸrulanmadÄ±; doÄŸrulanmadan tenzilat yanÄ±ltÄ±cÄ± olabilir">DoÄŸrulanmadÄ±</span></div>';

      // Kazanan firma(lar) â€” kÄ±sÄ±mlarÄ± farklÄ± firmalar almÄ±ÅŸ olabilir.
      // KESÄ°K VERÄ°DE TEK FÄ°RMA DA KESÄ°N DEÄÄ°LDÄ°R: yÃ¼klenmeyen kÄ±sÄ±mlarÄ± baÅŸka firmalar
      // almÄ±ÅŸ olabilir â†’ linki koru ama kapsamÄ± ("ilk N kÄ±sÄ±mda") aÃ§Ä±kÃ§a yaz, yoksa
      // kÄ±smi veriyi tam sanmak dÃ¼zelttiÄŸimiz hatanÄ±n aynÄ±sÄ± olur.
      const firmalar=[...new Set(sat.map(x=>x.kazanan_firma).filter(Boolean))];
      const firmaKapsam = kesik
        ? ` <span class="kucuk" style="font-weight:600;opacity:.75;" title="YalnÄ±z yÃ¼klenen ilk ${num(sat.length)} kÄ±sma bakÄ±ldÄ±; kalan kÄ±sÄ±mlarÄ± baÅŸka firmalar almÄ±ÅŸ olabilir">(ilk ${num(sat.length)} kÄ±sÄ±mda)</span>` : '';
      const firmaHtml = firmalar.length===1
        ? `<span class="kucuk"><a href="v1-firma-analiz?ara=${encodeURIComponent(firmalar[0])}" title="Firma analizini aÃ§">${esc(firmalar[0])} â†—</a>${firmaKapsam}</span>`
        : firmalar.length>1
          ? `<span class="kucuk">${kesik?'en az ':''}${num(firmalar.length)} farklÄ± firma</span>`

      const sirali=(k)=>sat.map(x=>x[k]).filter(Boolean).sort();
      const ilkSonuc=sirali('sonuc_tarihi')[0]||null;
      const sonBitis=sirali('is_bitis_tarihi').slice(-1)[0]||null;
      // Tarihler de yalnÄ±z yÃ¼klenen kÄ±sÄ±mlardan tÃ¼retiliyor â†’ kesikse kapsamÄ± sÃ¶yle.
      const tarihKapsam = kesik ? ` title="YalnÄ±z yÃ¼klenen ilk ${num(sat.length)} kÄ±sÄ±m Ã¼zerinden hesaplandÄ±"` : '';

      // KatÄ±lÄ±mcÄ± kÄ±sÄ±m kÄ±sÄ±m deÄŸiÅŸir â†’ Ã§ok kÄ±sÄ±mlÄ±da tek sayÄ± yanÄ±ltÄ±r, kÄ±sÄ±m sayÄ±sÄ±nÄ± yaz.
      const katilimciHtml = cokKisim
        ? `<div><b>KÄ±sÄ±m SayÄ±sÄ±</b><span>${num(lot)}</span></div>`
        : `<div><b>KatÄ±lÄ±mcÄ±</b><span>${s0.katilimci_sayisi!=null?num(s0.katilimci_sayisi):'â€”'}</span></div>`;

      // Teklif Rekabeti (mevcut kolonlar): yaklaÅŸÄ±k maliyet + verilen tekliflerin en dÃ¼ÅŸÃ¼k /
      // en yÃ¼ksek / ortalama ZARFI. EKAP kiÅŸi-bazlÄ± teklif listesi (kim ne verdi) yayÄ±mlamaz â€”
      // yalnÄ±z aralÄ±k + katÄ±lÄ±mcÄ± sayÄ±sÄ± vardÄ±r. Tek kÄ±sÄ±mda s0 doÄŸrudan ihaleyi temsil eder;
      // Ã§ok kÄ±sÄ±mlÄ±da deÄŸerler kÄ±sÄ±m kÄ±sÄ±m deÄŸiÅŸir â†’ aralÄ±k gÃ¶sterilmez (kÄ±sÄ±m tablosuna bak).
      const tekAlan=(b,v,ipucu)=> (v!=null && Number(v)>0)
        ? `<div><b>${b}</b><span${ipucu?` title="${ipucu}"`:''}>${tl(Number(v))}</span></div>` : '';
      const teklifKutu = !cokKisim
        ? [tekAlan('YaklaÅŸÄ±k Maliyet', s0.yaklasik_maliyet),
           tekAlan('En DÃ¼ÅŸÃ¼k Teklif',  s0.en_dusuk_teklif,'Ä°haleye verilen en dÃ¼ÅŸÃ¼k teklif'),
           tekAlan('En YÃ¼ksek Teklif', s0.en_yuksek_teklif,'Ä°haleye verilen en yÃ¼ksek teklif'),
           tekAlan('Ortalama Teklif',  s0.ortalama_teklif,'En dÃ¼ÅŸÃ¼kâ€“en yÃ¼ksek ortalamasÄ±')].filter(Boolean).join('')
        : '';
      const teklifHtml = teklifKutu
        ? `<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--v1-cizgi);">
             <div style="font-size:12.5px;font-weight:800;color:var(--v1-lacivert);margin-bottom:8px;">Teklif Rekabeti
               <span class="kucuk" style="font-weight:600;opacity:.7;" title="EKAP kiÅŸi bazlÄ± teklif listesi (kim ne verdi) yayÄ±mlamaz; verilen tekliflerin en dÃ¼ÅŸÃ¼kâ€“en yÃ¼ksek aralÄ±ÄŸÄ± ve katÄ±lÄ±mcÄ± sayÄ±sÄ± gÃ¶sterilir">verilen tekliflerin aralÄ±ÄŸÄ±</span></div>
             <div class="v1-sonuc-grid">${teklifKutu}</div></div>`
        : '';

      // Bedel etiketi: kesik veride "Toplam" DEMEK YASAK â€” eksik toplamÄ± tam sanmak
      // dÃ¼zelttiÄŸimiz hatanÄ±n aynÄ±sÄ± olurdu; etiket kapsamÄ± kendisi yazar.
      const bedelEtiket = !cokKisim ? 'SÃ¶zleÅŸme Bedeli'
        : kesik ? `Ä°lk ${num(sat.length)} KÄ±smÄ±n Bedeli` : 'Toplam SÃ¶zleÅŸme Bedeli';

      const kisimTablo = cokKisim ? `
        <details class="v1-kisim-det" open>
          <summary>KÄ±sÄ±m bazlÄ± daÄŸÄ±lÄ±m (${num(sat.length)}${kesik?' / '+num(kayitSayisi):''} kayÄ±t)</summary>
          <div class="v1-kisim-sar"><table class="v1-kisim-tablo">
            <thead><tr><th>KÄ±sÄ±m</th><th>Kazanan</th><th class="sag">En DÃ¼ÅŸÃ¼k</th><th class="sag">En YÃ¼ksek</th><th class="sag">Bedel</th></tr></thead>
            <tbody>${sat.map(x=>`<tr>
              <td>${x.kisim_no!=null?num(x.kisim_no):'â€”'}</td>
              <td>${esc(x.kazanan_firma||'â€”')}</td>
              <td class="sag">${x.en_dusuk_teklif>0?tl(Number(x.en_dusuk_teklif)):'â€”'}</td>
              <td class="sag">${x.en_yuksek_teklif>0?tl(Number(x.en_yuksek_teklif)):'â€”'}</td>
              <td class="sag">${bedelOf(x)?tl(bedelOf(x)):'â€”'}</td></tr>`).join('')}</tbody>
          </table></div>
        </details>` : '';

      const sonucsuz = cokKisim && !kesik && kayitSayisi<lot;
      const not = cokKisim ? `<div class="v1-sonuc-not">Ã‡ok kÄ±sÄ±mlÄ± ihale: gÃ¶sterilen tutar,
        ${kesik
          ? `bu sayfaya yÃ¼klenen <b>ilk ${num(sat.length)}</b> kÄ±smÄ±n bedelleri toplamÄ±dÄ±r â€” ihalenin ${num(kayitSayisi)} sonuÃ§ kaydÄ± olduÄŸundan bu tutar ihalenin TAMAMI DEÄÄ°LDÄ°R`
          : `sonucu yayÄ±mlanan ${num(kayitSayisi)} kÄ±smÄ±n bedelleri toplamÄ±dÄ±r${sonucsuz?` (ihalenin ${num(lot)} kÄ±smÄ±ndan ${num(kayitSayisi)} tanesinde sonuÃ§ kaydÄ± var)`:''}`}.
        EKAP kÄ±sÄ±m bazlÄ± yaklaÅŸÄ±k maliyet yayÄ±mlamadÄ±ÄŸÄ±ndan tenzilat kÄ±sÄ±m kÄ±sÄ±m hesaplanamaz.</div>` : '';

      const fes=sat.filter(x=>x.fesih_var).length, tas=sat.filter(x=>x.tasfiye_var).length;
      const uyariParca=[];
      const enAz=kesik?'en az ':'';   // kesik veride sayÄ±m eksik kalÄ±r, Ã¶yle sun
      if(fes) uyariParca.push(cokKisim?`${enAz}<b>${num(fes)}</b> kÄ±sÄ±mda sÃ¶zleÅŸme <b>feshedilmiÅŸ</b>`:'SÃ¶zleÅŸme <b>feshedilmiÅŸ</b>');
      if(tas) uyariParca.push(cokKisim?`${enAz}<b>${num(tas)}</b> kÄ±sÄ±mda <b>tasfiye / devir</b> var`:'SÃ¶zleÅŸmede <b>tasfiye / devir</b> var');
      const uyari=uyariParca.length?`<div class="v1-sonuc-uyari">âš  ${uyariParca.join(' Â· ')}</div>`:'';

      kap.innerHTML=`
        <div class="v1-kart"><div class="v1-kart-baslik">Ä°hale Sonucu${cokKisim?` <span class="v1-d-rozet teal" style="color:#fff;">${num(lot)} kÄ±sÄ±m</span>`:''}</div>
          <div class="v1-sonuc-kart"><div class="v1-sonuc-grid">
            <div><b>Kazanan Firma</b>${firmaHtml}</div>
            <div><b>${bedelEtiket}</b><span>${toplam?tl(toplam):'â€”'}</span></div>
            ${tenzHtml}
            ${katilimciHtml}
            <div><b>SonuÃ§ Tarihi</b><span class="kucuk"${tarihKapsam}>${gun(ilkSonuc)||'â€”'}</span></div>
            ${sonBitis?`<div><b>Ä°ÅŸ BitiÅŸ</b><span class="kucuk"${tarihKapsam}>${gun(sonBitis)}</span></div>`:''}
          </div>${teklifHtml}${not}${uyari}${kisimTablo}</div></div>`;
    }catch(e){
      kap.innerHTML=`<div class="v1-kart"><div class="v1-kart-baslik">Ä°hale Sonucu</div>
        <div class="v1-bos">SonuÃ§ bilgisi yÃ¼klenemedi. ${esc(e.message||'')}</div></div>`;
    }
  }

  // â”€â”€ Benzer ihaleler â€” skorlu RPC (idare+il+kategori+baÅŸlÄ±k kelimesi); RPC yoksa eski filtreye dÃ¼ÅŸer â”€â”€
  async function benzerYukle(r){
    const el=document.getElementById('d-benzer');
    const ciz=(data)=>{
      if(!data||!data.length){ el.innerHTML='<div class="v1-bos">Benzer aÃ§Ä±k ihale bulunamadÄ±.</div>'; return; }
      el.innerHTML=data.map(i=>{
        const g=i.son_teklif_tarihi?Math.max(0,Math.ceil((new Date(i.son_teklif_tarihi)-new Date())/86400000)):null;
        const alt=[esc(i.il||'â€”'), i.tur?esc(i.tur):null, i.neden?esc(i.neden):null].filter(Boolean).join(' Â· ');
        return `<a class="v1-satir" href="v1-ihale-detay?id=${i.id}" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--v1-cizgi);text-decoration:none;color:inherit;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(i.baslik||'Ä°hale')}</div>
            <div style="font-size:11.5px;color:var(--v1-muted);margin-top:2px;">${alt}</div>
          </div>
          ${g!=null?`<span style="flex-shrink:0;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;
            background:${g<=3?'#FDECEE':'var(--v1-mavi-acik)'};color:${g<=3?'var(--v1-kirmizi)':'var(--v1-mavi)'};">Son ${g} gÃ¼n</span>`:''}</a>`;
      }).join('');
    };
    try{
      const {data,error}=await sb.rpc('benzer_ihaleler',{p_ilan_id:r.id,p_limit:6});
      if(error) throw error;
      ciz(data);
    }catch(_){
      // RPC henÃ¼z uygulanmadÄ±ysa/hata: eski kategori+tur filtresine dÃ¼ÅŸ (bÃ¶lÃ¼m bozulmasÄ±n)
      try{
        let q=sb.from('ilanlar').select('id,baslik,il,tur,son_teklif_tarihi')
          .eq('durum','aktif').gte('son_teklif_tarihi',new Date().toISOString()).neq('id',r.id);
        if(r.kategori) q=q.eq('kategori',r.kategori);
        if(r.tur) q=q.eq('tur',r.tur);
        const {data}=await q.order('son_teklif_tarihi',{ascending:true,nullsFirst:true}).limit(6);
        ciz(data);
      }catch(_e){ el.innerHTML='<div class="v1-bos">YÃ¼klenemedi.</div>'; }
    }
  }

  // â”€â”€ Takip â”€â”€
  function yerelTakip(){ try{ return JSON.parse(localStorage.getItem('takipEdilen')||'[]'); }catch(_){ return []; } }
  async function kullaniciId(){
    try{ const {data}=await sb.auth.getSession(); return (data&&data.session&&data.session.user.id)||null; }
    catch(_){ return null; }
  }
  async function takipDurumGuncelle(){
    const b=document.getElementById('d-takip'); if(!b) return;
    let takipte=yerelTakip().includes(id);
    if(uyeMi){
      const uid=await kullaniciId();
      if(uid){
        // kullanici_id filtresi RLS'e ek olarak ELDE de duruyor: politika ileride
        // gevÅŸerse baÅŸkasÄ±nÄ±n takip satÄ±rÄ± "takipte" gÃ¶stermesin.
        const {data,error}=await sb.from('takipler').select('ilan_id').eq('kullanici_id',uid).eq('ilan_id',id).limit(1);
        if(!error) takipte=!!(data&&data.length);
      }
    }
    b.textContent = takipte ? 'âœ“ Takipte' : 'â­ Takibe Al';
    b.dataset.takipte = takipte ? '1' : '';
  }
  async function takipToggle(){
    if(!uyeMi){ alert('Takip iÃ§in giriÅŸ yapmalÄ±sÄ±nÄ±z.'); return; }
    const b=document.getElementById('d-takip'); if(!b) return;
    const eski=b.textContent;
    b.disabled=true; b.textContent='â€¦';
    try{
      const uid=await kullaniciId();
      if(!uid) throw new Error('Oturum bulunamadÄ±, lÃ¼tfen tekrar giriÅŸ yapÄ±n.');
      // supabase-js YAZMA HATASI FIRLATMAZ, {error} dÃ¶ner â†’ try/catch boÅŸ geÃ§er ve
      // kod baÅŸarÄ±sÄ±z iÅŸlemde bile "kaydedildi" sanÄ±rdÄ±. HatayÄ± ELLE kontrol et.
      if(b.dataset.takipte){
        const {error}=await sb.from('takipler').delete().eq('kullanici_id',uid).eq('ilan_id',id);
        if(error) throw error;
      }else{
        const {error}=await sb.from('takipler')
          .upsert({kullanici_id:uid,ilan_id:id},{onConflict:'kullanici_id,ilan_id',ignoreDuplicates:true});
        if(error) throw error;
      }
      b.disabled=false;
      await takipDurumGuncelle();
    }catch(e){
      b.disabled=false; b.textContent=eski;
      alert('Ä°ÅŸlem baÅŸarÄ±sÄ±z: '+(e.message||'bilinmeyen hata'));
    }
  }

  function takvim(r){

      'UID:'+r.id+'@ihaleglobal.com','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(new Date(d.getTime()+36e5)),
      'SUMMARY:'+String(r.baslik||'Ä°hale').replace(/[,;]/g,' '),'DESCRIPTION:Ä°haleGlobal â€” son teklif tarihi',

  (async()=>{

        v1PaketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel'); } else v1PaketYaz('Misafir'); }
