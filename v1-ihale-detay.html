<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Ömer Faruk Dinç">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İhale Detayı — İhaleGlobal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v1.css?v=7" />
  <style>
    .v1-d-bant { background:var(--v1-lacivert); border-radius:var(--v1-radius-lg); padding:24px 26px; color:#fff; margin-bottom:18px; }
    .v1-d-ikn { font-size:12.5px; color:rgba(255,255,255,.72); font-weight:600; letter-spacing:.04em; }
    .v1-d-baslik { font-size:22px; font-weight:800; line-height:1.35; margin:6px 0 12px; }
    .v1-d-rozetler { display:flex; gap:8px; flex-wrap:wrap; }
    .v1-d-rozet { font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; background:rgba(255,255,255,.16); }
    .v1-d-rozet.yesil { background:#1E9E57; }
    .v1-d-rozet.kirmizi { background:#D64550; }
    .v1-d-rozet.teal { background:var(--v1-teal); }
    .v1-d-islem { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .v1-d-btn { background:#fff; color:var(--v1-lacivert); border:none; border-radius:9px; padding:10px 18px;
      font-family:var(--v1-font); font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
    .v1-d-btn:hover { background:#EAF1F9; text-decoration:none; }
    .v1-d-btn.teal { background:var(--v1-teal); color:#fff; }
    .v1-d-btn.hayalet { background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.35); }
    .v1-bilgi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:18px 26px; }
    .v1-bilgi b { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--v1-muted); margin-bottom:3px; }
    .v1-bilgi span { font-size:14px; font-weight:600; color:var(--v1-metin); }
    .v1-metin { font-size:13.5px; line-height:1.7; color:var(--v1-metin); white-space:pre-wrap;
      max-height:340px; overflow-y:auto; background:var(--v1-zemin); border:1px solid var(--v1-cizgi);
      border-radius:10px; padding:16px; }
    /* İlan HTML'i (ilan_html) render edilirken pre-wrap kapanmalı, yoksa etiket araları boşluk olur */
    .v1-metin.zengin { white-space:normal; max-height:560px; }
    .v1-metin.zengin p { margin:0 0 9px; }
    .v1-metin.zengin table { border-collapse:collapse; width:100%; font-size:12.5px; margin:9px 0; }
    .v1-metin.zengin th, .v1-metin.zengin td { border:1px solid var(--v1-cizgi); padding:6px 9px; text-align:left; vertical-align:top; }
    .v1-metin.zengin img { max-width:100%; height:auto; }
    .v1-metin.zengin a { color:var(--v1-mavi); }
    .v1-kilit-kutu { background:var(--v1-mavi-acik); border:1px solid #CFE2F5; border-radius:10px;
      padding:16px 18px; font-size:13px; line-height:1.6; text-align:center; }
    .v1-sonuc-kart { background:#E6F6EC; border:1px solid #BFE6CE; border-radius:12px; padding:18px 20px; }
    .v1-sonuc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px 24px; }
    .v1-sonuc-grid b { display:block; font-size:11.5px; text-transform:uppercase; color:#1E7A46; margin-bottom:3px; }
    .v1-sonuc-grid span { font-size:16px; font-weight:800; color:#146035; }
    .v1-sonuc-grid span.kucuk { font-size:13px; font-weight:700; }
    .v1-sonuc-grid a { color:#146035; text-decoration:none; }
    .v1-sonuc-grid a:hover { text-decoration:underline; }
    .v1-kisim-det { margin-top:14px; border-top:1px solid #BFE6CE; padding-top:10px; }
    .v1-kisim-det > summary { cursor:pointer; font-size:12.5px; font-weight:700; color:#1E7A46; list-style:none; }
    .v1-kisim-det > summary::-webkit-details-marker { display:none; }
    .v1-kisim-det > summary::before { content:'▸ '; }
    .v1-kisim-det[open] > summary::before { content:'▾ '; }
    .v1-kisim-sar { max-height:260px; overflow-y:auto; margin-top:9px; }
    .v1-kisim-tablo { width:100%; border-collapse:collapse; font-size:12.5px; }
    .v1-kisim-tablo th { position:sticky; top:0; background:#E6F6EC; text-align:left; font-size:10.5px;
      text-transform:uppercase; letter-spacing:.04em; color:#1E7A46; border-bottom:1px solid #BFE6CE; padding:6px 8px; }
    .v1-kisim-tablo td { padding:6px 8px; border-bottom:1px solid #D4EBDD; color:#146035; font-weight:600; }
    .v1-kisim-tablo td.sag, .v1-kisim-tablo th.sag { text-align:right; white-space:nowrap; }
    .v1-sonuc-not { font-size:11.5px; line-height:1.6; color:#3B7A57; margin-top:11px; }
    .v1-sonuc-uyari { margin-top:12px; padding:10px 12px; background:#FDECEE; border:1px solid #F3C6CB;
      border-radius:8px; font-size:12.5px; color:#96262F; font-weight:600; }
  </style>
</head>
<body class="v1" data-v1-aktif="ihaleler" data-v1-kirinti="Kamu > İhaleler > Detay">
<div class="v1-app">
  <div class="v1-main">
    <div class="v1-govde" id="v1-govde">
      <div class="v1-bos">Yükleniyor…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/v1-kabuk.js?v=11"></script>
<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const tl=(v)=>v==null?null:'₺'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:0});
  const gun=(t)=>t?new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):null;
  const saat=(t)=>t?new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'';
  const id=new URLSearchParams(location.search).get('id');
  const G=()=>document.getElementById('v1-govde');
  let uyeMi=false;

  const DURUM={aktif:['Aktif','yesil'],kapali:['Kapalı',''],sonuclandi:['Sonuçlandı','teal'],iptal:['İptal','kirmizi']};

  /* ── İlan HTML sanitizasyonu ──────────────────────────────────────────
     ilan_html EKAP'tan gelen HAM HTML'dir; doğrudan innerHTML'e verilirse XSS
     yüzeyi açar. Etiket kara listesi + on* nitelik + javascript:/data:/vbscript:
     URL temizliği ŞART. DOMParser ayrı bir belgede ayrıştırır: içerideki <img
     onerror> gibi kalıplar biz temizlemeden ÇALIŞMAZ (sayfaya bağlı değil). */
  const TEHLIKELI_ETIKET='script,style,iframe,object,embed,link,meta,base,form,input,button,'
    +'textarea,select,option,svg,math,applet,frame,frameset,noscript,template,portal';
  // Tarayıcı URL'i çözerken boşluk ve kontrol karakterlerini atar ("java&#9;script:"
  // yine çalışır) → şemayı TEMİZLENMİŞ bir kopya üzerinde sına, değeri değiştirme.
  function tehlikeliUrl(deger){
    const sade=String(deger||'').replace(/[\u0000-\u0020\u00a0\u1680\u2000-\u200f\u2028-\u202f\u205f\u3000\ufeff]/g,'');
    return /^(javascript|data|vbscript):/i.test(sade);
  }
  function temizHtml(ham){
    if(!ham) return '';
    let doc;
    try{ doc=new DOMParser().parseFromString(String(ham),'text/html'); }catch(_){ return ''; }
    if(!doc||!doc.body) return '';
    doc.querySelectorAll(TEHLIKELI_ETIKET).forEach(el=>el.remove());
    doc.querySelectorAll('*').forEach(el=>{
      Array.from(el.attributes).forEach(a=>{
        const n=a.name.toLowerCase();
        // on* handler + sayfa görünümünü kaçıran/kod taşıyan nitelikler
        if(n.startsWith('on')||n==='srcdoc'||n==='formaction'||n==='style'||n==='color'||n==='background'||n==='bgcolor'){
          el.removeAttribute(a.name); return;
        }
        if((n==='href'||n==='src'||n==='action'||n==='data'||n==='xlink:href'||n==='poster')
           && tehlikeliUrl(a.value)){
          el.removeAttribute(a.name);
        }
      });
      if(el.tagName==='A'&&el.getAttribute('href')){
        el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer nofollow');
      }
    });
    return doc.body.innerHTML;
  }

  async function yukle(){
    if(!id){ G().innerHTML='<div class="v1-bos">İhale kimliği belirtilmedi.</div>'; return; }
    try{
      // ilan_metni / ilan_html YALNIZ üye dalında: anon'a kapalı (42501) — koşulsuz
      // eklenirse tüm sorgu düşer ve misafirde sayfa "Yüklenemedi" der.
      // aciklama 1,98M satırın TAMAMINDA NULL; yalnız tarihî yedek olarak duruyor.
      const kolon = uyeMi
        ? 'id,ekap_id,ikn,baslik,aciklama,ilan_metni,ilan_html,idare,il,tur,usul,durum,kategori,ilan_tarihi,son_teklif_tarihi,ihale_tarihi,yaklasik_maliyet_min,yaklasik_maliyet_max,tahmini_bedel,itiraz_bedeli,isin_yapilacagi_yer,ihale_yeri,yapay_zeka_ozeti,pdf_url,kaynak'
        : 'id,baslik,il,tur,usul,durum,kategori,ilan_tarihi,son_teklif_tarihi,kaynak';
      // id birincil anahtar → .limit(1) burada güvenli (en fazla 1 satır zaten).
      const {data,error}=await sb.from('ilanlar').select(kolon).eq('id',id).limit(1);
      if(error) throw error;
      const r=(data||[])[0];
      if(!r){ G().innerHTML='<div class="v1-bos">İhale bulunamadı.</div>'; return; }
      ciz(r);
      sonucYukle(r);
      benzerYukle(r);
      sonGoruntulenenKaydet(r);
    }catch(e){ G().innerHTML=`<div class="v1-bos">Yüklenemedi. ${esc(e.message||'')}</div>`; }
  }

  function ciz(r){
    const d=DURUM[r.durum]||[r.durum||'—',''];
    const t=r.son_teklif_tarihi?new Date(r.son_teklif_tarihi):null;
    const kalan=t?Math.ceil((t-new Date())/86400000):null;
    const kilit='<span class="v1-kilit">••••• 🔒</span>';
    const alan=(b,v)=>`<div class="v1-bilgi"><b>${b}</b><span>${v||'—'}</span></div>`;
    const maliyet = uyeMi
      ? (r.yaklasik_maliyet_min ? tl(r.yaklasik_maliyet_min)+(r.yaklasik_maliyet_max&&r.yaklasik_maliyet_max!==r.yaklasik_maliyet_min?' – '+tl(r.yaklasik_maliyet_max):'') : 'İlan edilmemiş')
      : kilit;
    // EKAP public deep-link YOK (IKN'ye özel sayfa oturum ister → 406). Doğru EKAP modülüne
    // yönlendir (DT ayrı modül), kullanıcı sayfada görünen IKN ile kendisi aratır/giriş yapar.
    const dtMi = (((r.usul||'')+' '+(r.tur||'')).toLocaleLowerCase('tr').includes('doğrudan temin'));
    const ekapUrl = dtMi ? 'https://ekapv2.kik.gov.tr/ekap-dt/search' : 'https://ekapv2.kik.gov.tr/ekap/search';

    G().innerHTML=`
      <div class="v1-d-bant">
        <div class="v1-d-ikn">${esc(r.ikn||r.ekap_id||'')} ${r.kaynak?'· '+esc(String(r.kaynak).toUpperCase()):''}</div>
        <div class="v1-d-baslik">${esc(r.baslik||'—')}</div>
        <div class="v1-d-rozetler">
          <span class="v1-d-rozet ${d[1]}">${esc(d[0])}</span>
          ${r.tur?`<span class="v1-d-rozet">${esc(r.tur)}</span>`:''}
          ${r.il?`<span class="v1-d-rozet">${esc(r.il)}</span>`:''}
          ${kalan!=null&&kalan>=0?`<span class="v1-d-rozet ${kalan<=3?'kirmizi':'teal'}">Son ${kalan} gün</span>`:''}
        </div>
        <div class="v1-d-islem">
          <button class="v1-d-btn" id="d-takip">⭐ Takibe Al</button>
          <button class="v1-d-btn hayalet" id="d-takvim">📅 Takvime Ekle</button>
          <a class="v1-d-btn teal" href="v1-teklif-olustur?ihale_id=${r.id}">📝 Teklif Oluştur</a>
          <a class="v1-d-btn hayalet" href="v1-teklif-olustur?ihale_id=${r.id}#fiyat">💡 AI Fiyat Stratejisi</a>
          <a class="v1-d-btn hayalet" href="${ekapUrl}" target="_blank" rel="noopener"
             title="EKAP ${dtMi?'Doğrudan Temin':'İhale'} arama sayfası — bu ihalenin IKN'si (${esc(r.ikn||r.ekap_id||'')}) ile aratın">🔗 EKAP'a Git</a>
        </div>
      </div>

      <div class="v1-kart">
        <div class="v1-kart-baslik">İhale Bilgileri</div>
        <div class="v1-bilgi-grid">
          ${alan('İhaleyi Yapan İdare', uyeMi?esc(r.idare):kilit)}
          ${alan('Sektör', esc(r.kategori))}
          ${alan('İhale Usulü', esc(r.usul))}
          ${alan('İlan Tarihi', gun(r.ilan_tarihi))}
          ${alan('Son Teklif Tarihi', t?`${gun(r.son_teklif_tarihi)} ${saat(r.son_teklif_tarihi)}`:'—')}
          ${alan('İhale Tarihi', gun(r.ihale_tarihi))}
          ${alan('Yaklaşık Maliyet', maliyet)}
          ${uyeMi?alan('İtiraz Bedeli', tl(r.itiraz_bedeli)):''}
          ${uyeMi?alan('İşin Yapılacağı Yer', esc(r.isin_yapilacagi_yer)):''}
          ${uyeMi?alan('İhale Yeri', esc(r.ihale_yeri)):''}
        </div>
        ${!uyeMi?`<div style="margin-top:16px;background:var(--v1-mavi-acik);border:1px solid #CFE2F5;border-radius:10px;padding:13px 15px;font-size:13px;">
          🔒 İdare, yaklaşık maliyet ve iş yeri bilgileri <strong>üyelere açıktır</strong>. <a href="login">Giriş yapın →</a></div>`:''}
      </div>

      ${r.yapay_zeka_ozeti?`<div class="v1-kart">
        <div class="v1-kart-baslik">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="var(--v1-teal)"><path d="M12 1.6l1.9 4.7 4.7 1.9-4.7 1.9L12 14.8l-1.9-4.7L5.4 8.2l4.7-1.9L12 1.6Z"/></svg>
          Yapay Zekâ Özeti</div>
        <div class="v1-metin">${esc(r.yapay_zeka_ozeti)}</div></div>`:''}

      ${ilanMetniKarti(r)}

      <div id="d-sonuc"></div>
      <div class="v1-kart">
        <div class="v1-kart-baslik">Benzer İhaleler</div>
        <div id="d-benzer"><div class="v1-bos">Yükleniyor…</div></div>
      </div>`;

    ilanMetniDoldur(r);
    document.getElementById('d-takip').addEventListener('click',takipToggle);
    document.getElementById('d-takvim').addEventListener('click',()=>takvim(r));
    takipDurumGuncelle();
  }

  /* ── İlan metni ───────────────────────────────────────────────────────
     ESKİ HATA: kart yalnız r.aciklama'yı çiziyordu; o kolon 1,98M satırın
     TAMAMINDA NULL → ilan metni hiçbir ihalede görünmüyordu. Gerçek metin
     ilan_metni / ilan_html kolonlarında ve anon'a KAPALI → üye dalında göster,
     misafire kilit. Gövde innerHTML'den SONRA ilanMetniDoldur() ile basılır ki
     ilan_html şablon içine ham gömülmesin (sanitizasyon DOM üstünde yapılır). */
  function ilanMetniKarti(r){
    const bas='<div class="v1-kart-baslik">İlan Metni</div>';
    if(!uyeMi){
      return `<div class="v1-kart">${bas}
        <div class="v1-kilit-kutu">🔒 İlan metninin tamamı <strong>üyelere açıktır</strong>.
        <a href="login">Giriş yapın →</a></div></div>`;
    }
    if(!(r.ilan_html||r.ilan_metni||r.aciklama)){
      return `<div class="v1-kart">${bas}
        <div class="v1-bos">Bu ihale için ilan metni kaydedilmemiş.</div></div>`;
    }
    return `<div class="v1-kart">${bas}<div class="v1-metin" id="d-ilan-metni"></div></div>`;
  }
  function ilanMetniDoldur(r){
    const el=document.getElementById('d-ilan-metni'); if(!el) return;
    const zengin=r.ilan_html?temizHtml(r.ilan_html):'';
    if(zengin.trim()){ el.classList.add('zengin'); el.innerHTML=zengin; return; }
    // ilan_html yok ya da temizlikten sonra boş kaldı → düz metne düş
    el.classList.remove('zengin');
    el.textContent=r.ilan_metni||r.aciklama||'İlan metni bulunamadı.';
  }

  /* ── Sonuç (sonuçlanmışsa) ────────────────────────────────────────────
     ESKİ HATA: `.limit(1)` + SIRALAMASIZ tek satır çekiliyordu. ihale_sonuclari'nda
     satır = KISIM; 2,52M sonuç satırının %48,1'i lot_sayisi>1. Postgres'in rastgele
     verdiği TEK kısmın bedeli "Sözleşme Bedeli" diye yazılıyordu (kanıt: 12 kısımlı
     bir ihalede toplam 2.301.026 ₺ iken sayfa 122.944 ₺ gösteriyordu).
     DÜZELTME: tüm kısımları kisim_no sırasıyla çek, "N kısım" rozeti + kısım
     bedelleri TOPLAMI göster.
     TENZİLAT: EKAP kısım bazlı yaklaşık maliyet yayımlamaz, ihalenin TOPLAM maliyeti
     her kısma kopyalanır → satır tenzilatı sahte %95'lere çıkar. Proje kuralı:
     yalnız lot_sayisi=1 iken göster (v1-firma-analiz.html tenzilatDegeri() ile aynı). */
  async function sonucYukle(r){
    if(!uyeMi) return;
    const kap=document.getElementById('d-sonuc'); if(!kap) return;
    try{
      // TAVAN: canlıda en büyük ihale 5.826 kısım. Hepsini çekmek client-load-all
      // olurdu; count=exact ile GERÇEK kısım sayısını öğrenip yalnız ilk KISIM_TAVAN
      // satırı indiriyoruz. Kesme olursa toplam KISMİ olur → etiket bunu açıkça söyler,
      // eksik toplam "Toplam Sözleşme Bedeli" diye sunulmaz.
      const KISIM_TAVAN=500;
      const {data,error,count}=await sb.from('ihale_sonuclari')
        .select('kazanan_firma,kazanan_teklif,sozlesme_bedeli,tenzilat_yuzde,kazanan_teklif_farki_yuzde,'
               +'sonuc_tarihi,katilimci_sayisi,gecerli_teklif_sayisi,is_bitis_tarihi,kisim_no,lot_sayisi,fesih_var,tasfiye_var',
               {count:'exact'})
        .eq('ilan_id',r.id).order('kisim_no',{ascending:true,nullsFirst:true}).limit(KISIM_TAVAN);
      if(error) throw error;
      const sat=data||[]; if(!sat.length) return;
      const s0=sat[0];

      const kayitSayisi=Number(count)||sat.length;   // ihaleye ait TOPLAM sonuç satırı
      const kesik=kayitSayisi>sat.length;            // tavana takıldık mı?
      // lot_sayisi = ihalenin TOPLAM kısım sayısı; sonuç kaydı ondan az olabilir
      // (iptal/sonuçsuz kısım). İkisinin büyüğü gerçek kısım sayısıdır.
      const lot=Math.max(Number(s0.lot_sayisi)||0, kayitSayisi);
      const cokKisim=lot>1;
      const bedelOf=(x)=>Number(x.sozlesme_bedeli??x.kazanan_teklif)||0;
      const toplam=sat.reduce((a,x)=>a+bedelOf(x),0);

      // Tenzilat YALNIZ tek kısımlı ihalede geçerli (proje kuralı — v1-firma-analiz
      // tenzilatDegeri() ile aynı). lot_sayisi NULL (42.931 satır, gece işi henüz
      // dokunmamış) da "bilinmiyor" sayılır: tek kısımlı OLDUĞU kanıtlanmadan gösterme.
      const tekKisim = Number(s0.lot_sayisi)===1 && kayitSayisi===1;
      let tenzHtml;
      if(tekKisim){
        const v=(s0.tenzilat_yuzde!=null)?s0.tenzilat_yuzde:s0.kazanan_teklif_farki_yuzde;
        const tz=(v!=null&&Math.abs(Number(v))<100)
          ? '%'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:1}) : '—';
        tenzHtml=`<div><b>Tenzilat</b><span>${tz}</span></div>`;
      }else if(cokKisim){
        tenzHtml=`<div><b>Tenzilat</b><span class="kucuk" title="Çok kısımlı ihalede EKAP kısım bazlı yaklaşık maliyet yayımlamadığından tenzilat hesaplanamaz">${num(lot)} kısımlı — hesaplanamaz</span></div>`;
      }else{
        tenzHtml='<div><b>Tenzilat</b><span class="kucuk" title="İhalenin kısım sayısı henüz doğrulanmadı; doğrulanmadan tenzilat yanıltıcı olabilir">Doğrulanmadı</span></div>';
      }

      // Kazanan firma(lar) — kısımları farklı firmalar almış olabilir.
      // KESİK VERİDE TEK FİRMA DA KESİN DEĞİLDİR: yüklenmeyen kısımları başka firmalar
      // almış olabilir → linki koru ama kapsamı ("ilk N kısımda") açıkça yaz, yoksa
      // kısmi veriyi tam sanmak düzelttiğimiz hatanın aynısı olur.
      const firmalar=[...new Set(sat.map(x=>x.kazanan_firma).filter(Boolean))];
      const firmaKapsam = kesik
        ? ` <span class="kucuk" style="font-weight:600;opacity:.75;" title="Yalnız yüklenen ilk ${num(sat.length)} kısma bakıldı; kalan kısımları başka firmalar almış olabilir">(ilk ${num(sat.length)} kısımda)</span>` : '';
      const firmaHtml = firmalar.length===1
        ? `<span class="kucuk"><a href="v1-firma-analiz?ara=${encodeURIComponent(firmalar[0])}" title="Firma analizini aç">${esc(firmalar[0])} ↗</a>${firmaKapsam}</span>`
        : firmalar.length>1
          ? `<span class="kucuk">${kesik?'en az ':''}${num(firmalar.length)} farklı firma</span>`
          : '<span>—</span>';

      const sirali=(k)=>sat.map(x=>x[k]).filter(Boolean).sort();
      const ilkSonuc=sirali('sonuc_tarihi')[0]||null;
      const sonBitis=sirali('is_bitis_tarihi').slice(-1)[0]||null;
      // Tarihler de yalnız yüklenen kısımlardan türetiliyor → kesikse kapsamı söyle.
      const tarihKapsam = kesik ? ` title="Yalnız yüklenen ilk ${num(sat.length)} kısım üzerinden hesaplandı"` : '';

      // Katılımcı kısım kısım değişir → çok kısımlıda tek sayı yanıltır, kısım sayısını yaz.
      const katilimciHtml = cokKisim
        ? `<div><b>Kısım Sayısı</b><span>${num(lot)}</span></div>`
        : `<div><b>Katılımcı</b><span>${s0.katilimci_sayisi!=null?num(s0.katilimci_sayisi):'—'}</span></div>`;

      // Bedel etiketi: kesik veride "Toplam" DEMEK YASAK — eksik toplamı tam sanmak
      // düzelttiğimiz hatanın aynısı olurdu; etiket kapsamı kendisi yazar.
      const bedelEtiket = !cokKisim ? 'Sözleşme Bedeli'
        : kesik ? `İlk ${num(sat.length)} Kısmın Bedeli` : 'Toplam Sözleşme Bedeli';

      const kisimTablo = cokKisim ? `
        <details class="v1-kisim-det">
          <summary>Kısım bazlı dağılım (${num(sat.length)}${kesik?' / '+num(kayitSayisi):''} kayıt)</summary>
          <div class="v1-kisim-sar"><table class="v1-kisim-tablo">
            <thead><tr><th>Kısım</th><th>Kazanan</th><th class="sag">Bedel</th></tr></thead>
            <tbody>${sat.map(x=>`<tr>
              <td>${x.kisim_no!=null?num(x.kisim_no):'—'}</td>
              <td>${esc(x.kazanan_firma||'—')}</td>
              <td class="sag">${bedelOf(x)?tl(bedelOf(x)):'—'}</td></tr>`).join('')}</tbody>
          </table></div>
        </details>` : '';

      const sonucsuz = cokKisim && !kesik && kayitSayisi<lot;
      const not = cokKisim ? `<div class="v1-sonuc-not">Çok kısımlı ihale: gösterilen tutar,
        ${kesik
          ? `bu sayfaya yüklenen <b>ilk ${num(sat.length)}</b> kısmın bedelleri toplamıdır — ihalenin ${num(kayitSayisi)} sonuç kaydı olduğundan bu tutar ihalenin TAMAMI DEĞİLDİR`
          : `sonucu yayımlanan ${num(kayitSayisi)} kısmın bedelleri toplamıdır${sonucsuz?` (ihalenin ${num(lot)} kısmından ${num(kayitSayisi)} tanesinde sonuç kaydı var)`:''}`}.
        EKAP kısım bazlı yaklaşık maliyet yayımlamadığından tenzilat kısım kısım hesaplanamaz.</div>` : '';

      const fes=sat.filter(x=>x.fesih_var).length, tas=sat.filter(x=>x.tasfiye_var).length;
      const uyariParca=[];
      const enAz=kesik?'en az ':'';   // kesik veride sayım eksik kalır, öyle sun
      if(fes) uyariParca.push(cokKisim?`${enAz}<b>${num(fes)}</b> kısımda sözleşme <b>feshedilmiş</b>`:'Sözleşme <b>feshedilmiş</b>');
      if(tas) uyariParca.push(cokKisim?`${enAz}<b>${num(tas)}</b> kısımda <b>tasfiye / devir</b> var`:'Sözleşmede <b>tasfiye / devir</b> var');
      const uyari=uyariParca.length?`<div class="v1-sonuc-uyari">⚠ ${uyariParca.join(' · ')}</div>`:'';

      kap.innerHTML=`
        <div class="v1-kart"><div class="v1-kart-baslik">İhale Sonucu${cokKisim?` <span class="v1-d-rozet teal" style="color:#fff;">${num(lot)} kısım</span>`:''}</div>
          <div class="v1-sonuc-kart"><div class="v1-sonuc-grid">
            <div><b>Kazanan Firma</b>${firmaHtml}</div>
            <div><b>${bedelEtiket}</b><span>${toplam?tl(toplam):'—'}</span></div>
            ${tenzHtml}
            ${katilimciHtml}
            <div><b>Sonuç Tarihi</b><span class="kucuk"${tarihKapsam}>${gun(ilkSonuc)||'—'}</span></div>
            ${sonBitis?`<div><b>İş Bitiş</b><span class="kucuk"${tarihKapsam}>${gun(sonBitis)}</span></div>`:''}
          </div>${not}${uyari}${kisimTablo}</div></div>`;
    }catch(e){
      kap.innerHTML=`<div class="v1-kart"><div class="v1-kart-baslik">İhale Sonucu</div>
        <div class="v1-bos">Sonuç bilgisi yüklenemedi. ${esc(e.message||'')}</div></div>`;
    }
  }

  // ── Benzer ihaleler — skorlu RPC (idare+il+kategori+başlık kelimesi); RPC yoksa eski filtreye düşer ──
  async function benzerYukle(r){
    const el=document.getElementById('d-benzer');
    const ciz=(data)=>{
      if(!data||!data.length){ el.innerHTML='<div class="v1-bos">Benzer açık ihale bulunamadı.</div>'; return; }
      el.innerHTML=data.map(i=>{
        const g=i.son_teklif_tarihi?Math.max(0,Math.ceil((new Date(i.son_teklif_tarihi)-new Date())/86400000)):null;
        const alt=[esc(i.il||'—'), i.tur?esc(i.tur):null, i.neden?esc(i.neden):null].filter(Boolean).join(' · ');
        return `<a class="v1-satir" href="v1-ihale-detay?id=${i.id}" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--v1-cizgi);text-decoration:none;color:inherit;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(i.baslik||'İhale')}</div>
            <div style="font-size:11.5px;color:var(--v1-muted);margin-top:2px;">${alt}</div>
          </div>
          ${g!=null?`<span style="flex-shrink:0;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;
            background:${g<=3?'#FDECEE':'var(--v1-mavi-acik)'};color:${g<=3?'var(--v1-kirmizi)':'var(--v1-mavi)'};">Son ${g} gün</span>`:''}</a>`;
      }).join('');
    };
    try{
      const {data,error}=await sb.rpc('benzer_ihaleler',{p_ilan_id:r.id,p_limit:6});
      if(error) throw error;
      ciz(data);
    }catch(_){
      // RPC henüz uygulanmadıysa/hata: eski kategori+tur filtresine düş (bölüm bozulmasın)
      try{
        let q=sb.from('ilanlar').select('id,baslik,il,tur,son_teklif_tarihi')
          .eq('durum','aktif').gte('son_teklif_tarihi',new Date().toISOString()).neq('id',r.id);
        if(r.kategori) q=q.eq('kategori',r.kategori);
        if(r.tur) q=q.eq('tur',r.tur);
        const {data}=await q.order('son_teklif_tarihi',{ascending:true,nullsFirst:true}).limit(6);
        ciz(data);
      }catch(_e){ el.innerHTML='<div class="v1-bos">Yüklenemedi.</div>'; }
    }
  }

  // ── Takip ──
  function yerelTakip(){ try{ return JSON.parse(localStorage.getItem('takipEdilen')||'[]'); }catch(_){ return []; } }
  async function kullaniciId(){
    try{ const {data}=await sb.auth.getSession(); return (data&&data.session&&data.session.user.id)||null; }
    catch(_){ return null; }
  }
  async function takipDurumGuncelle(){
    const b=document.getElementById('d-takip'); if(!b) return;
    let takipte=yerelTakip().includes(id);
    if(uyeMi){
      const uid=await kullaniciId();
      if(uid){
        // kullanici_id filtresi RLS'e ek olarak ELDE de duruyor: politika ileride
        // gevşerse başkasının takip satırı "takipte" göstermesin.
        const {data,error}=await sb.from('takipler').select('ilan_id').eq('kullanici_id',uid).eq('ilan_id',id).limit(1);
        if(!error) takipte=!!(data&&data.length);
      }
    }
    b.textContent = takipte ? '✓ Takipte' : '⭐ Takibe Al';
    b.dataset.takipte = takipte ? '1' : '';
  }
  async function takipToggle(){
    if(!uyeMi){ alert('Takip için giriş yapmalısınız.'); return; }
    const b=document.getElementById('d-takip'); if(!b) return;
    const eski=b.textContent;
    b.disabled=true; b.textContent='…';
    try{
      const uid=await kullaniciId();
      if(!uid) throw new Error('Oturum bulunamadı, lütfen tekrar giriş yapın.');
      // supabase-js YAZMA HATASI FIRLATMAZ, {error} döner → try/catch boş geçer ve
      // kod başarısız işlemde bile "kaydedildi" sanırdı. Hatayı ELLE kontrol et.
      if(b.dataset.takipte){
        const {error}=await sb.from('takipler').delete().eq('kullanici_id',uid).eq('ilan_id',id);
        if(error) throw error;
      }else{
        const {error}=await sb.from('takipler')
          .upsert({kullanici_id:uid,ilan_id:id},{onConflict:'kullanici_id,ilan_id',ignoreDuplicates:true});
        if(error) throw error;
      }
      b.disabled=false;
      await takipDurumGuncelle();
    }catch(e){
      b.disabled=false; b.textContent=eski;
      alert('İşlem başarısız: '+(e.message||'bilinmeyen hata'));
    }
  }

  function takvim(r){
    if(!r.son_teklif_tarihi){ alert('Bu ihalede son teklif tarihi yok.'); return; }
    const d=new Date(r.son_teklif_tarihi); const f=(x)=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ihaleglobal//TR','BEGIN:VEVENT',
      'UID:'+r.id+'@ihaleglobal.com','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(new Date(d.getTime()+36e5)),
      'SUMMARY:'+String(r.baslik||'İhale').replace(/[,;]/g,' '),'DESCRIPTION:İhaleGlobal — son teklif tarihi',
      'URL:https://ihaleglobal.com/v1-ihale-detay?id='+r.id,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
    a.download='ihale.ics'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  }

  function sonGoruntulenenKaydet(r){
    try{
      let l=JSON.parse(localStorage.getItem('sonGoruntulenen')||'[]');
      l=l.filter(x=>x.id!==r.id); l.unshift({id:r.id,baslik:r.baslik,il:r.il});
      localStorage.setItem('sonGoruntulenen',JSON.stringify(l.slice(0,12)));
    }catch(_){}
  }

  (async()=>{
    try{ const {data}=await sb.auth.getSession(); uyeMi=!!(data&&data.session);
      if(window.v1PaketYaz){ if(uyeMi){ const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',data.session.user.id).maybeSingle();
        v1PaketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel'); } else v1PaketYaz('Misafir'); }
    }catch(_){}
    yukle();
  })();
})();
</script>
