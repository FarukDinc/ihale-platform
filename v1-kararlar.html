<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Ömer Faruk Dinç">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KİK Kararları — İhaleGlobal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v1.css?v=4" />
  <style>
    .v1-sayfa-baslik { font-size:22px; font-weight:800; color:var(--v1-lacivert); margin-bottom:4px; }
    .v1-sayfa-alt { font-size:13.5px; color:var(--v1-muted); margin-bottom:16px; }
    .v1-sekmeler { display:flex; gap:24px; border-bottom:2px solid var(--v1-cizgi); margin-bottom:18px; flex-wrap:wrap; }
    .v1-sekme { background:none; border:none; padding:10px 2px 12px; font-family:var(--v1-font); font-size:14.5px;
      font-weight:700; color:var(--v1-muted); cursor:pointer; position:relative; }
    .v1-sekme.aktif { color:var(--v1-lacivert); }
    .v1-sekme.aktif::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:3px; background:var(--v1-mavi); border-radius:2px; }
    .v1-sekme-adet { display:inline-block; margin-left:6px; font-size:11px; font-weight:700; padding:1px 7px;
      border-radius:20px; background:#EFF2F6; color:var(--v1-muted); vertical-align:1px; }
    .v1-sekme.aktif .v1-sekme-adet { background:var(--v1-mavi-acik); color:var(--v1-mavi); }
    .v1-sekme.v1-sekme-bos { opacity:.6; }
    .v1-uyari { background:var(--v1-mavi-acik); border:1px solid #CFE2F5; border-radius:12px; padding:16px 18px;
      font-size:13.5px; margin-bottom:16px; }
    .v1-sonuc-rozet { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
    .v1-tur-rozet { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px;
      background:var(--v1-mavi-acik); color:var(--v1-mavi); white-space:nowrap; }
    .v1-karar-ozet { font-size:12.5px; color:var(--v1-muted); margin-top:4px; line-height:1.5;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .v1-bos-not { background:#F7F9FC; border:1px dashed var(--v1-cizgi); border-radius:12px;
      padding:30px 22px; text-align:center; color:var(--v1-muted); font-size:13.5px; line-height:1.65; }
    .v1-bos-not strong { display:block; color:var(--v1-lacivert); font-size:15px; margin-bottom:6px; }
    .v1-kaynak-link { display:inline-block; margin-top:3px; font-size:11.5px; font-weight:600; }
  </style>
</head>
<body class="v1" data-v1-aktif="kararlar" data-v1-kirinti="Kamu > KİK Kararları">
<div class="v1-app">
  <div class="v1-main">
    <div class="v1-govde">
      <div class="v1-sayfa-baslik">KİK Kararları</div>
      <div class="v1-sayfa-alt">Kamu İhale Kurulu kararları, mahkeme kararları ve tutanaklar — itiraz emsallerini arayın.</div>

      <!-- Sekme kodları canlı DB'deki gerçek karar_turu değerleridir (ölçüm 29 Tem: 775/775 satır
           'uyusmazlik'; 'duzenleyici'/'mahkeme' henüz 0). Eski 'UK'/'MK'/'MT' kodları DB'de HİÇ
           yoktu → üç sekme de boş dönüyordu. Bilinmeyen bir tür girerse "Diğer" sekmesi JS'ten eklenir. -->
      <div class="v1-sekmeler" id="v1-sekmeler">
        <button class="v1-sekme aktif" data-t="" data-ad="Tüm Kararlar">Tümü<span class="v1-sekme-adet" hidden></span></button>
        <button class="v1-sekme" data-t="uyusmazlik" data-ad="Uyuşmazlık Kararları">Uyuşmazlık Kararları<span class="v1-sekme-adet" hidden></span></button>
        <button class="v1-sekme" data-t="duzenleyici" data-ad="Düzenleyici Kararlar">Düzenleyici Kararlar<span class="v1-sekme-adet" hidden></span></button>
        <button class="v1-sekme" data-t="mahkeme" data-ad="Mahkeme Kararları">Mahkeme Kararları<span class="v1-sekme-adet" hidden></span></button>
      </div>

      <div id="v1-misafir" class="v1-uyari" style="display:none;">
        🔒 KİK kararları <strong>üyelere özeldir</strong>.
        <a href="login">Giriş yapın</a> veya <a href="fiyatlandirma_odeme_bolumu">üye olun</a> →
      </div>

      <div class="v1-kart" style="padding:18px 20px;">
        <div class="v1-tablo-bas">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--v1-lacivert);" id="v1-liste-baslik">Tüm Kararlar</div>
            <div class="v1-tablo-sayi" id="v1-sayi">Yükleniyor…</div>
          </div>
          <div class="v1-listede-ara">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--v1-muted)"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
            <input type="text" id="v1-ara-liste" placeholder="Karar no / idare / konu ara">
          </div>
        </div>
        <div id="v1-bos-not" class="v1-bos-not" style="display:none;"></div>
        <div id="v1-tablo-sar" style="overflow-x:auto;">
          <table class="v1-tablo" id="v1-tablo">
            <thead><tr>
              <th style="width:132px;">Karar No<br>Tarih</th>
              <th>Konu / Başlık</th>
              <th style="width:150px;">Karar Türü</th>
              <th style="width:130px;">Sonuç</th>
            </tr></thead>
            <tbody id="v1-tbody"><tr><td colspan="4" class="v1-bos">Yükleniyor…</td></tr></tbody>
          </table>
        </div>
        <div class="v1-sayfalama" id="v1-sayfalama"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- ⚠️ v=7 ŞART (v=6 DEĞİL): bu sayfa window.trFold + window.v1AramaKalibi'ye bağımlı ve bunlar
     kabuk'a SONRADAN eklendi. Canlıdaki v6 kopyasında `trFold` HİÇ geçmiyor (ölçüm 29 Tem: canlı
     14.843 bayt / 0 eşleşme, yerel 16.158 bayt / var). Kabuk `Cache-Control: max-age=14400` ile
     gelir → v=6 istenirse yeni kabuk deploy edilse bile tarayıcı 4 saat boyunca fold'suz kopyayı
     verir ve liste "trFold is not a function" ile tamamen ölür. v1-sektorler.html de v=7'de. -->
<script src="js/v1-kabuk.js?v=8"></script>
<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // ⚠️ TR katlama js/v1-kabuk.js'ten gelir (window.trFold / window.v1AramaKalibi). Sayfaya özel
  //    kopya YAZMA: eski yerel kopya 'ı'yı 'i'ye katlamıyordu → "ISPARTA" araması SQL tr_fold()
  //    ile hizalanmadığı için sessizce 0 satır dönüyordu.
  const fold=(s)=>window.trFold(s);
  const BOY=20;
  const BILINEN=['uyusmazlik','duzenleyici','mahkeme'];   // canlı DB'de geçerli karar_turu kodları
  const DIGER='__diger';                                   // bilinmeyen türler için sanal sekme kodu
  // ⚠️ Düz .not('karar_turu','in',...) NULL'ları da ELER: SQL'de NOT (NULL IN (...)) = NULL → satır
  //    düşer. "Diğer" sekmesinin tüm amacı bilinmeyen türü göstermek ve en olası bilinmeyen NULL'dur;
  //    not.in tek başına onu hem sayımdan hem listeden sessizce siler. is.null dalı bu yüzden şart.
  //    (Canlı doğrulama: PostgREST aynı istekteki iki `or=` parametresini AND'ler — kesişim testinde
  //     or1∩or2 = [] döndü — yani bu filtre arama or()'ıyla çakışmadan birlikte çalışıyor.)
  const DIGER_FILTRE='karar_turu.is.null,karar_turu.not.in.('+BILINEN.join(',')+')';
  // kaynak_url canlıda 775/775 NULL; dolduğunda `javascript:` taşıyan satır depolanmış XSS olur.
  const guvenliUrl=(u)=>/^https?:\/\//i.test(u||'')?u:'';
  let uyeMi=false, tur='', sayfa=1, aramaT, turAdet={};

  // Ham DB kodu → kullanıcıya gösterilen Türkçe etiket (ham 'uyusmazlik' gösterilmez).
  const TUR_ETIKET={
    'uyusmazlik':'Uyuşmazlık Kararı',
    'duzenleyici':'Düzenleyici Karar',
    'mahkeme':'Mahkeme Kararı',
    'tutanak':'Kurul Tutanağı',
  };
  const turEtiket=(t)=>{ const ham=(t||'').trim(); if(!ham) return '—'; return TUR_ETIKET[fold(ham)]||ham; };

  // Sonuç rozeti. ⚠️ 'diger' = "sonuç bilgisi yayımlanmamış" demek, KABUL DEĞİL — canlıda 775/775
  //    satır 'diger' olduğu için eski varsayılan-yeşil dal tüm listeyi "kabul" gibi gösteriyordu.
  //    Nötr gri artık varsayılan; yalnız gerçek kabul/ret/iptal değerleri renklenir.
  const NOTR={bg:'#EFF2F6',fg:'var(--v1-muted)'};
  const sonucBilgi=(s)=>{
    const ham=(s||'').trim(), x=fold(ham);
    if(!ham||x==='diger'||x==='bilinmiyor'||x==='belirsiz')
      return {ad:'Belirtilmemiş',bg:NOTR.bg,fg:NOTR.fg,ipucu:'Kurul karar listesinde kabul/ret/iptal bilgisi yayımlanmıyor'};
    if(x.includes('iptal'))  return {ad:ham,bg:'#FDECEE',fg:'var(--v1-kirmizi)',ipucu:''};
    if(x.includes('duzelt')) return {ad:ham,bg:'var(--v1-mavi-acik)',fg:'var(--v1-mavi)',ipucu:''};
    if(x.includes('kabul'))  return {ad:ham,bg:'#E6F6EC',fg:'var(--v1-yesil)',ipucu:''};
    if(x.includes('red')||x.includes('ret')) return {ad:ham,bg:'#FDECEE',fg:'var(--v1-kirmizi)',ipucu:''};
    return {ad:ham,bg:NOTR.bg,fg:NOTR.fg,ipucu:''};        // tanınmayan değer → nötr, uydurma renk yok
  };

  const aktifSekme=()=>document.querySelector('.v1-sekme.aktif');
  const aktifAd=()=>{ const b=aktifSekme(); return b?(b.dataset.ad||b.dataset.t||'Kararlar'):'Kararlar'; };

  // Sekme başına gerçek satır sayısı — hangi sekmenin boş olduğunu tahmin etmeyip ölçüyoruz.
  async function adetleriYukle(){
    try{
      const say=(f)=>{ let q=sb.from('kik_kararlar').select('id',{count:'exact',head:true}); return f?f(q):q; };
      const istek=[say(null)].concat(
        BILINEN.map(k=>say(q=>q.eq('karar_turu',k))),
        [say(q=>q.or(DIGER_FILTRE))]
      );
      const c=await Promise.all(istek);
      if(c.some(r=>r.error)) return;                        // sayım başarısızsa rozet göstermeyiz
      turAdet={'':c[0].count||0};
      BILINEN.forEach((k,i)=>{ turAdet[k]=c[i+1].count||0; });
      turAdet[DIGER]=c[BILINEN.length+1].count||0;
      if(turAdet[DIGER]>0) digerSekmesiEkle();
      rozetleriYaz();
    }catch(_){}
  }

  function digerSekmesiEkle(){
    if(document.querySelector('.v1-sekme[data-t="'+DIGER+'"]')) return;
    const b=document.createElement('button');
    b.className='v1-sekme'; b.dataset.t=DIGER; b.dataset.ad='Diğer Kararlar';
    b.innerHTML='Diğer Kararlar<span class="v1-sekme-adet" hidden></span>';
    b.addEventListener('click',()=>sekmeSec(b));
    document.getElementById('v1-sekmeler').appendChild(b);
  }

  const aramaMetni=()=>((document.getElementById('v1-ara-liste')||{}).value||'').trim();

  function rozetleriYaz(){
    // Rozet = arşivdeki toplam. Arama açıkken gizlenir; yoksa "775" rozetiyle "12 karar
    // listeleniyor" satırı yan yana durup kullanıcıyı yanıltır.
    const aramaVar=!!aramaMetni();
    document.querySelectorAll('.v1-sekme').forEach(b=>{
      const n=turAdet[b.dataset.t], s=b.querySelector('.v1-sekme-adet');
      if(!s) return;
      if(n==null||aramaVar){ s.hidden=true; b.classList.toggle('v1-sekme-bos',!aramaVar&&n===0); return; }
      s.hidden=false; s.textContent=num(n);
      b.classList.toggle('v1-sekme-bos',n===0);
    });
  }

  // Boş sekmede "hangi sekmede veri var" bilgisi — sabit cümle yerine ölçülen adetlerden.
  function doluSekmeler(){
    return Array.from(document.querySelectorAll('.v1-sekme'))
      .filter(b=>b.dataset.t&&b.dataset.t!==tur&&turAdet[b.dataset.t]>0)
      .map(b=>b.dataset.ad);
  }

  function bosGoster(html){
    document.getElementById('v1-tablo-sar').style.display='none';
    document.getElementById('v1-sayfalama').innerHTML='';
    const el=document.getElementById('v1-bos-not');
    el.style.display='block'; el.innerHTML=html;
  }
  function tabloGoster(){
    document.getElementById('v1-tablo-sar').style.display='';
    document.getElementById('v1-bos-not').style.display='none';
  }

  async function yukle(){
    const tb=document.getElementById('v1-tbody');
    if(!uyeMi){
      document.getElementById('v1-misafir').style.display='block';
      document.getElementById('v1-sayi').textContent='';
      bosGoster('<strong>🔒 Üyelere özel liste</strong>Emsal kararları görmek için <a href="login">giriş yapın</a>.');
      return;
    }
    tabloGoster(); rozetleriYaz();
    tb.innerHTML='<tr><td colspan="4" class="v1-bos">Yükleniyor…</td></tr>';
    try{
      const k=aramaMetni();
      const kur=(sayimIcin)=>{
        let q=sb.from('kik_kararlar').select(
          sayimIcin?'id':'id,karar_no,karar_tarihi,karar_turu,sonuc,baslik,idare,ihale_konusu,kaynak_url,ozet',
          sayimIcin?{count:'exact',head:true}:undefined);
        if(tur===DIGER)  q=q.or(DIGER_FILTRE);   // NULL dahil (bkz. DIGER_FILTRE notu)
        else if(tur)     q=q.eq('karar_turu',tur);
        // ⚠️ Düz .ilike('baslik',...) Türkçe İ/ı'da sessizce 0 döner. arama_fold = tr_fold(baslik+
        //    idare+ihale_konusu+ozet) ve kik_kararlar'da anon'a AÇIK (curl ile doğrulandı).
        //    karar_no fold kolonuna dahil değil → or() ile ayrıca aranıyor (kutu "Karar no" diyor).
        // ⚠️ Tırnak/iki nokta ELLE temizleniyor: KİK başlıkları " içeriyor, kullanıcı başlığı
        //    kopyalayıp yapıştırınca PostgREST or() tırnağı yutup SESSİZCE [] döndürüyor
        //    (canlı test: or=(...ilike.*"belediye"*) -> [] , tırnaksız -> 2 satır).
        if(k){ const kal=window.v1AramaKalibi(k.replace(/["':]/g,' ')); q=q.or(`arama_fold.ilike.${kal},karar_no.ilike.${kal}`); }
        return q;
      };
      const bas=(sayfa-1)*BOY;
      const [veri,sayim]=await Promise.all([
        kur(false).order('karar_tarihi',{ascending:false,nullsFirst:false}).range(bas,bas+BOY-1),
        kur(true).then(r=>r).catch(()=>({count:null})),
      ]);
      if(veri.error) throw veri.error;
      const toplam=(sayim&&sayim.count!=null)?sayim.count:null;
      const d=veri.data||[];
      if(!d.length){
        document.getElementById('v1-sayi').textContent='0 karar';
        if(k){
          bosGoster(`<strong>Aramanıza uygun karar bulunamadı.</strong>“${esc(k)}” için sonuç yok — karar numarası, idare adı veya ihale konusundan tek bir kelime deneyin.`);
        } else if(tur){
          const dolu=doluSekmeler();
          bosGoster(`<strong>Bu türde henüz karar yok.</strong>“${esc(aktifAd())}” arşivi henüz aktarılmadı — arşiv backfill'i bekliyor.`
            +(dolu.length?`<br>Şu an dolu olan sekmeler: ${esc(dolu.join(', '))}.`:''));
        } else {
          bosGoster('<strong>Henüz karar kaydı yok.</strong>KİK karar arşivi hazırlanıyor.');
        }
        return;
      }
      tabloGoster();
      document.getElementById('v1-sayi').innerHTML = toplam!=null
        ? `Arama kriterinize uygun <strong>${num(toplam)}</strong> karar listeleniyor`
        : `<strong>${d.length}</strong> karar gösteriliyor`;
      tb.innerHTML=d.map(r=>{
        const sn=sonucBilgi(r.sonuc);
        const t=r.karar_tarihi?new Date(r.karar_tarihi).toLocaleDateString('tr-TR'):'—';
        const url=guvenliUrl(r.kaynak_url);
        const link=url?`<br><a class="v1-kaynak-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Kaynak ↗</a>`:'';
        return `<tr>
          <td class="v1-t-tarih"><strong style="color:var(--v1-lacivert);">${esc(r.karar_no||'—')}</strong><br><span class="saat">${t}</span>${link}</td>
          <td><div class="v1-t-ad" style="font-weight:600;">${esc(r.baslik||r.ihale_konusu||'—')}</div>
            <div class="v1-karar-ozet">${esc(r.idare||'')}${r.ozet?' · '+esc(r.ozet):''}</div></td>
          <td><span class="v1-tur-rozet">${esc(turEtiket(r.karar_turu))}</span></td>
          <td><span class="v1-sonuc-rozet" style="background:${sn.bg};color:${sn.fg};"${sn.ipucu?` title="${esc(sn.ipucu)}"`:''}>${esc(sn.ad)}</span></td></tr>`;
      }).join('');
      sayfalama(toplam,d.length);
    }catch(e){
      tabloGoster();
      tb.innerHTML=`<tr><td colspan="4" class="v1-bos">Liste yüklenemedi. ${esc(e.message||'')}</td></tr>`;
      document.getElementById('v1-sayfalama').innerHTML='';
    }
  }

  function sayfalama(toplam,adet){
    const el=document.getElementById('v1-sayfalama');
    if(toplam==null){
      el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹ Önceki</button><button class="aktif" disabled>${sayfa}</button><button ${adet<BOY?'disabled':''} data-s="${sayfa+1}">Sonraki ›</button>`;
    } else {
      const son=Math.max(1,Math.ceil(toplam/BOY));
      if(son<=1){ el.innerHTML=''; return; }
      const g=[]; const b1=Math.max(1,sayfa-2), b2=Math.min(son,b1+4);
      for(let i=b1;i<=b2;i++) g.push(i);
      el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹</button>`+
        g.map(i=>`<button class="${i===sayfa?'aktif':''}" data-s="${i}">${i}</button>`).join('')+
        `<button ${sayfa===son?'disabled':''} data-s="${sayfa+1}">›</button>`;
    }
    el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
    }));
  }

  // ⚠️ Başlık için b.textContent KULLANMA: sekmenin içinde adet rozeti var, sayı da başlığa sızar.
  function sekmeSec(b){
    document.querySelectorAll('.v1-sekme').forEach(x=>x.classList.remove('aktif'));
    b.classList.add('aktif');
    tur=b.dataset.t||''; sayfa=1;
    document.getElementById('v1-liste-baslik').textContent=b.dataset.ad||'Tüm Kararlar';
    rozetleriYaz();
    yukle();
  }

  (async()=>{
    // ⚠️ Kabuk bağımlılığı SESSİZ ÖLMESİN: fold ilk satır render'ında çağrılır, eksikse try/catch
    //    onu yutup jenerik "Liste yüklenemedi" yazar ve gerçek sebep (bayat kabuk) görünmez.
    //    Burada erken ve AÇIKÇA söylüyoruz. Yerel fold kopyası YAZILMAZ — kopyanın SQL tr_fold()'dan
    //    sapması ISPARTA aramasını sessizce 0 satıra düşüren asıl bug'dı.
    if(typeof window.trFold!=='function'||typeof window.v1AramaKalibi!=='function'){
      document.getElementById('v1-sayi').textContent='';
      bosGoster('<strong>Sayfa bileşeni eksik yüklendi.</strong>Arama yardımcıları (js/v1-kabuk.js) bayat sürümden geldi. Sayfayı yenileyin; sürerse tarayıcı önbelleğini temizleyin.');
      return;
    }
    try{ const {data}=await sb.auth.getSession(); uyeMi=!!(data&&data.session);
      if(window.v1PaketYaz){ if(uyeMi){ const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',data.session.user.id).maybeSingle();
