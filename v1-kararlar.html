<script src="js/v1-kabuk.js?v=15"></script>
<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // âš ï¸ TR katlama js/v1-kabuk.js'ten gelir (window.trFold / window.v1AramaKalibi). Sayfaya Ã¶zel
  //    kopya YAZMA: eski yerel kopya 'Ä±'yÄ± 'i'ye katlamÄ±yordu â†’ "ISPARTA" aramasÄ± SQL tr_fold()
  //    ile hizalanmadÄ±ÄŸÄ± iÃ§in sessizce 0 satÄ±r dÃ¶nÃ¼yordu.
  const fold=(s)=>window.trFold(s);
  const BOY=20;
  const BILINEN=['uyusmazlik','duzenleyici','mahkeme'];   // canlÄ± DB'de geÃ§erli karar_turu kodlarÄ±
  const DIGER='__diger';                                   // bilinmeyen tÃ¼rler iÃ§in sanal sekme kodu
  // âš ï¸ DÃ¼z .not('karar_turu','in',...) NULL'larÄ± da ELER: SQL'de NOT (NULL IN (...)) = NULL â†’ satÄ±r
  //    dÃ¼ÅŸer. "DiÄŸer" sekmesinin tÃ¼m amacÄ± bilinmeyen tÃ¼rÃ¼ gÃ¶stermek ve en olasÄ± bilinmeyen NULL'dur;
  //    not.in tek baÅŸÄ±na onu hem sayÄ±mdan hem listeden sessizce siler. is.null dalÄ± bu yÃ¼zden ÅŸart.
  //    (CanlÄ± doÄŸrulama: PostgREST aynÄ± istekteki iki `or=` parametresini AND'ler â€” kesiÅŸim testinde
  //     or1âˆ©or2 = [] dÃ¶ndÃ¼ â€” yani bu filtre arama or()'Ä±yla Ã§akÄ±ÅŸmadan birlikte Ã§alÄ±ÅŸÄ±yor.)
  const DIGER_FILTRE='karar_turu.is.null,karar_turu.not.in.('+BILINEN.join(',')+')';
  // kaynak_url canlÄ±da 775/775 NULL; dolduÄŸunda `javascript:` taÅŸÄ±yan satÄ±r depolanmÄ±ÅŸ XSS olur.
  const guvenliUrl=(u)=>/^https?:\/\//i.test(u||'')?u:'';
  let uyeMi=false, tur='', sayfa=1, aramaT, turAdet={};

  // Ham DB kodu â†’ kullanÄ±cÄ±ya gÃ¶sterilen TÃ¼rkÃ§e etiket (ham 'uyusmazlik' gÃ¶sterilmez).
  const TUR_ETIKET={
    'uyusmazlik':'UyuÅŸmazlÄ±k KararÄ±',
    'duzenleyici':'DÃ¼zenleyici Karar',
    'mahkeme':'Mahkeme KararÄ±',
    'tutanak':'Kurul TutanaÄŸÄ±',
  };
  const turEtiket=(t)=>{ const ham=(t||'').trim(); if(!ham) return 'â€”'; return TUR_ETIKET[fold(ham)]||ham; };

  // SonuÃ§ rozeti. âš ï¸ 'diger' = "sonuÃ§ bilgisi yayÄ±mlanmamÄ±ÅŸ" demek, KABUL DEÄÄ°L â€” canlÄ±da 775/775
  //    satÄ±r 'diger' olduÄŸu iÃ§in eski varsayÄ±lan-yeÅŸil dal tÃ¼m listeyi "kabul" gibi gÃ¶steriyordu.
  //    NÃ¶tr gri artÄ±k varsayÄ±lan; yalnÄ±z gerÃ§ek kabul/ret/iptal deÄŸerleri renklenir.
  const NOTR={bg:'#EFF2F6',fg:'var(--v1-muted)'};
  const sonucBilgi=(s)=>{
    const ham=(s||'').trim(), x=fold(ham);
    if(!ham||x==='diger'||x==='bilinmiyor'||x==='belirsiz')
      return {ad:'BelirtilmemiÅŸ',bg:NOTR.bg,fg:NOTR.fg,ipucu:'Kurul karar listesinde kabul/ret/iptal bilgisi yayÄ±mlanmÄ±yor'};
    if(x.includes('iptal'))  return {ad:ham,bg:'#FDECEE',fg:'var(--v1-kirmizi)',ipucu:''};
    if(x.includes('duzelt')) return {ad:ham,bg:'var(--v1-mavi-acik)',fg:'var(--v1-mavi)',ipucu:''};
    if(x.includes('kabul'))  return {ad:ham,bg:'#E6F6EC',fg:'var(--v1-yesil)',ipucu:''};
    if(x.includes('red')||x.includes('ret')) return {ad:ham,bg:'#FDECEE',fg:'var(--v1-kirmizi)',ipucu:''};
    return {ad:ham,bg:NOTR.bg,fg:NOTR.fg,ipucu:''};        // tanÄ±nmayan deÄŸer â†’ nÃ¶tr, uydurma renk yok
  };

  const aktifSekme=()=>document.querySelector('.v1-sekme.aktif');
  const aktifAd=()=>{ const b=aktifSekme(); return b?(b.dataset.ad||b.dataset.t||'Kararlar'):'Kararlar'; };

  // Sekme baÅŸÄ±na gerÃ§ek satÄ±r sayÄ±sÄ± â€” hangi sekmenin boÅŸ olduÄŸunu tahmin etmeyip Ã¶lÃ§Ã¼yoruz.
  async function adetleriYukle(){
    try{
      const say=(f)=>{ let q=sb.from('kik_kararlar').select('id',{count:'exact',head:true}); return f?f(q):q; };
      const istek=[say(null)].concat(
        BILINEN.map(k=>say(q=>q.eq('karar_turu',k))),
        [say(q=>q.or(DIGER_FILTRE))]
      );
      const c=await Promise.all(istek);
      if(c.some(r=>r.error)) return;                        // sayÄ±m baÅŸarÄ±sÄ±zsa rozet gÃ¶stermeyiz
      turAdet={'':c[0].count||0};
      BILINEN.forEach((k,i)=>{ turAdet[k]=c[i+1].count||0; });
      turAdet[DIGER]=c[BILINEN.length+1].count||0;
      if(turAdet[DIGER]>0) digerSekmesiEkle();
      rozetleriYaz();
    }catch(_){}
  }

  function digerSekmesiEkle(){
    if(document.querySelector('.v1-sekme[data-t="'+DIGER+'"]')) return;
    const b=document.createElement('button');
    b.className='v1-sekme'; b.dataset.t=DIGER; b.dataset.ad='DiÄŸer Kararlar';
    b.innerHTML='DiÄŸer Kararlar<span class="v1-sekme-adet" hidden></span>';
    b.addEventListener('click',()=>sekmeSec(b));
    document.getElementById('v1-sekmeler').appendChild(b);
  }

  const aramaMetni=()=>((document.getElementById('v1-ara-liste')||{}).value||'').trim();

  function rozetleriYaz(){
    // Rozet = arÅŸivdeki toplam. Arama aÃ§Ä±kken gizlenir; yoksa "775" rozetiyle "12 karar
    // listeleniyor" satÄ±rÄ± yan yana durup kullanÄ±cÄ±yÄ± yanÄ±ltÄ±r.
    const aramaVar=!!aramaMetni();
    document.querySelectorAll('.v1-sekme').forEach(b=>{
      const n=turAdet[b.dataset.t], s=b.querySelector('.v1-sekme-adet');
      if(!s) return;
      if(n==null||aramaVar){ s.hidden=true; b.classList.toggle('v1-sekme-bos',!aramaVar&&n===0); return; }
      s.hidden=false; s.textContent=num(n);
      b.classList.toggle('v1-sekme-bos',n===0);
    });
  }

  // BoÅŸ sekmede "hangi sekmede veri var" bilgisi â€” sabit cÃ¼mle yerine Ã¶lÃ§Ã¼len adetlerden.
  function doluSekmeler(){
    return Array.from(document.querySelectorAll('.v1-sekme'))
      .filter(b=>b.dataset.t&&b.dataset.t!==tur&&turAdet[b.dataset.t]>0)
      .map(b=>b.dataset.ad);
  }

  function bosGoster(html){
    document.getElementById('v1-tablo-sar').style.display='none';
    document.getElementById('v1-sayfalama').innerHTML='';
    const el=document.getElementById('v1-bos-not');
    el.style.display='block'; el.innerHTML=html;
  }
  function tabloGoster(){
    document.getElementById('v1-tablo-sar').style.display='';
    document.getElementById('v1-bos-not').style.display='none';
  }

  async function yukle(){
    const tb=document.getElementById('v1-tbody');
    if(!uyeMi){
      document.getElementById('v1-misafir').style.display='block';
      document.getElementById('v1-sayi').textContent='';
      bosGoster('<strong>ğŸ”’ Ãœyelere Ã¶zel liste</strong>Emsal kararlarÄ± gÃ¶rmek iÃ§in <a href="login">giriÅŸ yapÄ±n</a>.');
      return;
    }
    tabloGoster(); rozetleriYaz();
    tb.innerHTML='<tr><td colspan="4" class="v1-bos">YÃ¼kleniyorâ€¦</td></tr>';
    try{
      const k=aramaMetni();
      const kur=(sayimIcin)=>{
        let q=sb.from('kik_kararlar').select(
          sayimIcin?'id':'id,karar_no,karar_tarihi,karar_turu,sonuc,baslik,idare,ihale_konusu,kaynak_url,ozet',
          sayimIcin?{count:'exact',head:true}:undefined);
        if(tur===DIGER)  q=q.or(DIGER_FILTRE);   // NULL dahil (bkz. DIGER_FILTRE notu)
        else if(tur)     q=q.eq('karar_turu',tur);
        // âš ï¸ DÃ¼z .ilike('baslik',...) TÃ¼rkÃ§e Ä°/Ä±'da sessizce 0 dÃ¶ner. arama_fold = tr_fold(baslik+
        //    idare+ihale_konusu+ozet) ve kik_kararlar'da anon'a AÃ‡IK (curl ile doÄŸrulandÄ±).
        //    karar_no fold kolonuna dahil deÄŸil â†’ or() ile ayrÄ±ca aranÄ±yor (kutu "Karar no" diyor).
        // âš ï¸ TÄ±rnak/iki nokta ELLE temizleniyor: KÄ°K baÅŸlÄ±klarÄ± " iÃ§eriyor, kullanÄ±cÄ± baÅŸlÄ±ÄŸÄ±
        //    kopyalayÄ±p yapÄ±ÅŸtÄ±rÄ±nca PostgREST or() tÄ±rnaÄŸÄ± yutup SESSÄ°ZCE [] dÃ¶ndÃ¼rÃ¼yor
        //    (canlÄ± test: or=(...ilike.*"belediye"*) -> [] , tÄ±rnaksÄ±z -> 2 satÄ±r).
        if(k){ const kal=window.v1AramaKalibi(k.replace(/["':]/g,' ')); q=q.or(`arama_fold.ilike.${kal},karar_no.ilike.${kal}`); }
        return q;
      };
      const bas=(sayfa-1)*BOY;
      const [veri,sayim]=await Promise.all([
        kur(false).order('karar_tarihi',{ascending:false,nullsFirst:false}).range(bas,bas+BOY-1),
        kur(true).then(r=>r).catch(()=>({count:null})),
      ]);
      if(veri.error) throw veri.error;
      const toplam=(sayim&&sayim.count!=null)?sayim.count:null;
      const d=veri.data||[];
      if(!d.length){
        document.getElementById('v1-sayi').textContent='0 karar';
        if(k){
          bosGoster(`<strong>AramanÄ±za uygun karar bulunamadÄ±.</strong>â€œ${esc(k)}â€ iÃ§in sonuÃ§ yok â€” karar numarasÄ±, idare adÄ± veya ihale konusundan tek bir kelime deneyin.`);
        } else if(tur){
          const dolu=doluSekmeler();
          bosGoster(`<strong>Bu tÃ¼rde henÃ¼z karar yok.</strong>â€œ${esc(aktifAd())}â€ arÅŸivi henÃ¼z aktarÄ±lmadÄ± â€” arÅŸiv backfill'i bekliyor.`
            +(dolu.length?`<br>Åu an dolu olan sekmeler: ${esc(dolu.join(', '))}.`:''));
        } else {
          bosGoster('<strong>HenÃ¼z karar kaydÄ± yok.</strong>KÄ°K karar arÅŸivi hazÄ±rlanÄ±yor.');
        }
        return;
      }
      tabloGoster();
      document.getElementById('v1-sayi').innerHTML = toplam!=null
        ? `Arama kriterinize uygun <strong>${num(toplam)}</strong> karar listeleniyor`
        : `<strong>${d.length}</strong> karar gÃ¶steriliyor`;
      tb.innerHTML=d.map(r=>{
        const sn=sonucBilgi(r.sonuc);
        const t=r.karar_tarihi?new Date(r.karar_tarihi).toLocaleDateString('tr-TR'):'â€”';
        const url=guvenliUrl(r.kaynak_url);
        const link=url?`<br><a class="v1-kaynak-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Kaynak â†—</a>`:'';
        return `<tr>
          <td class="v1-t-tarih"><strong style="color:var(--v1-lacivert);">${esc(r.karar_no||'â€”')}</strong><br><span class="saat">${t}</span>${link}</td>
          <td><div class="v1-t-ad" style="font-weight:600;">${esc(r.baslik||r.ihale_konusu||'â€”')}</div>
            <div class="v1-karar-ozet">${esc(r.idare||'')}${r.ozet?' Â· '+esc(r.ozet):''}</div></td>
          <td><span class="v1-tur-rozet">${esc(turEtiket(r.karar_turu))}</span></td>
          <td><span class="v1-sonuc-rozet" style="background:${sn.bg};color:${sn.fg};"${sn.ipucu?` title="${esc(sn.ipucu)}"`:''}>${esc(sn.ad)}</span></td></tr>`;
      }).join('');
      sayfalama(toplam,d.length);
    }catch(e){
      tabloGoster();
      tb.innerHTML=`<tr><td colspan="4" class="v1-bos">Liste yÃ¼klenemedi. ${esc(e.message||'')}</td></tr>`;
      document.getElementById('v1-sayfalama').innerHTML='';
    }
  }

  function sayfalama(toplam,adet){
    const el=document.getElementById('v1-sayfalama');
    if(toplam==null){
      el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">â€¹ Ã–nceki</button><button class="aktif" disabled>${sayfa}</button><button ${adet<BOY?'disabled':''} data-s="${sayfa+1}">Sonraki â€º</button>`;
    } else {
      const son=Math.max(1,Math.ceil(toplam/BOY));
      if(son<=1){ el.innerHTML=''; return; }
      const g=[]; const b1=Math.max(1,sayfa-2), b2=Math.min(son,b1+4);
      for(let i=b1;i<=b2;i++) g.push(i);
      el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">â€¹</button>`+
        g.map(i=>`<button class="${i===sayfa?'aktif':''}" data-s="${i}">${i}</button>`).join('')+
        `<button ${sayfa===son?'disabled':''} data-s="${sayfa+1}">â€º</button>`;
    }
    el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
    }));
  }

  // âš ï¸ BaÅŸlÄ±k iÃ§in b.textContent KULLANMA: sekmenin iÃ§inde adet rozeti var, sayÄ± da baÅŸlÄ±ÄŸa sÄ±zar.
  function sekmeSec(b){
    document.querySelectorAll('.v1-sekme').forEach(x=>x.classList.remove('aktif'));
    b.classList.add('aktif');
