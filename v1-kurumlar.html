<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Ömer Faruk Dinç">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurumlar — İhaleGlobal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v1.css?v=6" />
  <style>
    .v1-sayfa-baslik { font-size:22px; font-weight:800; color:var(--v1-lacivert); margin-bottom:4px; }
    .v1-sayfa-alt { font-size:13.5px; color:var(--v1-muted); margin-bottom:16px; }
    .v1-sekmeler { display:flex; gap:26px; border-bottom:2px solid var(--v1-cizgi); margin-bottom:18px; flex-wrap:wrap; }
    .v1-sekme { background:none; border:none; padding:10px 2px 12px; font-family:var(--v1-font); font-size:15px;
      font-weight:700; color:var(--v1-muted); cursor:pointer; position:relative; }
    .v1-sekme.aktif { color:var(--v1-lacivert); }
    .v1-sekme.aktif::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:3px; background:var(--v1-mavi); border-radius:2px; }
    .v1-bar-wrap { width:100%; height:8px; background:#EDF1F6; border-radius:5px; overflow:hidden; }
    .v1-bar { display:block; height:100%; background:var(--v1-mavi); border-radius:5px; }
    .v1-uyari { background:var(--v1-mavi-acik); border:1px solid #CFE2F5; border-radius:12px; padding:16px 18px;
      font-size:13.5px; color:var(--v1-metin); margin-bottom:16px; }
  </style>
</head>
<body class="v1" data-v1-aktif="kurumlar" data-v1-kirinti="İhaleGlobal > Kurumlar">
<div class="v1-app">
  <div class="v1-main">
    <div class="v1-govde">
      <div class="v1-sayfa-baslik">İşveren Kurumlar</div>
      <div class="v1-sayfa-alt">İhale açan idareler — hangi kurum kaç ihale açmış, kaçı şu an aktif.</div>

      <div class="v1-sekmeler">
        <button class="v1-sekme aktif" id="s-tum">Tüm Kurumlar</button>
        <button class="v1-sekme" id="s-takip">Takip Ettiklerim</button>
      </div>

      <div id="v1-misafir" class="v1-uyari" style="display:none;">
        🔒 Kurum listesi <strong>üyelere özeldir</strong>.
        <a href="login">Giriş yapın</a> veya <a href="fiyatlandirma_odeme_bolumu">üye olun</a> →
      </div>

      <div class="v1-kart" style="padding:18px 20px;">
        <div class="v1-tablo-bas">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--v1-lacivert);" id="v1-liste-baslik">Tüm Kurumlar</div>
            <div class="v1-tablo-sayi" id="v1-sayi">Yükleniyor…</div>
          </div>
          <div class="v1-listede-ara">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--v1-muted)"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
            <input type="text" id="v1-ara-liste" placeholder="Kurum ara">
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="v1-tablo" id="v1-tablo">
            <thead><tr>
              <th style="width:44px;">#</th><th>İdare / Kurum</th>
              <th style="width:100px;">İl</th>
              <th style="width:210px;">Toplam İhale</th>
              <th style="width:100px;">Aktif</th>
              <th style="width:120px;"></th>
            </tr></thead>
            <tbody id="v1-tbody"><tr><td colspan="6" class="v1-bos">Yükleniyor…</td></tr></tbody>
          </table>
        </div>
        <div class="v1-sayfalama" id="v1-sayfalama"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/v1-kabuk.js?v=9"></script>
<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const P=new URLSearchParams(location.search);
  const BOY=25;
  let tumu=[], takipli=new Set(), uyeMi=false, mod='tum', sayfa=1;

  async function yukle(){
    const tb=document.getElementById('v1-tbody');
    if(!uyeMi){
      document.getElementById('v1-misafir').style.display='block';
      tb.innerHTML='<tr><td colspan="6" class="v1-bos">🔒 Kurum listesi üyelere özeldir. <a href="login">Giriş yapın →</a></td></tr>';
      document.getElementById('v1-sayi').textContent=''; return;
    }
    try{
      const {data,error}=await sb.rpc('idare_sayim');
      if(error) throw error;
      tumu=(data||[]).slice().sort((a,b)=>(b.toplam||0)-(a.toplam||0));
      try{ const {data:t}=await sb.from('takip_idareler').select('idare_ad'); (t||[]).forEach(r=>takipli.add(r.idare_ad)); }catch(_){}
      ciz();
    }catch(e){ tb.innerHTML=`<tr><td colspan="6" class="v1-bos">Liste yüklenemedi. ${esc(e.message||'')}</td></tr>`; }
  }

  function ciz(){
    const tb=document.getElementById('v1-tbody');
    const q=(document.getElementById('v1-ara-liste').value||'').toLocaleLowerCase('tr');
    let liste=tumu;
    if(mod==='takip') liste=liste.filter(r=>takipli.has(r.idare));
    if(q) liste=liste.filter(r=>(r.idare||'').toLocaleLowerCase('tr').includes(q));
    const toplamAdet=liste.length;
    const max=Math.max(1,...liste.slice(0,200).map(r=>r.toplam||0));
    const bas=(sayfa-1)*BOY; const dilim=liste.slice(bas,bas+BOY);
    document.getElementById('v1-sayi').innerHTML=`Toplam <strong>${num(toplamAdet)}</strong> kurum · sayfa ${sayfa}`;
    if(!dilim.length){ tb.innerHTML=`<tr><td colspan="6" class="v1-bos">${mod==='takip'?'Henüz kurum takip etmiyorsunuz.':'Sonuç bulunamadı.'}</td></tr>`; document.getElementById('v1-sayfalama').innerHTML=''; return; }
    tb.innerHTML=dilim.map((r,i)=>{
      const w=Math.max(3,Math.round((r.toplam||0)/max*100));
      const t=takipli.has(r.idare);
      return `<tr>
        <td style="color:var(--v1-muted);font-weight:700;">${bas+i+1}</td>
        <td><a class="v1-t-ad" href="v1-kurum-analiz?kurum=${encodeURIComponent(r.idare)}">${esc(r.idare)}</a></td>
        <td style="font-size:13px;">${esc(r.en_yakin_il||'—')}</td>
        <td><div style="display:flex;align-items:center;gap:10px;">
          <span class="v1-bar-wrap"><span class="v1-bar" style="width:${w}%"></span></span>
          <span style="font-weight:700;color:var(--v1-lacivert);white-space:nowrap;">${num(r.toplam)}</span></div></td>
        <td><span style="font-weight:700;color:var(--v1-teal);">${num(r.aktif)}</span></td>
        <td style="text-align:right;">
          <button class="v1-tk" data-i="${esc(r.idare)}" style="background:${t?'var(--v1-mavi)':'#fff'};color:${t?'#fff':'var(--v1-mavi)'};
            border:1.5px solid var(--v1-mavi);border-radius:8px;padding:6px 12px;font-family:var(--v1-font);
            font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;">${t?'✓ Takipte':'+ Takip Et'}</button></td></tr>`;
    }).join('');
    tb.querySelectorAll('.v1-tk').forEach(b=>b.addEventListener('click',()=>takipToggle(b.dataset.i)));
    const sonSayfa=Math.max(1,Math.ceil(toplamAdet/BOY));
    const el=document.getElementById('v1-sayfalama');
    const gor=[]; const b1=Math.max(1,sayfa-2), b2=Math.min(sonSayfa,b1+4);
    for(let i=b1;i<=b2;i++) gor.push(i);
    el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹</button>`+
      gor.map(i=>`<button class="${i===sayfa?'aktif':''}" data-s="${i}">${i}</button>`).join('')+
      `<button ${sayfa===sonSayfa?'disabled':''} data-s="${sayfa+1}">›</button>`;
    el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1||s>sonSayfa)return; sayfa=s; ciz(); window.scrollTo({top:0,behavior:'smooth'});
    }));
  }

  async function takipToggle(idare){
    if(!uyeMi){ alert('Kurum takibi için giriş yapmalısınız.'); return; }
    try{
      const {data:oturum}=await sb.auth.getSession();
      const uid=oturum&&oturum.session&&oturum.session.user.id;
      if(!uid){ alert('Oturum bulunamadı, tekrar giriş yapın.'); return; }
      if(takipli.has(idare)){
        const {error}=await sb.from('takip_idareler').delete().eq('kullanici_id',uid).eq('idare_ad',idare);
        if(error) throw error; takipli.delete(idare);
      } else {
        const {error}=await sb.from('takip_idareler').upsert({kullanici_id:uid,idare_ad:idare},{onConflict:'kullanici_id,idare_ad'});
        if(error) throw error; takipli.add(idare);
      }
      ciz();
    }catch(e){ alert('İşlem başarısız: '+(e.message||'')); }
  }

  (async()=>{
    try{ const {data}=await sb.auth.getSession(); uyeMi=!!(data&&data.session);
      if(window.v1PaketYaz){ if(uyeMi){ const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',data.session.user.id).maybeSingle();
        v1PaketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel'); } else v1PaketYaz('Misafir'); }
    }catch(_){}
    if(P.get('ara')) document.getElementById('v1-ara-liste').value=P.get('ara');
    document.getElementById('v1-ara-liste').addEventListener('input',()=>{sayfa=1;ciz();});
    const sek=(id,m,baslik)=>document.getElementById(id).addEventListener('click',()=>{
      mod=m; sayfa=1;
      ['s-tum','s-takip'].forEach(x=>document.getElementById(x).classList.toggle('aktif',x===id));
      document.getElementById('v1-liste-baslik').textContent=baslik; ciz();
    });
    sek('s-tum','tum','Tüm Kurumlar'); sek('s-takip','takip','Takip Ettiğim Kurumlar');
    yukle();
  })();
})();
</script>
</body>
</html>
