  // â”€â”€ YardÄ±mcÄ±lar: Ã¼yelik kilidi â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function kilitMi(e){ return !!e && (e.code==='42501' || /permission denied/i.test(e.message||'')); }
  function kilitMetni(ne){
    return `ğŸ”’ ${ne} Ã¼yelere Ã¶zeldir.<br><br><a href="login">GiriÅŸ yapÄ±n</a> veya <a href="fiyatlandirma_odeme_bolumu">Ã¼ye olun</a> â†’`;
  }

  // â”€â”€ Yazma iÅŸlemleri (v2 ile birebir aynÄ± tablo/alanlar) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function kazananSec(teklifId){

    alert('âœ“ Kazanan seÃ§ildi, ihale kapatÄ±ldÄ±.');

  async function teklifVer(){
    if(!teklifAcik()){ alert('Bu ihale kapandÄ± veya son teklif tarihi geÃ§ti â€” teklif alÄ±namÄ±yor.'); location.reload(); return; }
    const bedelStr=document.getElementById('tk-bedel').value;

    alert('âœ“ Teklifiniz gÃ¶nderildi!');
    location.reload();
  }

  function olaylariBagla(){
    document.querySelectorAll('[data-kazanan]').forEach(b=>
      b.addEventListener('click',()=>kazananSec(b.getAttribute('data-kazanan'))));

  // Paket rozetini kabuk monte OLDUKTAN SONRA yaz â€” v1-kabuk.js topbar'Ä±
  // DOMContentLoaded'da kurar, oysa getSession (Ã¶zellikle misafirde, aÄŸ isteÄŸi
  // olmadÄ±ÄŸÄ± iÃ§in) ondan Ã–NCE Ã§Ã¶zÃ¼lÃ¼r: #v1-paket-ad henÃ¼z DOM'da olmaz, yazma
  // sessizce dÃ¼ÅŸer ve rozet 'â€”' kalÄ±rdÄ±. (v1-ihalelerim / v1-bildirimler dersi.)
  function paketYaz(ad){
    const yaz=()=>{ if(window.v1PaketYaz) window.v1PaketYaz(ad); };
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',yaz,{once:true});
    else yaz();
  }

  // â”€â”€ AÃ§Ä±lÄ±ÅŸ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  (async()=>{
    // Paket rozeti (kabuk topbar'Ä±) â€” getSession/plan sorgusu patlasa bile
    // rozet MUTLAKA yazÄ±lsÄ±n diye iki try ayrÄ± ayrÄ± sarmalanÄ±r.
    let oturum=null;
    try{
      const {data}=await sb.auth.getSession();
      oturum=(data && data.session) ? data.session : null;
    }catch(_){}
    if(oturum){

    user = oturum ? oturum.user : null;

    if(!id){ IC().innerHTML='<div class="v1-uyari">GeÃ§ersiz talep baÄŸlantÄ±sÄ± â€” kimlik belirtilmemiÅŸ.<br><br><a href="v1-esatinalma">AÃ§Ä±k taleplere dÃ¶n â†’</a></div>'; return; }

    // Anon (giriÅŸ yok) hassas kolonlarÄ± (VKN / aÃ§Ä±k adres / koordinat / olusturan_user_id) GÃ–REMEZ â€”
    // kolon-GRANT ile kapalÄ± (backend/migration_satinalma_revoke.sql). olusturan_user_id anon'a GEREKMEZ:
    // sahiplik kontrolÃ¼ user ister, anon'da user=null â†’ dal zaten Ã§alÄ±ÅŸmaz. Bu listeye kolon EKLEME â€”
    // grant'ta olmayan bir kolon eklenirse sorgu 42501 alÄ±r ve sayfa "talep bulunamadÄ±"ya dÃ¼ÅŸer.
    // GiriÅŸli kullanÄ±cÄ± (alÄ±cÄ±/tedarikÃ§i) '*' ile tam eriÅŸir (olusturan_user_id oradan gelir).
    const guvenliKolonlar='id,olusturan_firma,baslik,aciklama,kategori,il,ilce,miktar,tahmini_bedel,para_birimi,son_teklif_tarihi,durum,olusturulma,kazanan_teklif_id';
    const {data,error}=await sb.from('satinalma_talepleri')

        kilitMi(error) ? kilitMetni('Bu talebin detayÄ±')

      }</div>`;
      return;
    }
    talep=data;

    const sahibiMi = !!(user && user.id===talep.olusturan_user_id);
    let html = bantHTML() + ozetHTML();
    if(sahibiMi){
      html += await gelenTekliflerHTML();
      html += await onerilenTedarikciHTML();
    } else if(user){
      html += await teklifBolumuHTML();
    } else {
      html += `<div class="v1-uyari">ğŸ’¼ Bu talebe <strong>teklif vermek</strong> iÃ§in Ã¼ye giriÅŸi gerekir.<br>
        Teklifler kapalÄ± zarftÄ±r; yalnÄ±zca alÄ±cÄ± gÃ¶rÃ¼r.<br><br>
        <a href="login">GiriÅŸ yapÄ±n</a> veya <a href="fiyatlandirma_odeme_bolumu">Ã¼ye olun</a> â†’</div>`;

  })();
})();
