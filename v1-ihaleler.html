  /* â”€â”€ DOÄRUDAN TEMÄ°N'de TÃ¼rkÃ§e kelime aramasÄ± â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
     `dogrudan_temin_ilanlari` tablosunda `baslik_fold` KOLONU YOK (canlÄ± REST: 42703 â€”
     backend/migration_dt_arama.sql prod'a uygulanmamÄ±ÅŸ) â†’ window.v1Ara burada kullanÄ±lamaz.
     DÃ¼z `ilike('baslik','%insaat%')` ise Ä°KÄ° AYRI ÅŸekilde bozuk (ikisi de canlÄ± Ã¶lÃ§Ã¼ldÃ¼):
       Â· TÃ¼rkÃ§e katlamÄ±yor  â†’ "insaat" 0 satÄ±r, "asansor" 0 satÄ±r
       Â· 1,49M satÄ±rda tam tabloda 57014 statement timeout â†’ sayfa "Liste yÃ¼klenemedi" diyor
     Ã‡Ã¶zÃ¼m: PostgREST `imatch` (POSIX ~*) + TÃ¼rkÃ§e harf sÄ±nÄ±flarÄ±.
     Ã–lÃ§Ã¼m: "insaat" â†’ 200/0,52sn ve 126 doÄŸru satÄ±r, 0 yanlÄ±ÅŸ eÅŸleÅŸme; "asansor" â†’ 0,26sn.
     âš ï¸ Regex meta karakterleri kaÃ§Ä±rÄ±lmazsa PostgreSQL 2201B ("invalid regular expression")
        dÃ¶ndÃ¼rÃ¼p sorguyu dÃ¼ÅŸÃ¼rÃ¼yor â†’ beyaz liste dÄ±ÅŸÄ±ndaki her karakter `.` yapÄ±lÄ±r. */
  const TR_SINIF={ i:'[iÄ±Ä°I]', c:'[cÃ§CÃ‡]', g:'[gÄŸGÄ]', o:'[oÃ¶OÃ–]', s:'[sÅŸSÅ]', u:'[uÃ¼UÃœ]' };
  function dtRegex(metin){
    const f=(window.trFold?window.trFold(metin):(metin||'').toLocaleLowerCase('tr')).trim();
    if(f.length<2) return '';
    return f.split('').map(ch=>{
      if(TR_SINIF[ch]) return TR_SINIF[ch];
      if(ch===' ') return '\\s+';
      if(/[a-z0-9]/.test(ch)) return ch;
      return '.';                       // nokta/parantez/virgÃ¼l vb. â†’ tek karakter jokeri
    }).join('');
  }

  // â”€â”€ Sorgu â”€â”€
  // âš ï¸ 1,96M satÄ±rda select+count:'exact'+order+range BÄ°RLÄ°KTE statement_timeout'a takÄ±lÄ±yor.
  //    SayÄ±mÄ± AYRI hafif sorguya bÃ¶ldÃ¼k (head:true â€” KPI'da Ã§alÄ±ÅŸan desen), veri sorgusu count'suz.
  function sorguKur(sayimIcin){
    // â”€â”€ DOÄRUDAN TEMÄ°N kaynaÄŸÄ±: AYRI tablo (dogrudan_temin_ilanlari), farklÄ± kolonlar â”€â”€
    if (dtModu()) {
      // â›” `idare` anon'a KAPALI (42501). KoÅŸulsuz select'e konursa TÃœM sorgu dÃ¼ÅŸer ve
      //    misafirde DT sekmesi hiÃ§ aÃ§Ä±lmaz â€” bu yÃ¼zden Ã¼yelik dallanmasÄ± ÅART.
      const dtKolon = sayimIcin ? 'id'
        : ('id,dt_no,baslik,tur,il,tarih,durum,kategori,yayin_tarihi'+(uyeMi?',idare':''));
      let d = sb.from('dogrudan_temin_ilanlari').select(dtKolon, sayimIcin?{count:'exact',head:true}:undefined);
      // durum'a gÃ¶re daralt: SonuÃ§lar â†’ sonucu duyurulmuÅŸ DT, GeÃ§miÅŸ â†’ henÃ¼z sonuÃ§lanmamÄ±ÅŸ DT.
      // (dt sekmesi: tÃ¼mÃ¼.) CanlÄ± doÄŸrulandÄ±: "SonuÃ§ Duyurusuâ€¦" 2,55M Â· "DoÄŸrudan Temin Duyurusuâ€¦" 408K.
      if (sekme==='sonuc')       d=d.eq('durum','SonuÃ§ Duyurusu YayÄ±mlanmÄ±ÅŸ');
      else if (sekme==='gecmis') d=d.eq('durum','DoÄŸrudan Temin Duyurusu YayÄ±mlanmÄ±ÅŸ');
      const kw=val('f-kelime');
      if(kw){
        // DT numarasÄ± (Ã¶r. 25DT2095274) â†’ dt_no TAM eÅŸleÅŸme (indeksli, ~1sn). Prefix ilike
        //   dt_no'da indekssiz â†’ 57014 timeout, o yÃ¼zden YALNIZ eq. Aksi halde baÅŸlÄ±kta regex.
        if(/^\s*\d{2}\s*DT\s*\d+\s*$/i.test(kw)){ d=d.eq('dt_no', kw.replace(/\s+/g,'').toUpperCase()); }
        else { const rgx=dtRegex(kw); if(rgx) d=d.filter('baslik','imatch',rgx); }
      }
      if(val('f-tarih1')) d=d.gte('tarih',val('f-tarih1'));
      if(val('f-tarih2')) d=d.lte('tarih',val('f-tarih2')+'T23:59:59');
      if(val('f-yayin1')) d=d.gte('yayin_tarihi',val('f-yayin1'));
      if(val('f-yayin2')) d=d.lte('yayin_tarihi',val('f-yayin2')+'T23:59:59');
      if(val('f-tur'))    d=d.eq('tur',val('f-tur'));
      if(val('f-il'))     d=d.eq('il',val('f-il'));
      if(val('f-kategori')) d=d.eq('kategori',val('f-kategori'));
      if(uyeMi && val('f-idare')) d=d.ilike('idare','%'+val('f-idare')+'%');
      return d;
    }
    const kolon = sayimIcin ? 'id' : (uyeMi
      ? 'id,ekap_id,baslik,il,tur,usul,kategori,idare,durum,ilan_tarihi,son_teklif_tarihi,yaklasik_maliyet_min,yaklasik_maliyet_max'
      : 'id,baslik,il,tur,usul,kategori,durum,ilan_tarihi,son_teklif_tarihi');
    let q = sb.from('ilanlar').select(kolon, sayimIcin?{count:'exact',head:true}:undefined);
    if (sekme==='aktif') {
      // Teklif sÃ¼resi DEVAM EDEN ihaleler (ihalepro "Aktif Ä°haleler" davranÄ±ÅŸÄ±).
      // gte, indeksin 2. kolonunda aralÄ±k koÅŸulu â†’ idx_ilanlar_durum_son_teklif ile uyumlu,
      // ayrÄ±ca NULL tarihli eski kayÄ±tlarÄ± da eler (NULLS FIRST yan etkisi).
      q=q.eq('durum','aktif').gte('son_teklif_tarihi', new Date().toISOString());
    } else if (sekme==='gecmis') {
      // GeÃ§miÅŸ = sÃ¼resi geÃ§miÅŸ, SONUCU AÃ‡IKLANMAMIÅ ihaleler = durum 'kapali' (~1,6M).
      // â›” ESKÄ° HATA: yalnÄ±z 'aktif ama son_teklif geÃ§miÅŸ' (~271) alÄ±nÄ±yordu â†’ 1,6M kapalÄ± ihale
      //    hiÃ§bir sekmede gÃ¶rÃ¼nmÃ¼yordu. 'kapali' = teklif sÃ¼resi bitmiÅŸ, EKAP'ta sonuÃ§ ilanÄ±
      //    yayÄ±mlanmamÄ±ÅŸ (sonuclandi'ye geÃ§memiÅŸ) ihaleler. idx_ilanlar_durum_son_teklif ile uyumlu.
      q=q.eq('durum','kapali');
    } else q=q.eq('durum','sonuclandi');
    // â›” DÃ¼z `.ilike('baslik','%insaat%')` TÃ¼rkÃ§e Ä°/Ä±'da SESSÄ°ZCE 0 dÃ¶ner. KatlanmÄ±ÅŸ
    //    `baslik_fold` kolonu misafire de AÃ‡IK ve trgm indeksli (Ã¶lÃ§Ã¼m: 0,18sn).
    // Ä°KN / ekap_id ile arama: "2026/1224100", "ILN02520263", "DMO-17786" gibi kimlikler
    //   baÅŸlÄ±kta geÃ§mez â†’ ekap_id TAM eÅŸleÅŸme. ekap_id anon'a KAPALI â†’ yalnÄ±z Ã¼yede. Aksi
    //   halde baÅŸlÄ±kta katlanmÄ±ÅŸ arama (baslik_fold, trgm indeksli).
    const ikw = val('f-kelime');
    if (ikw && uyeMi && /^\s*(\d{4}\/\d+|ILN\d+|DMO[-\d]+)\s*$/i.test(ikw)) {
      q = q.eq('ekap_id', ikw.trim().toUpperCase());
    } else {
      q = window.v1Ara ? window.v1Ara(q,'baslik_fold',ikw)
                       : (ikw ? q.ilike('baslik','%'+ikw+'%') : q);
    }
    if(val('f-tarih1')) q=q.gte('son_teklif_tarihi',val('f-tarih1'));
    if(val('f-tarih2')) q=q.lte('son_teklif_tarihi',val('f-tarih2')+'T23:59:59');
    if(val('f-yayin1')) q=q.gte('ilan_tarihi',val('f-yayin1'));
    if(val('f-yayin2')) q=q.lte('ilan_tarihi',val('f-yayin2')+'T23:59:59');
    if(val('f-min'))    q=q.gte('yaklasik_maliyet_min',val('f-min'));
    if(val('f-max'))    q=q.lte('yaklasik_maliyet_max',val('f-max'));
    if(val('f-tur'))    q=q.eq('tur',val('f-tur'));
    if(val('f-usul')){ const u=USULLER.find(x=>x.v===val('f-usul')); if(u) q=u.uygula(q); }  // bkz. USULLER
    if(val('f-il'))     q=q.eq('il',val('f-il'));
    if(val('f-kategori')) q=q.eq('kategori',val('f-kategori'));
    if(val('f-sozt'))   q=q.eq('teklif_fiyat_turu',val('f-sozt'));
    if(uyeMi && val('f-idare')) q=q.ilike('idare','%'+val('f-idare')+'%');
    if(isaretli('f-eihale'))   q=q.is('teklif_elektronik',true);
    if(isaretli('f-maliyetli')) q=q.not('yaklasik_maliyet_min','is',null);
    return q;
  }

  // DT'de listelenen/sÄ±ralanan tarih kolonu. YayÄ±n tarihi filtresi aÃ§Ä±kken `order=tarih.desc`
  // ile birlikte kullanmak 57014 timeout veriyordu (Ã¶lÃ§Ã¼m: 500/3,16sn); aynÄ± sorgu
  // `order=yayin_tarihi.desc` ile 200/0,20sn. Bu yÃ¼zden yayÄ±n filtresi aÃ§Ä±lÄ±nca sÄ±ralama da
  // yayÄ±n tarihine geÃ§er ve ilk sÃ¼tun yayÄ±n tarihini gÃ¶sterir (kullanÄ±cÄ± ne olduÄŸunu gÃ¶rsÃ¼n).
  function dtSiralamaTazele(){
    if(!dtModu()) return;
    const yayinFiltre = !!(val('f-yayin1')||val('f-yayin2'));
    if(yayinFiltre && sirala==='tarih') sirala='yayin_tarihi';

  /* âš ï¸ BOÅ DEÄERÄ°N YERÄ° Ä°NDEKSLE EÅLEÅMELÄ° â€” yoksa planner indeksi kullanamaz ve
     tablo baÅŸtan taranÄ±p 57014 gelir. Kural KOLONA GÃ–RE DEÄÄ°ÅÄ°YOR (hepsi canlÄ± Ã¶lÃ§Ã¼ldÃ¼):
       ilanlar.son_teklif_tarihi  â†’ nullsFirst = ascending      (idx â€¦ DESC NULLS LAST)
       dogrudan_temin.tarih       â†’ nullsFirst = ascending      (asc 0,22sn Â· desc 0,22sn)
       dogrudan_temin.yayin_tarihiâ†’ nullsFirst = !ascending
         (desc.nullsfirst 0,17sn / desc.nullslast 3,17sn-500 Â· asc.nullslast 0,21sn / asc.nullsfirst 3,16sn-500)
     Genel `nullsFirst: yon` kuralÄ± yayÄ±n tarihine uygulanÄ±nca yayÄ±n filtresi
     her seferinde "zaman aÅŸÄ±mÄ±" veriyordu. */
  const NULL_ONCE_TERS={ yayin_tarihi:true };
  const nullsIlk=(kolon,asc)=> NULL_ONCE_TERS[kolon] ? !asc : asc;

  /* DT tablosu 2,95M satÄ±r ve `baslik` / `il` iÃ§in sÄ±ralama indeksi YOK â†’ o baÅŸlÄ±klara
     tÄ±klamak garantili 57014 (Ã¶lÃ§Ã¼ldÃ¼: 500/3,2sn ve 3,3sn). AynÄ± sÄ±ralama `ilanlar`da
     sorunsuz (aktif 0,38sn / 0,28sn â€” sonuÃ§ 1,57sn). Bu yÃ¼zden yalnÄ±z DT sekmesinde
     bu iki baÅŸlÄ±k pasifleÅŸir; kullanÄ±cÄ± tÄ±klayÄ±p hata ekranÄ± gÃ¶rmesin. */
  const DT_SIRALANAMAZ=['baslik','il'];
  const TH_ETIKET={'th-baslik':'Ä°KN / Ä°hale AdÄ±','th-il':'Ä°hale Ä°li'};
  function basliklariAyarla(){
    const th=document.getElementById('th-tarih');
    if(th){
      if(!dtModu()){ th.dataset.sirala='son_teklif_tarihi'; th.textContent='Ä°hale Tarihi â‡…'; }
      else{
        const yayin = sirala==='yayin_tarihi';
        th.dataset.sirala = yayin ? 'yayin_tarihi' : 'tarih';
        th.textContent    = (yayin ? 'YayÄ±n Tarihi' : 'DT Tarihi')+' â‡…';

    Object.keys(TH_ETIKET).forEach(id=>{
      const e=document.getElementById(id); if(!e) return;
      const kapali = dtModu() && DT_SIRALANAMAZ.includes(e.dataset.sirala);
      e.dataset.kapali = kapali ? '1' : '';
      e.style.cursor   = kapali ? 'default' : 'pointer';
      e.title          = kapali ? 'DoÄŸrudan temin listesi Ã§ok bÃ¼yÃ¼k olduÄŸu iÃ§in bu sÃ¼tuna gÃ¶re sÄ±ralama kapalÄ±.' : '';
      e.textContent    = TH_ETIKET[id] + (kapali ? '' : ' â‡…');
    });
  }

      // DoÄŸrudan Temin SONUÃ‡LARI: kazanan bedeli ayrÄ± tablodan (dogrudan_temin_sonuclari) sayfa

      // 57014 = statement timeout: Ã§ok geniÅŸ tarama. KullanÄ±cÄ±ya "bozuk" deÄŸil "daralt" de.
      const mesaj = (e&&e.code==='57014')
        ? 'Bu arama zaman aÅŸÄ±mÄ±na uÄŸradÄ±. Daha belirgin bir kelime yazÄ±n veya tarih / il gibi bir filtre ekleyin.'
        : 'Liste yÃ¼klenemedi. '+esc((e&&e.message)||'');
      tb.innerHTML=`<tr><td colspan="5" class="v1-bos">${mesaj}</td></tr>`;

  function satir(r){
    // DT sekmesinde tarih alanÄ± 'tarih' (yayÄ±n filtresi aÃ§Ä±kken 'yayin_tarihi'), kimlik 'dt_no';
    // ilan tablosunda 'son_teklif_tarihi' / 'ekap_id'.
    const dtMi = dtModu();
    const ham = dtMi ? (sirala==='yayin_tarihi' ? r.yayin_tarihi : r.tarih) : r.son_teklif_tarihi;
    const t=ham?new Date(ham):null;
    const kalan=t?Math.ceil((t-new Date())/86400000):null;
    const tarih=t?t.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):'â€”';
    const saat=t?t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'';

      ['usul','maliyet','sozT','diger'].forEach(g=>{

    document.querySelectorAll('.v1-tip-btn').forEach(b=>b.addEventListener('click',()=>{

    document.getElementById('v1-listede-ara').addEventListener('input',(e)=>{

    document.querySelectorAll('[data-sirala]').forEach(th=>th.addEventListener('click',()=>{
      if(th.dataset.kapali==='1') return;      // DT'de baslik/il sÄ±ralamasÄ± kapalÄ±
      const k=th.dataset.sirala; if(sirala===k) yon=!yon; else {sirala=k; yon=true;} sayfa=1; yukle();
    }));

    sekmeAyarla(sekme);   // tek giriÅŸ noktasÄ±: baÅŸlÄ±klarÄ±/gizlemeleri kurar ve yukle() Ã§aÄŸÄ±rÄ±r
  })();
