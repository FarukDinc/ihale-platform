<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Ömer Faruk Dinç">
  <meta name="copyright" content="© 2026 Ömer Faruk Dinç — İhaleGlobal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İhaleler — İhaleGlobal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v1.css?v=16" />
  <style>
    /* Sekmeler (Aktif İhaleler | Sonuçlar) */
    .v1-sekmeler { display:flex; gap:26px; border-bottom:2px solid var(--v1-cizgi); margin-bottom:18px; }
    .v1-sekme { background:none; border:none; padding:10px 2px 12px; font-family:var(--v1-font); font-size:15px;
      font-weight:700; color:var(--v1-muted); cursor:pointer; position:relative; }
    .v1-sekme.aktif { color:var(--v1-lacivert); }
    .v1-sekme.aktif::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:3px; background:var(--v1-mavi); border-radius:2px; }
    .v1-sayfa-baslik { font-size:22px; font-weight:800; color:var(--v1-lacivert); margin-bottom:12px; }
    /* Filtre içi form öğeleri */
    .v1-f-input, .v1-f-select { width:100%; border:1px solid var(--v1-cizgi); border-radius:8px; padding:8px 10px;
      font-family:var(--v1-font); font-size:13px; color:var(--v1-metin); outline:none; background:#fff; }
    .v1-f-input:focus, .v1-f-select:focus { border-color:var(--v1-mavi); }
    .v1-f-ikili { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .v1-f-etiket { font-size:11.5px; color:var(--v1-muted); margin:6px 0 3px; display:block; }
    /* Toggle satırı */
    .v1-toggle-satir { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px;
      border-bottom:1px solid var(--v1-cizgi); font-size:13px; font-weight:600; color:var(--v1-metin); }
    .v1-toggle-satir.vurgu { background:var(--v1-teal-acik); }
    .v1-sw { position:relative; width:42px; height:23px; flex-shrink:0; }
    .v1-sw input { opacity:0; width:0; height:0; }
    .v1-sw span { position:absolute; inset:0; background:#C7D2DE; border-radius:20px; cursor:pointer; transition:.18s; }
    .v1-sw span::before { content:''; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.18s; }
    .v1-sw input:checked + span { background:var(--v1-teal); }
    .v1-sw input:checked + span::before { transform:translateX(19px); }
    /* Genişletilen satır detayı */
    .v1-detay { background:#F8FBFF; font-size:13px; color:var(--v1-metin-2); padding:14px 16px; }
    .v1-detay-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px 20px; }
    .v1-detay b { color:var(--v1-lacivert); display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
    .v1-giris { text-align:center; padding:80px 20px; color:var(--v1-muted); }
    /* İhale / Doğrudan Temin segment seçici (Sonuçlar & Geçmiş sekmelerinde) */
    .v1-tip-secim { display:inline-flex; background:#fff; border:1px solid var(--v1-teal); border-radius:8px; overflow:hidden; }
    .v1-tip-btn { border:none; background:none; padding:6px 12px; font-family:var(--v1-font); font-size:12.5px;
      font-weight:700; color:var(--v1-muted); cursor:pointer; transition:.15s; white-space:nowrap; }
    .v1-tip-btn.aktif { background:var(--v1-teal); color:#fff; }
    /* Dar filtre panelinde "Sonuç Türü" + segment yan yana sığmıyordu ("Doğrudan Temin"
       kırpılıyordu). Etiket üste, segment tam genişlik 50/50 → metin tam görünür. */
    #sonuc-tip-satir { flex-direction:column; align-items:stretch; gap:7px; }
    #sonuc-tip-satir .v1-tip-secim { display:flex; width:100%; }
    #sonuc-tip-satir .v1-tip-btn { flex:1; text-align:center; padding:7px 6px; font-size:11.5px; }
  </style>
</head>
<body class="v1" data-v1-aktif="ihaleler" data-v1-kirinti="Kamu > İhaleler">
<div class="v1-app">
  <div class="v1-main">
    <div class="v1-govde">

      <div class="v1-sayfa-baslik" id="v1-baslik">Aktif İhaleler</div>
      <div class="v1-sekmeler">
        <button class="v1-sekme aktif" id="sekme-aktif">Aktif İhaleler</button>
        <button class="v1-sekme" id="sekme-sonuc">Sonuçlar</button>
        <button class="v1-sekme" id="sekme-gecmis">Geçmiş</button>
        <button class="v1-sekme" id="sekme-dt">Doğrudan Teminler</button>
      </div>

      <div class="v1-liste-duzen">
        <!-- ── SOL FİLTRE PANELİ ── -->
        <aside class="v1-filtre">
          <div class="v1-filtre-bas">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M3 4.5h18l-7 8.4V21l-4-2.4v-6.1L3 4.5Z"/></svg>
            Filtrele
          </div>

          <!-- Sonuç türü: yalnız SONUÇLAR ve GEÇMİŞ sekmelerinde görünür (kaynakKur ile).
               İhale → ilanlar tablosu · Doğrudan Temin → dogrudan_temin_ilanlari (durum'a göre).
               Böylece ayrı "Geçmiş DT" / "DT Sonuçları" sekmesine gerek kalmaz. -->
          <div class="v1-toggle-satir vurgu" id="sonuc-tip-satir" style="display:none;">
            <span>Sonuç Türü</span>
            <div class="v1-tip-secim">
              <button type="button" class="v1-tip-btn aktif" data-tip="ihale">İhale</button>
              <button type="button" class="v1-tip-btn" data-tip="dt">Doğrudan Temin</button>
            </div>
          </div>

          <!-- Sadece E-İhale: ilanlar.teklif_elektronik (canlı doğrulandı: aktifte 4.152 true / 292 false).
               Doğrudan Temin tablosunda bu kolon YOK → DT modunda gizlenir. -->
          <label class="v1-toggle-satir" id="f-eihale-satir">Sadece E-İhale İlanlı
            <span class="v1-sw"><input type="checkbox" id="f-eihale"><span></span></span>
          </label>

          <div id="v1-filtre-gruplar"></div>

          <button class="v1-filtre-uygula" id="f-uygula">Filtreyi Uygula</button>
          <button style="width:100%;background:none;border:none;border-top:1px solid var(--v1-cizgi);padding:11px;
            font-family:var(--v1-font);font-size:13px;font-weight:600;color:var(--v1-muted);cursor:pointer;" id="f-temizle">Vazgeç / Temizle</button>
        </aside>

        <!-- ── SAĞ İÇERİK ── -->
        <section>
          <div class="v1-kart" style="padding:18px 20px;">
            <div class="v1-tablo-bas">
              <div>
                <div style="font-size:17px;font-weight:800;color:var(--v1-lacivert);" id="v1-liste-baslik">Aktif İhaleler</div>
                <div class="v1-tablo-sayi" id="v1-sayi">Yükleniyor…</div>
              </div>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <div class="v1-listede-ara">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--v1-muted)"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
                  <input type="text" id="v1-listede-ara" placeholder="Listede Ara">
                </div>
              </div>
            </div>

            <!-- ?ara= ile gelen metnin nasıl yorumlandığını gösteren şerit (bkz. araParametresiniYerlestir) -->
            <div id="v1-ara-not" style="display:none;margin:2px 0 12px;padding:9px 12px;border-radius:8px;
              background:var(--v1-teal-acik);border:1px solid var(--v1-teal);font-size:12.5px;color:var(--v1-lacivert);"></div>

            <!-- Uygulanan filtreler EKAP gibi çip olarak; her çipin ✕'i o filtreyi kaldırır -->
            <style>
              .v1-cipler{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 14px;}
              .v1-cip{display:inline-flex;align-items:center;gap:6px;background:#EEF3FA;border:1px solid var(--v1-cizgi);color:var(--v1-lacivert);border-radius:16px;padding:5px 6px 5px 12px;font-size:12px;}
              .v1-cip b{font-weight:700;}
              .v1-cip-x{border:none;background:#D9E2EF;color:var(--v1-lacivert);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
              .v1-cip-x:hover{background:var(--v1-kirmizi);color:#fff;}
              .v1-cip-temizle{border:none;background:none;color:var(--v1-mavi);font-family:var(--v1-font);font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 8px;}
            </style>
            <div id="v1-cipler" class="v1-cipler" style="display:none;"></div>

            <div style="overflow-x:auto;">
              <table class="v1-tablo" id="v1-tablo">
                <thead>
                  <tr>
                    <!-- data-sirala sekmeye göre değişir: ilanlar→son_teklif_tarihi, DT→tarih/yayin_tarihi
                         (DT tablosunda son_teklif_tarihi kolonu YOK → 42703). bkz. basliklariAyarla() -->
                    <th id="th-tarih" style="width:130px;cursor:pointer;" data-sirala="son_teklif_tarihi">İhale Tarihi ⇅</th>
                    <th id="th-baslik" style="cursor:pointer;" data-sirala="baslik">İKN / İhale Adı ⇅</th>
                    <th style="width:150px;">İhale Tipi<br>Usulü</th>
                    <th id="th-il" style="width:110px;cursor:pointer;" data-sirala="il">İhale İli ⇅</th>
                    <th style="width:100px;"></th>
                  </tr>
                </thead>
                <tbody id="v1-tbody">
                  <tr><td colspan="5" class="v1-bos">Yükleniyor…</td></tr>
                </tbody>
              </table>
            </div>

            <div class="v1-sayfalama" id="v1-sayfalama"></div>
          </div>
        </section>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/kategoriler.js?v=1"></script>

<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tl=(v)=>v==null?'—':'₺'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:0});
  /* Ham i18n anahtarı sızıntısına karşı son savunma (bkz. migration_usul_i18n_temizlik.sql +
     ekap_scraper.usul_donustur). Veri temizlense de scraper hıçkırığı tekrarlarsa kullanıcı
     "TENDER_SEARCH.…OPEN" görmesin diye aynı eşlemeyi burada da uygularız. */
  const usulTemiz=(u)=>{
    if(!u) return '';
    const U=u.toUpperCase();
    // Eski i18n enum formatı (TENDER_SEARCH.… ASCII anahtarları — toUpperCase güvenli)
    if(/TENDER_SEARCH|PAGEITEM|ENUMERATIONS/.test(U)){
      if(U.includes('AMONG_CERTAIN_BIDDERS')) return 'Belli İstekliler Arasında';
      if(U.includes('OPEN'))               return 'Açık İhale';
      if(U.includes('BARGAIN'))            return 'Pazarlık Usulü';
      if(U.includes('DESIGN_COMPETITION')) return 'Tasarım Yarışması';
      if(U.includes('DIRECT_PROCUREMENT')) return 'Doğrudan Temin';
      if(U.includes('FRAMEWORK_AGREEMENT'))return 'Çerçeve Anlaşma';
      return 'Diğer / İstisna';
    }
    // 26-25: güncel Türkçe ham değer çeşitlerini TEK kanonik etikete indir (Açık/Açık İhale/
    // 4734 KİK Açık İhale → "Açık İhale"; İstisna (4734 md 3-x)/4734 / 3-x → "İstisna / Kapsam Dışı"…).
    // Türkçe İ/ı için toUpperCase KULLANMA (ham metinde ara). SIRA: 2886 "Açık Teklif" içerdiği için ÖNCE.
    if(u.includes('2886'))         return '2886 Sayılı DİK';
    if(u.includes('Belli İstekl')) return 'Belli İstekliler Arasında';
    if(u.includes('Pazarlık'))     return 'Pazarlık Usulü';
    if(u.includes('İstisna') || u.includes('Kapsam Dışı') || /4734\s*\/\s*3-/.test(u)) return 'İstisna / Kapsam Dışı';
    if(u.includes('Açık'))         return 'Açık İhale';
    if(u.trim()==='Diğer')         return 'Diğer';
    return u;   // tanınmayan mevzuat (Elektrik Dağıtım, Vakıf Üniv. vb.) olduğu gibi
  };
  const P=new URLSearchParams(location.search);
  const SAYFA_BOY=20;
  // Filtre kutusu okuma/yazma — TEK yerden. Sorgu SADECE kutuları okur; URL parametreleri
  // açılışta kutulara yazılır (eskiden hem kutu hem `P.get(...)` dalı vardı → ikisi
  // çakışınca filtre sessizce iki kez uygulanıyordu).
  const val=(id)=>{const e=document.getElementById(id); return e&&e.value?e.value.trim():'';};
  const isaretli=(id)=>{const e=document.getElementById(id); return !!(e&&e.checked);};
  const setVal=(id,v)=>{const e=document.getElementById(id); if(e) e.value=v;};
  // ⚠️ SIRALAMA YÖNÜ İNDEKSLE EŞLEŞMELİ: idx_ilanlar_durum_son_teklif = (durum, son_teklif_tarihi DESC NULLS LAST).
  //    Btree ters taranır → ASC için NULLS FIRST şart. 'ASC NULLS LAST' istersek planner indeksi
  //    kullanamaz, 1,6M satır tarar (ölçüm: 7064ms → 0,79ms). Bu yüzden nullsFirst = ascending.
  const _sekmeP=P.get('sekme');
  let sayfa=1, toplam=0,
      sekme=['sonuc','gecmis','dt'].includes(_sekmeP)?_sekmeP:((P.get('tur')==='dt')?'dt':'aktif'),
      sonucTip=(P.get('tip')==='dt')?'dt':'ihale',   // Sonuçlar/Geçmiş sekmelerinde İhale mi DT mi
      uyeMi=false, uid=null, sirala='son_teklif_tarihi', yon=true;
  let yukleIstek = 0;   // #15c: bayat async yukle cevabı taze olanı ezmesin (DT↔İhale tab yarışı)
  // Efektif veri kaynağı DT tablosu mu? (dt sekmesi VEYA sonuç/geçmiş + Doğrudan Temin seçili)
  const dtModu=()=> sekme==='dt' || ((sekme==='sonuc'||sekme==='gecmis') && sonucTip==='dt');
  // "… listeleniyor" sayacındaki kayıt adı (moda göre).
  const kayitEtiketi=()=>{
    if(sekme==='aktif') return 'ihale ilanı';
    if(sekme==='dt')    return 'doğrudan temin ilanı';
    if(sekme==='sonuc') return dtModu()?'doğrudan temin sonucu':'sonuçlanan ihale';
    return dtModu()?'sonuçlanmamış doğrudan temin':'geçmiş ihale';   // gecmis
  };

  const ILLER=["ADANA","ADIYAMAN","AFYONKARAHİSAR","AĞRI","AKSARAY","AMASYA","ANKARA","ANTALYA","ARDAHAN","ARTVİN","AYDIN","BALIKESİR","BARTIN","BATMAN","BAYBURT","BİLECİK","BİNGÖL","BİTLİS","BOLU","BURDUR","BURSA","ÇANAKKALE","ÇANKIRI","ÇORUM","DENİZLİ","DİYARBAKIR","DÜZCE","EDİRNE","ELAZIĞ","ERZİNCAN","ERZURUM","ESKİŞEHİR","GAZİANTEP","GİRESUN","GÜMÜŞHANE","HAKKARİ","HATAY","IĞDIR","ISPARTA","İSTANBUL","İZMİR","KAHRAMANMARAŞ","KARABÜK","KARAMAN","KARS","KASTAMONU","KAYSERİ","KIRIKKALE","KIRKLARELİ","KIRŞEHİR","KİLİS","KOCAELİ","KONYA","KÜTAHYA","MALATYA","MANİSA","MARDİN","MERSİN","MUĞLA","MUŞ","NEVŞEHİR","NİĞDE","ORDU","OSMANİYE","RİZE","SAKARYA","SAMSUN","SİİRT","SİNOP","SİVAS","ŞANLIURFA","ŞIRNAK","TEKİRDAĞ","TOKAT","TRABZON","TUNCELİ","UŞAK","VAN","YALOVA","YOZGAT","ZONGULDAK"];
  const TURLER=["Mal","Hizmet","Yapım","Danışmanlık","Kiraya Verme","Satış"];
  /* ⚠️ USUL: seçenek ETİKETİ ile DB'deki DEĞER aynı değil — ve TEK ilike kalıbı YETMİYOR.
     `ilanlar.usul` aktif ilanlarda 23 farklı değer taşıyor (canlı sayıldı, 5.520 satır):
        4624 Açık                                  ·  209 4734 Sayılı KİK, Açık İhale Usulü
         198 2886 Sayılı DİK, Açık Teklif Usulü    ·  105 İstisna ve Kapsam Dışı İhaleler
          95 Elektrik Dağıtım Şirketleri … Yön.    ·   70 2886 Sayılı DİK, Kapalı Teklif Usulü
          37 Vakıf Yükseköğretim Kurumları Yön.    ·   30 Belli İstekliler Arasında
          17 Açık İhale · 25 Pazarlık (MD 21 A/B/E/F, Hepsi) · 4 2886 Sayılı DİK, Pazarlık Usulü
           8 TİGEM · 8 6183 AATUHK Satış · 8 Diğer · 2 Tasarım Yarışması · 1 EGM · 1 Kültür Varlıkları
     İKİ TUZAK:
      (1) Etiketi ("Açık İhale") olduğu gibi ilike'a vermek → 5.126 yerine 227 satır (eski hata).
      (2) Düz '%Açık%' İKİ AYRI MEVZUATI birleştiriyor: 4734/KİK açık ihale usulü ile
          2886/DİK "Açık Teklif Usulü" (taşınmaz satış/kiralama) aynı kelimeyi kullanıyor →
          "Açık İhale" seçen kullanıcının listesine 198 satış/kiralama ilanı sızıyordu
          (Pazarlık'ta da 4 adet). Bu yüzden KİK dallarında 2886 DIŞLANIYOR ve 2886 kendi
          seçeneği oluyor. Dropdown'da karşılığı olmayan 161 satır da "Diğer mevzuat"a düşüyor;
          eskiden hiçbir seçenekle erişilemiyordu. */
  const USUL_HARIC=['%Açık%','%Belli İstekliler%','%Pazarlık%','%İstisna%','%4734 / 3-%','%2886%'];
  const USULLER=[
    {v:'acik',    ad:'Açık İhale (4734 / KİK)',
     uygula:q=>q.ilike('usul','%Açık%').not('usul','ilike','%2886%')},
    {v:'belli',   ad:'Belli İstekliler Arasında',
     uygula:q=>q.ilike('usul','%Belli İstekliler%')},
    {v:'pazarlik',ad:'Pazarlık',
     uygula:q=>q.ilike('usul','%Pazarlık%').not('usul','ilike','%2886%')},
    {v:'istisna', ad:'İstisna / Kapsam Dışı',
     // "4734 / 3-x" (90K) da 4734 md.3 istisnasıdır ama '%İstisna%' kaçırıyordu → OR ile ekle (26-25).
     uygula:q=>q.or('usul.ilike.%İstisna%,usul.ilike.%4734 / 3-%')},
    {v:'dik2886', ad:'2886 Sayılı DİK (satış / kiraya verme)',
     uygula:q=>q.ilike('usul','%2886%')},
    {v:'diger',   ad:'Diğer mevzuat (Elektrik Dağıtım, Vakıf Üniv., TİGEM…)',
     uygula:q=>USUL_HARIC.reduce((a,p)=>a.not('usul','ilike',p),q).not('usul','is',null)},
  ];
  // ilanlar.teklif_fiyat_turu canlı değerleri: 'birim' | 'goturu' | 'karma' (etiketler farklı)
  const SOZ_TURLERI=[{v:'birim',ad:'Birim Fiyat'},{v:'goturu',ad:'Götürü Bedel'},{v:'karma',ad:'Karma'}];
  // ⚠️ window.KATEGORILER = [{kod,emoji,aciklama,eski}, …] — string DEĞİL, .kod al.
  const KATEGORILER=(window.KATEGORILER||[]).map(k=>(typeof k==='string'?k:(k&&k.kod)||'')).filter(Boolean);

  // ── Sol filtre grupları ────────────────────────────────────────────────
  // ⛔ KALDIRILAN KONTROLLER (karşılığı olan kolon canlı REST'te YOK, ölü kontrol bırakılmaz):
  //    · "Yapay Zekâ ile Önerilen"  → ilanlar'da öneri/skor kolonu yok (kullanıcıya göre eşleştirme
  //      motoru bu sayfada kurulu değil).
  //    · "İşin Yapılacağı İl"       → il kolonu yok; `isin_yapilacagi_yer` serbest metin ve il adı
  //      çoğu kayıtta hiç geçmiyor (ANKARA: il=618 kayda karşılık metinde 160 → %26). Bağlansaydı
  //      kullanıcıya sessizce eksik liste gösterirdi.
  //    · "Benzer İş"                → benzer_is kolonu yok (42703).
  //    · "Düzeltme İlanı"           → düzeltme bilgisi tutan kolon yok (42703).
  const GRUPLAR=[
    {id:'kelime', ad:'Kelime Arama', html:`<input class="v1-f-input" id="f-kelime" placeholder="İhale adı, İKN veya DT no…">`},
    {id:'yayin',  ad:'Yayın Tarihi', html:`<div class="v1-f-ikili"><div><span class="v1-f-etiket">Başlangıç</span><input type="date" class="v1-f-input" id="f-yayin1" autocomplete="off"></div><div><span class="v1-f-etiket">Bitiş</span><input type="date" class="v1-f-input" id="f-yayin2" autocomplete="off"></div></div>`},
    {id:'ihaleT', ad:'İhale Tarihi', html:`<div class="v1-f-ikili"><div><span class="v1-f-etiket">Başlangıç</span><input type="date" class="v1-f-input" id="f-tarih1" autocomplete="off"></div><div><span class="v1-f-etiket">Bitiş</span><input type="date" class="v1-f-input" id="f-tarih2" autocomplete="off"></div></div>`},
    {id:'maliyet',ad:'Yaklaşık Maliyet', html:`<div class="v1-f-ikili"><div><span class="v1-f-etiket">Min ₺</span><input type="number" class="v1-f-input" id="f-min" placeholder="0"></div><div><span class="v1-f-etiket">Max ₺</span><input type="number" class="v1-f-input" id="f-max" placeholder="—"></div></div>`},
    {id:'tip',    ad:'İhale Tipi', html:`<select class="v1-f-select" id="f-tur"><option value="">Tümü</option>${TURLER.map(t=>`<option>${t}</option>`).join('')}</select>`},
    {id:'usul',   ad:'İhale Usulü', html:`<select class="v1-f-select" id="f-usul"><option value="">Tümü</option>${USULLER.map(u=>`<option value="${esc(u.v)}">${esc(u.ad)}</option>`).join('')}</select>`},
    {id:'idare',  ad:'İhale Yapan İdare', html:`<input class="v1-f-input" id="f-idare" placeholder="İdare adı…"><span class="v1-f-etiket" id="f-idare-not"></span>`},
    {id:'sektor', ad:'Sektörler', html:`<select class="v1-f-select" id="f-kategori"><option value="">Tümü</option>${KATEGORILER.map(k=>`<option>${esc(k)}</option>`).join('')}</select>`},
    {id:'il',     ad:'İhalenin Yapılacağı İl', html:`<select class="v1-f-select" id="f-il"><option value="">Tümü</option>${ILLER.map(i=>`<option>${i}</option>`).join('')}</select>`},
    {id:'sozT',   ad:'Sözleşme / Teklif Fiyat Türü', html:`<select class="v1-f-select" id="f-sozt"><option value="">Tümü</option>${SOZ_TURLERI.map(s=>`<option value="${s.v}">${s.ad}</option>`).join('')}</select><span class="v1-f-etiket">Bu bilgi yalnızca ilanda yayımlandığında kayıtlıdır; seçim yapıldığında bilgisi olmayan ilanlar listeden çıkar.</span>`},
    {id:'diger',  ad:'Diğer Filtreler', html:`<label style="display:flex;gap:8px;align-items:center;font-size:13px;"><input type="checkbox" id="f-maliyetli"> Yalnız yaklaşık maliyeti ilan edilenler</label>`},
  ];
  // "Aramayı Kaydet" ve temizleme bu listeyi kullanır (tek kaynak).
  const FILTRE_IDLER=['f-kelime','f-yayin1','f-yayin2','f-tarih1','f-tarih2','f-min','f-max',
                      'f-tur','f-usul','f-idare','f-kategori','f-il','f-sozt','f-eihale','f-maliyetli'];

  function filtreleriKur(){
    document.getElementById('v1-filtre-gruplar').innerHTML = GRUPLAR.map(g=>
      `<div class="v1-filtre-grup" data-g="${g.id}">
         <button class="v1-filtre-btn">${g.ad}<span class="ok">›</span></button>
         <div class="v1-filtre-icerik">${g.html}</div>
       </div>`).join('') +
      `<div style="padding:12px 16px;border-bottom:1px solid var(--v1-cizgi);">
         <button style="width:100%;background:var(--v1-teal-acik);border:1px solid var(--v1-teal);color:var(--v1-lacivert);
           border-radius:8px;padding:9px;font-family:var(--v1-font);font-size:13px;font-weight:700;cursor:pointer;"
           id="f-kaydet">⭐ Aramayı Kaydet</button>
       </div>`;
    document.querySelectorAll('.v1-filtre-btn').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('acik')));
    document.getElementById('f-kaydet').addEventListener('click',aramaKaydet);
  }

  /* ── DOĞRUDAN TEMİN'de Türkçe kelime araması ───────────────────────────────
     `dogrudan_temin_ilanlari` tablosunda `baslik_fold` KOLONU YOK (canlı REST: 42703 —
     backend/migration_dt_arama.sql prod'a uygulanmamış) → window.v1Ara burada kullanılamaz.
     Düz `ilike('baslik','%insaat%')` ise İKİ AYRI şekilde bozuk (ikisi de canlı ölçüldü):
       · Türkçe katlamıyor  → "insaat" 0 satır, "asansor" 0 satır
       · 1,49M satırda tam tabloda 57014 statement timeout → sayfa "Liste yüklenemedi" diyor
     Çözüm: PostgREST `imatch` (POSIX ~*) + Türkçe harf sınıfları.
     Ölçüm: "insaat" → 200/0,52sn ve 126 doğru satır, 0 yanlış eşleşme; "asansor" → 0,26sn.
     ⚠️ Regex meta karakterleri kaçırılmazsa PostgreSQL 2201B ("invalid regular expression")
        döndürüp sorguyu düşürüyor → beyaz liste dışındaki her karakter `.` yapılır. */
  const TR_SINIF={ i:'[iıİI]', c:'[cçCÇ]', g:'[gğGĞ]', o:'[oöOÖ]', s:'[sşSŞ]', u:'[uüUÜ]' };
  function dtRegex(metin){
    const f=(window.trFold?window.trFold(metin):(metin||'').toLocaleLowerCase('tr')).trim();
    if(f.length<2) return '';
    return f.split('').map(ch=>{
      if(TR_SINIF[ch]) return TR_SINIF[ch];
      if(ch===' ') return '\\s+';
      if(/[a-z0-9]/.test(ch)) return ch;
      return '.';                       // nokta/parantez/virgül vb. → tek karakter jokeri
    }).join('');
  }

  // ── Sorgu ──
  // ⚠️ 1,96M satırda select+count:'exact'+order+range BİRLİKTE statement_timeout'a takılıyor.
  //    Sayımı AYRI hafif sorguya böldük (head:true — KPI'da çalışan desen), veri sorgusu count'suz.
  function sorguKur(sayimIcin){
    // ── DOĞRUDAN TEMİN kaynağı: AYRI tablo (dogrudan_temin_ilanlari), farklı kolonlar ──
    if (dtModu()) {
      // ⛔ `idare` anon'a KAPALI (42501). Koşulsuz select'e konursa TÜM sorgu düşer ve
      //    misafirde DT sekmesi hiç açılmaz — bu yüzden üyelik dallanması ŞART.
      const dtKolon = sayimIcin ? 'id'
        : ('id,dt_no,baslik,tur,il,tarih,durum,kategori,yayin_tarihi'+(uyeMi?',idare':''));
      let d = sb.from('dogrudan_temin_ilanlari').select(dtKolon, sayimIcin?{count:'exact',head:true}:undefined);
      // durum'a göre daralt: Sonuçlar → sonucu duyurulmuş DT, Geçmiş → henüz sonuçlanmamış DT.
      // (dt sekmesi: tümü.) Canlı doğrulandı: "Sonuç Duyurusu…" 2,55M · "Doğrudan Temin Duyurusu…" 408K.
      if (sekme==='sonuc')       d=d.in('durum',['Sonuç Duyurusu Yayımlanmış','Sonuç Bilgileri Gönderildi','Doğrudan Temin Sonuçlandırıldı']);
      else if (sekme==='gecmis') d=d.in('durum',['Teklifler Değerlendiriliyor','Doğrudan Temin Duyurusu Yayımlanmış']).lt('tarih', new Date().toISOString());
      // dt sekmesi: filtresiz → AÇIK DT; ama idare/kelime ile drill-down → TÜM durum (kurum 'DT Kayıtları' o idarenin hepsini görsün)
      else if (!(uyeMi && val('f-idare')) && !val('f-kelime')) d=d.eq('durum','Doğrudan Temin Duyurusu Yayımlanmış').gte('tarih', new Date().toISOString());
      const kw=val('f-kelime');
      if(kw){
        // DT numarası (ör. 25DT2095274) → dt_no TAM eşleşme (indeksli, ~1sn). Prefix ilike
        //   dt_no'da indekssiz → 57014 timeout, o yüzden YALNIZ eq. Aksi halde başlıkta regex.
        if(/^\s*\d{2}\s*DT\s*\d+\s*$/i.test(kw)){ d=d.eq('dt_no', kw.replace(/\s+/g,'').toUpperCase()); }
        else { const rgx=dtRegex(kw); if(rgx) d=d.filter('baslik','imatch',rgx); }
      }
      if(val('f-tarih1')) d=d.gte('tarih',val('f-tarih1'));
      if(val('f-tarih2')) d=d.lte('tarih',val('f-tarih2')+'T23:59:59');
      if(val('f-yayin1')) d=d.gte('yayin_tarihi',val('f-yayin1'));
      if(val('f-yayin2')) d=d.lte('yayin_tarihi',val('f-yayin2')+'T23:59:59');
      if(val('f-tur'))    d=d.eq('tur',val('f-tur'));
      if(val('f-il'))     d=d.eq('il',val('f-il'));
      if(val('f-kategori')) d=d.eq('kategori',val('f-kategori'));
      // İdare filtresi: idare GIN-trgm indeksi (idx_dt_idare_trgm) ile ilike hızlı. arama_fold
      // DT'de YOK (migration_dt_arama prod'a uygulanmadı) — kullanma. bkz migration_dt_idare_trgm.
      if(uyeMi && val('f-idare')) d = d.ilike('idare','%'+val('f-idare')+'%');
      return d;
    }
    const kolon = sayimIcin ? 'id' : (uyeMi
      ? 'id,ekap_id,baslik,il,tur,usul,kategori,idare,durum,ilan_tarihi,son_teklif_tarihi,yaklasik_maliyet_min,yaklasik_maliyet_max'
      : 'id,baslik,il,tur,usul,kategori,durum,ilan_tarihi,son_teklif_tarihi');
    let q = sb.from('ilanlar').select(kolon, sayimIcin?{count:'exact',head:true}:undefined);
    if (sekme==='aktif') {
      // Teklif süresi DEVAM EDEN ihaleler (ihalepro "Aktif İhaleler" davranışı).
      // gte, indeksin 2. kolonunda aralık koşulu → idx_ilanlar_durum_son_teklif ile uyumlu,
      // ayrıca NULL tarihli eski kayıtları da eler (NULLS FIRST yan etkisi).
      // İdare drill-down (kurum→"Tüm İhaleleri") veya İKN/ekap_id araması → o idareye/kayda TÜM durumdan
      // eriş (aktif filtre atlanır). Düz BAŞLIK KELİMESİ araması → aktif filtre UYGULANIR: "Aktif İhaleler"
      // sekmesinde aktif sonuç beklenir (26-4: kelime arayınca aktif-dışı 2021-23 dönüp sekmeyle çelişiyordu).
      const _kw = val('f-kelime');
      const _iknArama = _kw && uyeMi && /^\s*(\d{4}\/\d+|ILN\d+|DMO[-\d]+)\s*$/i.test(_kw);
      if (!(uyeMi && val('f-idare')) && !_iknArama) q=q.eq('durum','aktif').gte('son_teklif_tarihi', new Date().toISOString());
    } else if (sekme==='gecmis') {
      // Geçmiş = süresi geçmiş, SONUCU AÇIKLANMAMIŞ ihaleler = durum 'kapali' (~1,6M).
      // ⛔ ESKİ HATA: yalnız 'aktif ama son_teklif geçmiş' (~271) alınıyordu → 1,6M kapalı ihale
      //    hiçbir sekmede görünmüyordu. 'kapali' = teklif süresi bitmiş, EKAP'ta sonuç ilanı
      //    yayımlanmamış (sonuclandi'ye geçmemiş) ihaleler. idx_ilanlar_durum_son_teklif ile uyumlu.
      q=q.eq('durum','kapali');
    } else q=q.eq('durum','sonuclandi');
    // ⛔ Düz `.ilike('baslik','%insaat%')` Türkçe İ/ı'da SESSİZCE 0 döner. Katlanmış
    //    `baslik_fold` kolonu misafire de AÇIK ve trgm indeksli (ölçüm: 0,18sn).
    // İKN / ekap_id ile arama: "2026/1224100", "ILN02520263", "DMO-17786" gibi kimlikler
    //   başlıkta geçmez → ekap_id TAM eşleşme. ekap_id anon'a KAPALI → yalnız üyede. Aksi
    //   halde başlıkta katlanmış arama (baslik_fold, trgm indeksli).
    const ikw = val('f-kelime');
    if (ikw && uyeMi && /^\s*(\d{4}\/\d+|ILN\d+|DMO[-\d]+)\s*$/i.test(ikw)) {
      q = q.eq('ekap_id', ikw.trim().toUpperCase());
    } else {
      q = window.v1Ara ? window.v1Ara(q,'baslik_fold',ikw)
                       : (ikw ? q.ilike('baslik','%'+ikw+'%') : q);
    }
    if(val('f-tarih1')) q=q.gte('son_teklif_tarihi',val('f-tarih1'));
    if(val('f-tarih2')) q=q.lte('son_teklif_tarihi',val('f-tarih2')+'T23:59:59');
    if(val('f-yayin1')) q=q.gte('ilan_tarihi',val('f-yayin1'));
    if(val('f-yayin2')) q=q.lte('ilan_tarihi',val('f-yayin2')+'T23:59:59');
    if(val('f-min'))    q=q.gte('yaklasik_maliyet_min',val('f-min'));
    if(val('f-max'))    q=q.lte('yaklasik_maliyet_max',val('f-max'));
    if(val('f-tur'))    q=q.eq('tur',val('f-tur'));
    if(val('f-usul')){ const u=USULLER.find(x=>x.v===val('f-usul')); if(u) q=u.uygula(q); }  // bkz. USULLER
    if(val('f-il'))     q=q.eq('il',val('f-il'));
    if(val('f-kategori')) q=q.eq('kategori',val('f-kategori'));
    if(val('f-sozt'))   q=q.eq('teklif_fiyat_turu',val('f-sozt'));
    if(uyeMi && val('f-idare')) q=q.ilike('idare','%'+val('f-idare')+'%');
    if(isaretli('f-eihale'))   q=q.is('teklif_elektronik',true);
    if(isaretli('f-maliyetli')) q=q.not('yaklasik_maliyet_min','is',null);
    return q;
  }

  // DT'de listelenen/sıralanan tarih kolonu. Yayın tarihi filtresi açıkken `order=tarih.desc`
  // ile birlikte kullanmak 57014 timeout veriyordu (ölçüm: 500/3,16sn); aynı sorgu
  // `order=yayin_tarihi.desc` ile 200/0,20sn. Bu yüzden yayın filtresi açılınca sıralama da
  // yayın tarihine geçer ve ilk sütun yayın tarihini gösterir (kullanıcı ne olduğunu görsün).
  function dtSiralamaTazele(){
    if(!dtModu()) return;
    const yayinFiltre = !!(val('f-yayin1')||val('f-yayin2'));
    if(yayinFiltre && sirala==='tarih') sirala='yayin_tarihi';
    else if(!yayinFiltre && sirala==='yayin_tarihi') sirala='tarih';
  }
  /* ⚠️ BOŞ DEĞERİN YERİ İNDEKSLE EŞLEŞMELİ — yoksa planner indeksi kullanamaz ve
     tablo baştan taranıp 57014 gelir. Kural KOLONA GÖRE DEĞİŞİYOR (hepsi canlı ölçüldü):
       ilanlar.son_teklif_tarihi  → nullsFirst = ascending      (idx … DESC NULLS LAST)
       dogrudan_temin.tarih       → nullsFirst = ascending      (asc 0,22sn · desc 0,22sn)
       dogrudan_temin.yayin_tarihi→ nullsFirst = !ascending
         (desc.nullsfirst 0,17sn / desc.nullslast 3,17sn-500 · asc.nullslast 0,21sn / asc.nullsfirst 3,16sn-500)
     Genel `nullsFirst: yon` kuralı yayın tarihine uygulanınca yayın filtresi
     her seferinde "zaman aşımı" veriyordu. */
  const NULL_ONCE_TERS={ yayin_tarihi:true };
  const nullsIlk=(kolon,asc)=> NULL_ONCE_TERS[kolon] ? !asc : asc;

  /* DT tablosu 2,95M satır ve `baslik` / `il` için sıralama indeksi YOK → o başlıklara
     tıklamak garantili 57014 (ölçüldü: 500/3,2sn ve 3,3sn). Aynı sıralama `ilanlar`da
     sorunsuz (aktif 0,38sn / 0,28sn — sonuç 1,57sn). Bu yüzden yalnız DT sekmesinde
     bu iki başlık pasifleşir; kullanıcı tıklayıp hata ekranı görmesin. */
  const DT_SIRALANAMAZ=['baslik','il'];
  const TH_ETIKET={'th-baslik':'İKN / İhale Adı','th-il':'İhale İli'};
  function basliklariAyarla(){
    const th=document.getElementById('th-tarih');
    if(th){
      if(!dtModu()){ th.dataset.sirala='son_teklif_tarihi'; th.textContent='İhale Tarihi ⇅'; }
      else{
        const yayin = sirala==='yayin_tarihi';
        th.dataset.sirala = yayin ? 'yayin_tarihi' : 'tarih';
        th.textContent    = (yayin ? 'Yayın Tarihi' : 'DT Tarihi')+' ⇅';
      }
    }
    Object.keys(TH_ETIKET).forEach(id=>{
      const e=document.getElementById(id); if(!e) return;
      const kapali = dtModu() && DT_SIRALANAMAZ.includes(e.dataset.sirala);
      e.dataset.kapali = kapali ? '1' : '';
      e.style.cursor   = kapali ? 'default' : 'pointer';
      e.title          = kapali ? 'Doğrudan temin listesi çok büyük olduğu için bu sütuna göre sıralama kapalı.' : '';
      e.textContent    = TH_ETIKET[id] + (kapali ? '' : ' ⇅');
    });
  }

  // ── Uygulanan filtre çipleri (EKAP tarzı) — her çip ✕ ile tek tek kaldırılır ──
  const CIP_TANIM = [
    {ids:['f-kelime'], et:'Arama'},
    {ids:['f-yayin1','f-yayin2'], et:'Yayın Tarihi', aralik:true},
    {ids:['f-tarih1','f-tarih2'], et:'İhale Tarihi', aralik:true},
    {ids:['f-min','f-max'], et:'Yaklaşık Maliyet', aralik:true, para:true},
    {ids:['f-tur'], et:'İhale Tipi'},
    {ids:['f-usul'], et:'Usul', sel:true},
    {ids:['f-idare'], et:'İdare'},
    {ids:['f-kategori'], et:'Sektör'},
    {ids:['f-il'], et:'İl'},
    {ids:['f-sozt'], et:'Fiyat Türü', sel:true},
    {ids:['f-maliyetli'], et:'Yalnız yaklaşık maliyetli', onay:true},
  ];
  function cipDeger(t){
    if(t.onay){ const e=document.getElementById(t.ids[0]); return (e&&e.checked)?'Evet':''; }
    if(t.aralik){ let a=val(t.ids[0]), b=val(t.ids[1]); if(!a&&!b) return '';
      if(t.para){ a=a?tl(a):'…'; b=b?tl(b):'…'; } else { a=a||'…'; b=b||'…'; }
      return a+' – '+b; }
    const e=document.getElementById(t.ids[0]);
    if(!e||!e.value) return '';
    if(t.sel){ return e.options[e.selectedIndex] ? e.options[e.selectedIndex].text : e.value; }
    return e.value.trim();
  }
  function filtreCipleriGoster(){
    const kap=document.getElementById('v1-cipler');
    if(!kap) return;
    const cipler=[];
    CIP_TANIM.forEach((t,i)=>{
      const d=cipDeger(t);
      if(d) cipler.push(`<span class="v1-cip" data-cip="${i}"><b>${esc(t.et)}:</b> ${esc(d)}<button class="v1-cip-x" data-cip-sil="${i}" title="Bu filtreyi kaldır">✕</button></span>`);
    });
    if(!cipler.length){ kap.style.display='none'; kap.innerHTML=''; return; }
    kap.innerHTML = cipler.join('') + `<button class="v1-cip-temizle" id="v1-cip-temizle">Filtreleri Temizle</button>`;
    kap.style.display='flex';
  }

  async function yukle(){
    const istek = ++yukleIstek;
    const tb=document.getElementById('v1-tbody');
    tb.innerHTML='<tr><td colspan="5" class="v1-bos">Yükleniyor…</td></tr>';
    dtSiralamaTazele(); basliklariAyarla();
    filtreCipleriGoster();
    // 26-4: Aktif sekmesinde kelime araması KAPSAMI TÜM ZAMANLARA genişliyor (sorguKur ~358);
    //       başlık "Aktif İhaleler" kalırsa yanıltıcı → arama modunda başlığı netleştir.
    if(sekme==='aktif'){
      const _kw=val('f-kelime');
      // 26-4: düz başlık kelimesi artık aktif filtreyle sorgulanıyor → başlık "Aktif İhaleler";
      // yalnız İKN/ekap_id araması tüm durumdan çektiği için "(tüm zamanlar)" kalır.
      const _iknArama = _kw && uyeMi && /^\s*(\d{4}\/\d+|ILN\d+|DMO[-\d]+)\s*$/i.test(_kw);
      const _h = _kw ? ('“'+_kw+'” için '+(_iknArama?'İhaleler (tüm zamanlar)':'Aktif İhaleler')) : 'Aktif İhaleler';
      const _b1=document.getElementById('v1-baslik'), _b2=document.getElementById('v1-liste-baslik');
      if(_b1) _b1.textContent=_h; if(_b2) _b2.textContent=_h;
      document.title=_h+' — İhaleGlobal';
    }
    try{
      const bas=(sayfa-1)*SAYFA_BOY;
      // Veri + sayım PARALEL, ayrı sorgular (sayım head:true → satır indirmez)
      const [veriRes, sayimRes] = await Promise.all([
        sorguKur(false).order(sirala,{ascending:yon,nullsFirst:nullsIlk(sirala,yon)}).range(bas,bas+SAYFA_BOY-1),
        sorguKur(true).then(r=>r).catch(()=>({count:null})),
      ]);
      const {data,error}=veriRes;
      if(error) throw error;
      if(istek !== yukleIstek) return;   // araya yeni yukle girdi (tab/filtre değişti) → bayat cevabı at
      toplam = (sayimRes && sayimRes.count!=null) ? sayimRes.count : null;
      document.getElementById('v1-sayi').innerHTML = toplam!=null
        ? `Arama kriterinize uygun <strong>${num(toplam)}</strong> ${kayitEtiketi()} listeleniyor`
        : `<strong>${(data||[]).length}</strong> kayıt gösteriliyor`;
      if(!data||!data.length){ tb.innerHTML='<tr><td colspan="5" class="v1-bos">Kayıt bulunamadı. Filtreleri değiştirip tekrar deneyin.</td></tr>'; sayfalamaKur(); return; }
      // Doğrudan Temin SONUÇLARI: kazanan bedeli ayrı tablodan (dogrudan_temin_sonuclari) sayfa
      // başına dt_no ile eşleştir (kazanan ADI anon'a kapalı; bedel açık ve kamuya açık veri).
      if(sekme==='sonuc' && dtModu()){
        try{
          const nos=data.map(r=>r.dt_no).filter(Boolean);
          if(nos.length){
            const {data:bd}=await sb.from('dogrudan_temin_sonuclari').select('dt_no,kazanan_bedel'+(uyeMi?',kazanan_firma':'')).in('dt_no',nos);
            const mB={},mF={}; (bd||[]).forEach(x=>{ if(mB[x.dt_no]==null) mB[x.dt_no]=x.kazanan_bedel; if(x.kazanan_firma&&mF[x.dt_no]==null) mF[x.dt_no]=x.kazanan_firma; });
            data.forEach(r=>{ r._bedel=mB[r.dt_no]; r._kazanan=mF[r.dt_no]; });
          }
        }catch(_){}
      }
      // İhale SONUÇLARI: kazanan/sözleşme bedelini ihale_sonuclari'ndan (ilan_id ile) ekle
      if(sekme==='sonuc' && !dtModu()){
        try{
          const ids=data.map(r=>r.id).filter(Boolean);
          if(ids.length){
            const {data:bd}=await sb.from('ihale_sonuclari').select('ilan_id,kazanan_teklif,sozlesme_bedeli'+(uyeMi?',kazanan_firma':'')).in('ilan_id',ids);
            const mB={},mF={}; (bd||[]).forEach(x=>{ const v=(x.sozlesme_bedeli!=null)?x.sozlesme_bedeli:x.kazanan_teklif; if(v!=null && mB[x.ilan_id]==null) mB[x.ilan_id]=v; if(x.kazanan_firma&&mF[x.ilan_id]==null) mF[x.ilan_id]=x.kazanan_firma; });
            data.forEach(r=>{ if(r._bedel==null) r._bedel=mB[r.id]; if(r._kazanan==null) r._kazanan=mF[r.id]; });
          }
        }catch(_){}
      }
      if(istek !== yukleIstek) return;   // bedel fetch'leri sırasında yeni yukle → bayat çizme
      tb.innerHTML=data.map(r=>satir(r)).join('');
      tb.querySelectorAll('[data-genislet]').forEach(b=>b.addEventListener('click',()=>genislet(b)));
      tb.querySelectorAll('[data-takvim]').forEach(b=>b.addEventListener('click',()=>
        window.v1Takvim(b.dataset.takvim, b.dataset.ad, b.dataset.tarih, b.dataset.yol)));
      tb.querySelectorAll('[data-takip]').forEach(b=>b.addEventListener('click',()=>takipYaz(b)));
      if(uyeMi&&uid) takipDurumlariniIsaretle((data||[]).map(r=>r.id));
      sayfalamaKur();
    }catch(e){
      // 57014 = statement timeout: çok geniş tarama. Kullanıcıya "bozuk" değil "daralt" de.
      const mesaj = (e&&e.code==='57014')
        ? 'Bu arama zaman aşımına uğradı. Daha belirgin bir kelime yazın veya tarih / il gibi bir filtre ekleyin.'
        : 'Liste yüklenemedi. '+esc((e&&e.message)||'');
      tb.innerHTML=`<tr><td colspan="5" class="v1-bos">${mesaj}</td></tr>`;
      document.getElementById('v1-sayi').textContent='—';
    }
  }

  function satir(r){
    // DT sekmesinde tarih alanı 'tarih' (yayın filtresi açıkken 'yayin_tarihi'), kimlik 'dt_no';
    // ilan tablosunda 'son_teklif_tarihi' / 'ekap_id'.
    const dtMi = dtModu();
    // İhale modunda son_teklif_tarihi boşsa (eski/aranmış kayıtlar) ilan tarihine düş → "—" kalmasın.
    const ham = dtMi ? (sirala==='yayin_tarihi' ? r.yayin_tarihi : r.tarih) : (r.son_teklif_tarihi || r.ilan_tarihi);
    const t=ham?new Date(ham):null;
    const kalan=t?Math.ceil((t-new Date())/86400000):null;
    const tarih=t?t.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):'—';
    const saat=t?t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'';
    const detayHref = dtMi ? `v1-dt-detay?dt_no=${encodeURIComponent(r.dt_no||"")}&id=${r.id}` : `v1-ihale-detay?id=${r.id}`;
    return `<tr data-id="${r.id}">
      <td class="v1-t-tarih">${tarih}${kalan!=null&&kalan>=0?`<br><span class="kalan">Son ${kalan} gün</span>`:''}</td>
      <td><div class="v1-t-ikn">${esc((dtMi?r.dt_no:r.ekap_id)||'—')}</div><a class="v1-t-ad" href="${detayHref}">${esc(r.baslik||'—')}</a><div class="v1-t-idare" style="font-size:11.5px;margin-top:3px;line-height:1.3;">${r.idare?('🏛 <a href="v1-kurum-analiz?kurum='+encodeURIComponent(r.idare)+'" title="İdarenin analiz sayfasını aç" style="color:var(--v1-muted);text-decoration:none;border-bottom:1px dotted var(--v1-muted);">'+esc(r.idare)+'</a>'):''}</div></td>
      <td style="font-size:12.5px;color:var(--v1-metin-2);">${esc(r.tur||'—')}<br><span style="color:var(--v1-muted);">${esc(dtMi?(r.kategori||''):usulTemiz(r.usul||''))}</span>${(r._bedel!=null)?`<br><span style="color:var(--v1-teal);font-weight:700;">${tl(r._bedel)}</span>`:''}${r._kazanan?`<br><span style="color:var(--v1-lacivert);font-weight:600;font-size:11.5px;">🏆 ${esc(r._kazanan)}</span>`:''}${(sekme==='sonuc'&&dtMi&&r._bedel==null&&!r._kazanan)?`<br><span style="color:var(--v1-muted);font-size:11px;">kazanan verisi işleniyor</span>`:''}</td>
      <td style="font-size:13px;">${esc(r.il||'—')}</td>
      <td><div class="v1-t-islem">
        ${!dtMi?`<button class="v1-yuvarlak-btn" title="Takip et" data-takip="${r.id}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4 14.72 8.79 21.65 9.39 16.4 13.94 17.97 20.7 12 17.11 6.03 20.7 7.6 13.94 2.35 9.39 9.28 8.79 12 2.4Z"/></svg></button>`:''}
        <!-- ⛔ INLINE onclick KULLANILMAZ. Öznitelik değeri, JS olarak derlenmeden ÖNCE HTML
             varlık çözümlemesinden geçiyor: başlıktaki kesme işareti için üretilen &#39;
             gerçek ' karakterine dönüşüp dizgiyi erkenden kapatıyordu. Tarayıcıda ölçüldü:
             tıklamada "Uncaught SyntaxError: missing ) after argument list" → düğme ölü.
             Aktif ihalelerin %2,4'ünde (5.604'te 136 — "Enerya Karaman'dan …") ve DT'de
             ("PLASTİK BARDAK (100'lü PAKET)") vuruyordu. Veri artık data-* ile taşınıyor;
             data-genislet düğmesindeki desenin aynısı. -->
        <button class="v1-yuvarlak-btn" title="Takvime ekle" data-takvim="${r.id}"
                data-ad="${esc((r.baslik||'').slice(0,60))}" data-tarih="${ham||''}"
                data-yol="${esc(detayHref)}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7 2v2H5.5A2.5 2.5 0 0 0 3 6.5v13A2.5 2.5 0 0 0 5.5 22h13a2.5 2.5 0 0 0 2.5-2.5v-13A2.5 2.5 0 0 0 18.5 4H17V2h-2v2H9V2H7Zm12 8H5v9.5c0 .28.22.5.5.5h13a.5.5 0 0 0 .5-.5V10Z"/></svg>
        </button>
        <button class="v1-yuvarlak-btn" title="Detay" data-genislet="${r.id}" style="background:#fff;color:var(--v1-mavi);border:1.5px solid var(--v1-cizgi);">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.4 5.6 9l1.4-1.4 5 5 5-5L18.4 9 12 15.4Z"/></svg>
        </button>
      </div></td></tr>`;
  }

  function genislet(btn){
    const tr=btn.closest('tr'); const id=btn.dataset.genislet;
    const mevcut=tr.nextElementSibling;
    if(mevcut&&mevcut.classList.contains('v1-detay-tr')){ mevcut.remove(); return; }
    const d=document.createElement('tr'); d.className='v1-detay-tr';
    d.innerHTML=`<td colspan="5" class="v1-detay"><div class="v1-detay-grid" id="d-${id}">Yükleniyor…</div></td>`;
    tr.after(d);
    (async()=>{
      const kutu=document.getElementById('d-'+id);
      const kilit='<span class="v1-kilit">••••• 🔒</span>';
      const alan=(b,v)=>`<div><b>${b}</b>${v||'—'}</div>`;
      try{
        if(dtModu()){   // DT ayrı tablo — kendi alanları
          // ⛔ `idare` anon'a kapalı → misafir dalında select'e KONMAZ (yoksa 42501 ile
          //    tüm detay sorgusu düşer ve "Detay yüklenemedi" çıkar).
          const dtKolon=(uyeMi?'idare,':'')+'kategori,tur,il,yayin_tarihi,dt_no';
          const {data,error}=await sb.from('dogrudan_temin_ilanlari').select(dtKolon).eq('id',id).limit(1);
          if(error) throw error;
          const r=(data||[])[0]||{};
          kutu.innerHTML=
            alan('İdare',uyeMi?esc(r.idare||'—'):kilit)+
            alan('Sektör',esc(r.kategori))+alan('Tür',esc(r.tur))+alan('İl',esc(r.il))+
            alan('Yayın Tarihi',r.yayin_tarihi?new Date(r.yayin_tarihi).toLocaleDateString('tr-TR'):'—')+
            `<div><b>İşlem</b><a href="v1-dt-detay?dt_no=${encodeURIComponent(r.dt_no||'')}&id=${id}">Doğrudan temin detayına git →</a></div>`;
          return;
        }
        const kolon = uyeMi ? 'idare,kategori,yaklasik_maliyet_min,yaklasik_maliyet_max,ilan_tarihi,ekap_id' : 'kategori,ilan_tarihi';
        const {data,error}=await sb.from('ilanlar').select(kolon).eq('id',id).limit(1);
        if(error) throw error;
        const r=(data||[])[0]||{};
        kutu.innerHTML=
          alan('İdare',uyeMi?esc(r.idare||'—'):kilit)+
          alan('Sektör',esc(r.kategori))+
          alan('İlan Tarihi',r.ilan_tarihi?new Date(r.ilan_tarihi).toLocaleDateString('tr-TR'):'—')+
          alan('Yaklaşık Maliyet',uyeMi?(r.yaklasik_maliyet_min?tl(r.yaklasik_maliyet_min)+(r.yaklasik_maliyet_max?' – '+tl(r.yaklasik_maliyet_max):''):'İlan edilmemiş'):kilit)+
          `<div><b>İşlem</b><a href="v1-ihale-detay?id=${id}">İhale detayına git →</a> · <a href="v1-teklif-olustur?ihale_id=${id}">Teklif oluştur →</a></div>`;
      }catch(e){ if(kutu) kutu.textContent='Detay yüklenemedi. '+((e&&e.message)||''); }
    })();
  }

  function sayfalamaKur(){
    const el=document.getElementById('v1-sayfalama');
    if(toplam==null){ // sayım alınamadı (timeout) → basit ileri/geri
      el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹ Önceki</button>`+
        `<button class="aktif" disabled>${sayfa}</button><button data-s="${sayfa+1}">Sonraki ›</button>`;
      el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
        const s=+b.dataset.s; if(s<1)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
      }));
      return;
    }
    const sonSayfa=Math.max(1,Math.ceil(toplam/SAYFA_BOY));
    if(sonSayfa<=1){ el.innerHTML=''; return; }
    const gorunur=[]; const bas=Math.max(1,sayfa-2), bit=Math.min(sonSayfa,bas+4);
    for(let i=bas;i<=bit;i++) gorunur.push(i);
    el.innerHTML =
      `<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹</button>`+
      gorunur.map(i=>`<button class="${i===sayfa?'aktif':''}" data-s="${i}">${i}</button>`).join('')+
      `<button ${sayfa===sonSayfa?'disabled':''} data-s="${sayfa+1}">›</button>`;
    el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1||s>sonSayfa)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
    }));
  }

  // ── Aramayı kaydet ────────────────────────────────────────────────────────
  // ⚠️ İKİ HATA VARDI: (1) tabloda `kriter` diye kolon yok — şema `kayitli_aramalar
  //    (user_id, yerel_id, ad, params jsonb)`; (2) supabase-js yazma işlemi HATA FIRLATMAZ,
  //    `{error}` döndürür → try/catch boş geçiyor ve kod her koşulda "kaydedildi ✓" diyordu.
  //    user_id NOT NULL ve RLS `user_id = auth.uid()` istiyor → elle gönderilmek ZORUNDA.
  async function aramaKaydet(){
    if(!uyeMi||!uid){ alert('Arama kaydetmek için giriş yapın.'); return; }
    const ad=(prompt('Bu aramaya bir ad verin:')||'').trim(); if(!ad) return;
    const params={sekme};
    FILTRE_IDLER.forEach(id=>{
      const e=document.getElementById(id); if(!e) return;
      if(e.type==='checkbox'){ if(e.checked) params[id]=true; }
      else if(e.value&&e.value.trim()) params[id]=e.value.trim();
    });
    const btn=document.getElementById('f-kaydet'); const eski=btn.textContent;
    btn.textContent='Kaydediliyor…'; btn.disabled=true;
    const {error}=await sb.from('kayitli_aramalar')
      .insert({ user_id: uid, yerel_id: Date.now(), ad, params });
    btn.textContent=eski; btn.disabled=false;
    if(error){ alert('Arama kaydedilemedi: '+(error.message||error.code||'bilinmeyen hata')); return; }
    alert('Arama kaydedildi ✓');
  }

  // Takvime ekle (ICS)
  // ⚠️ URL satırı SEKMEYE göre kurulur: DT kaydının id'si `dogrudan_temin_ilanlari`ye ait,
  //    sabit `/ihale-detay?id=` bağlantısı o id'yi ihale tablosunda arayıp boş sayfa açıyordu.
  //    Satırın kendi detay yolu (`data-yol`) taşınıyor.
  // ── Takip Et (satır içi yıldız) — takipler tablosu (ilan_id). DT satırlarında yok. ──
  async function takipDurumlariniIsaretle(ids){
    if(!uyeMi||!uid||!ids||!ids.length) return;
    try{
      const {data}=await sb.from('takipler').select('ilan_id').eq('kullanici_id',uid).in('ilan_id',ids);
      if(!data) return;
      const s=new Set(data.map(x=>x.ilan_id));
      document.querySelectorAll('[data-takip]').forEach(b=>{
        const on=s.has(b.dataset.takip);
        b.dataset.on=on?'1':''; b.style.background=on?'#E8A400':'';
        b.title=on?'Takipte — çıkarmak için tıkla':'Takip et';
      });
    }catch(_){}
  }
  async function takipYaz(b){
    if(!uyeMi||!uid){ if(confirm('Takip için giriş yapmalısınız. Giriş sayfasına gidilsin mi?')) location.href='login'; return; }
    const iid=b.dataset.takip; b.disabled=true;
    try{
      if(b.dataset.on){
        const {error}=await sb.from('takipler').delete().eq('kullanici_id',uid).eq('ilan_id',iid);
        if(error) throw error; b.dataset.on=''; b.style.background=''; b.title='Takip et';
      }else{
        const {error}=await sb.from('takipler').upsert({kullanici_id:uid,ilan_id:iid},{onConflict:'kullanici_id,ilan_id',ignoreDuplicates:true});
        if(error) throw error; b.dataset.on='1'; b.style.background='#E8A400'; b.title='Takipte — çıkarmak için tıkla';
      }
    }catch(e){ alert('İşlem başarısız: '+((e&&e.message)||'')); }
    b.disabled=false;
  }

  window.v1Takvim=(id,baslik,tarih,yol)=>{
    if(!tarih){ alert('Bu kayıtta tarih bilgisi yok.'); return; }
    const d=new Date(tarih); const f=(x)=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const dtMi = dtModu();
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ihaleglobal//TR','BEGIN:VEVENT',
      'UID:'+id+'@ihaleglobal.com','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(new Date(d.getTime()+36e5)),
      'SUMMARY:'+String(baslik).replace(/[,;]/g,' '),
      'DESCRIPTION:İhaleGlobal — '+(dtMi?'doğrudan temin tarihi':'son teklif tarihi'),
      'URL:https://ihaleglobal.com/'+(yol||('v1-ihale-detay?id='+id)),'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
    a.download='ihale.ics'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  };

  /* ── ?ara= parametresinin yorumu ───────────────────────────────────────────
     v1-bank.html `v1-ihaleler?ara=<İDARE ADI>` linki üretiyor. Metin ihale BAŞLIĞINDA
     arandığı için "Sağlık Bakanlığı" gibi bir bağlantı alakasız/boş sonuç döndürüyordu.
     Karar: gelen metin kurum adı kalıbına uyuyorsa arama İDARE alanına yazılır (üyelik
     gerekir — `idare` anon'a kapalı), aksi halde kelime kutusuna. Hangi yorumun
     seçildiği kullanıcıya şeritte gösterilir ve tek tıkla diğerine çevrilebilir —
     tahmin sessizce dayatılmaz. */
  // ⚠️ SON EKE BAKILIR, gövdeye DEĞİL. Aynı `?ara=` parametresini üst bardaki serbest arama
  //    kutusu da üretiyor; "hastane"/"kurumu" gibi parçalar gövdede arandığında
  //    "Hastane Malzemesi Alımı" gibi MEŞRU bir kelime aramasını idare aramasına çevirirdi.
  //    Kurum adları neredeyse daima kurumsal ekle BİTER → yanlış pozitif yerine yanlış
  //    negatifi seçiyoruz (yanlış negatifin bedeli: eski davranış olan kelime araması).
  const IDARE_SON_EK=/(bakanligi|mudurlugu|baskanligi|belediyesi|universitesi|hastanesi|komutanligi|valiligi|kaymakamligi|rektorlugu|genel sekreterligi|idaresi|kurumu|kurulu|enstitusu)$/;
  function idareAdiMi(m){
    const f=(window.trFold?window.trFold(m):String(m).toLocaleLowerCase('tr')).replace(/[\s.]+$/,'');
    return f.length>=15 && IDARE_SON_EK.test(f);
  }
  function araNotYaz(html){
    const el=document.getElementById('v1-ara-not');
    if(!el) return;
    if(!html){ el.style.display='none'; el.innerHTML=''; return; }
    el.innerHTML=html; el.style.display='';
  }
  // Şeridi HER yazdığında değiştir düğmesini yeniden bağlar — tek seferlik olmasın diye.
  function araSeridiCiz(metin, idareModu){
    const dugme='<button id="v1-ara-degistir" style="background:none;border:none;padding:0 0 0 6px;'+
      'font-family:inherit;font-size:12.5px;font-weight:700;color:var(--v1-mavi);cursor:pointer;'+
      'text-decoration:underline;">'+(idareModu?'Bunun yerine ihale adında ara':'Bunun yerine idare adında ara')+'</button>';
    araNotYaz(idareModu
      ? `<strong>${esc(metin)}</strong> bir kurum adı gibi göründüğü için <strong>İdare</strong> alanında arandı.`+dugme
      : `<strong>${esc(metin)}</strong> ihale <strong>adında</strong> arandı.`+dugme);
    const dgs=document.getElementById('v1-ara-degistir');
    if(dgs) dgs.addEventListener('click',()=>{
      const yeniIdareModu=!idareModu;
      setVal('f-idare', yeniIdareModu?metin:'');
      setVal('f-kelime',yeniIdareModu?'':metin);
      araSeridiCiz(metin,yeniIdareModu);
      sayfa=1; yukle();
    });
  }
  function araParametresiniYerlestir(){
    const metin=(P.get('ara')||'').trim();
    if(!metin) return;
    if(idareAdiMi(metin) && uyeMi){
      setVal('f-idare',metin); setVal('f-kelime','');
      araSeridiCiz(metin,true);
    }else if(idareAdiMi(metin)){
      // Misafirde idare filtresi kullanılamaz (ilanlar.idare anon'a kapalı, 42501) → şerit
      // yalnız bilgilendirir, çevirme düğmesi verilmez.
      setVal('f-kelime',metin);
      araNotYaz(`<strong>${esc(metin)}</strong> ihale <strong>adında</strong> arandı. İdare adına göre arama üyelere özeldir — `+
        `<a href="login" style="color:var(--v1-mavi);font-weight:700;">giriş yapın</a>.`);
    }else{
      setVal('f-kelime',metin);
      araNotYaz(`<strong>${esc(metin)}</strong> başlıkta arandı — kapsam sekmeye göre değişir: `+
        `<strong>Aktif İhaleler</strong> yalnız teklif süresi açık olanları, `+
        `<strong>Sonuçlar</strong> / <strong>Geçmiş</strong> ise geçmiş kayıtları gösterir.`);
    }
  }

  // ── Başlat ──
  (async()=>{
    filtreleriKur();
    try{ const {data}=await sb.auth.getSession();
      uyeMi=!!(data&&data.session); uid=uyeMi?data.session.user.id:null;
      if(uyeMi){ const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',uid).maybeSingle();
        if(window.v1PaketYaz) v1PaketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel'); }
      else if(window.v1PaketYaz) v1PaketYaz('Misafir');
    }catch(_){}

    // İdare filtresi yalnız üyede çalışır (anon'a kapalı kolon) — kutuyu buna göre işaretle.
    if(!uyeMi){
      const e=document.getElementById('f-idare');
      if(e){ e.disabled=true; e.placeholder='Üyelere özel'; }
      const n=document.getElementById('f-idare-not');
      if(n) n.textContent='İdare adına göre filtreleme üyelere özeldir.';
    }

    // ── URL parametreleri → filtre kutuları (sorgu SADECE kutuları okur) ──
    // ⚠️ SIRA ÖNEMLİ: sekmeAyarla() yukle() çağırdığı için parametreler ONDAN ÖNCE yazılmalı.
    //    Eskiden ?kategori / ?idare sekme kurulduktan SONRA yazılıyordu → ilk yüklemede yok sayılıyordu.
    araParametresiniYerlestir();
    if(P.get('il'))       setVal('f-il',P.get('il').toLocaleUpperCase('tr'));
    if(P.get('kategori')) setVal('f-kategori',P.get('kategori'));
    if(uyeMi && P.get('idare')) setVal('f-idare',P.get('idare'));

    // Sekme + Sonuç Türü seçiminden efektif kaynağı kurar: başlık / filtre görünürlüğü /
    // sıralama ayarlar ve listeyi yükler. Hem sekme düğmeleri hem İhale/DT seçicisi buraya düşer.
    const kaynakKur=()=>{ sayfa=1;
      const dt=dtModu();
      ['aktif','sonuc','gecmis','dt'].forEach(x=>document.getElementById('sekme-'+x).classList.toggle('aktif',sekme===x));
      // İhale/DT seçicisi yalnız Sonuçlar ve Geçmiş sekmelerinde görünür
      const sec=document.getElementById('sonuc-tip-satir');
      if(sec) sec.style.display=(sekme==='sonuc'||sekme==='gecmis')?'':'none';
      document.querySelectorAll('.v1-tip-btn').forEach(b=>b.classList.toggle('aktif',b.dataset.tip===sonucTip));
      // DT ayrı tabloda → sıralama kolonu da farklı (DT'de son_teklif_tarihi YOK: 42703)
      sirala = dt ? 'tarih' : 'son_teklif_tarihi';
      yon = (sekme==='aktif');   // aktifte en yakın tarih önce, diğerlerinde en yeni/en son önce
      const bas = sekme==='aktif' ? 'Aktif İhaleler'
                : sekme==='dt'    ? 'Açık Doğrudan Teminler'
                : sekme==='sonuc' ? (dt?'Doğrudan Temin Sonuçları':'Sonuçlanan İhaleler')
                :                   (dt?'Geçmiş Doğrudan Teminler':'Geçmiş İhaleler');  // gecmis
      document.getElementById('v1-baslik').textContent=bas;
      document.getElementById('v1-liste-baslik').textContent=bas;
      document.title=bas+' — İhaleGlobal';
      // DT tablosunda karşılığı OLMAYAN filtreleri gizle:
      //   usul / yaklaşık maliyet / teklif fiyat türü / "yaklaşık maliyeti ilan edilenler"
      ['usul','maliyet','sozT','diger'].forEach(g=>{
        const el=document.querySelector(`.v1-filtre-grup[data-g="${g}"]`);
        if(el) el.style.display = dt ? 'none' : '';
      });
      // E-İhale anahtarı da yalnız ilanlar tablosunda var (teklif_elektronik)
      const eih=document.getElementById('f-eihale-satir');
      if(eih) eih.style.display = dt ? 'none' : '';
      basliklariAyarla();
      yukle();
    };
    const sekmeAyarla=(s)=>{ sekme=s; kaynakKur(); };
    document.getElementById('sekme-aktif').addEventListener('click',()=>sekmeAyarla('aktif'));
    document.getElementById('sekme-sonuc').addEventListener('click',()=>sekmeAyarla('sonuc'));
    document.getElementById('sekme-gecmis').addEventListener('click',()=>sekmeAyarla('gecmis'));
    document.getElementById('sekme-dt').addEventListener('click',()=>sekmeAyarla('dt'));
    // İhale / Doğrudan Temin seçicisi (Sonuçlar & Geçmiş) → aynı sayfada kaynak değiştirir
    document.querySelectorAll('.v1-tip-btn').forEach(b=>b.addEventListener('click',()=>{
      if(sonucTip===b.dataset.tip) return; sonucTip=b.dataset.tip; kaynakKur();
    }));

    document.getElementById('f-uygula').addEventListener('click',()=>{sayfa=1;yukle();});
    document.getElementById('f-temizle').addEventListener('click',()=>{
      document.querySelectorAll('.v1-f-input,.v1-f-select').forEach(e=>e.value='');
      document.querySelectorAll('.v1-filtre input[type=checkbox]').forEach(e=>e.checked=false);
      araNotYaz('');
      sayfa=1; yukle();
    });
    // Filtre çipleri: ✕ tek filtreyi kaldırır, "Filtreleri Temizle" hepsini
    document.getElementById('v1-cipler').addEventListener('click',(e)=>{
      const sil=e.target.closest('[data-cip-sil]');
      if(sil){
        const t=CIP_TANIM[Number(sil.dataset.cipSil)];
        if(t) t.ids.forEach(id=>{const el=document.getElementById(id); if(el){ if(el.type==='checkbox') el.checked=false; else el.value=''; }});
        sayfa=1; yukle();
        return;
      }
      if(e.target.closest('#v1-cip-temizle')){
        document.querySelectorAll('.v1-f-input,.v1-f-select').forEach(el=>el.value='');
        document.querySelectorAll('.v1-filtre input[type=checkbox]').forEach(el=>el.checked=false);
        araNotYaz('');
        sayfa=1; yukle();
      }
    });
    // Listede ara (client-side, mevcut sayfada)
    document.getElementById('v1-listede-ara').addEventListener('input',(e)=>{
      const q=e.target.value.toLocaleLowerCase('tr');
      document.querySelectorAll('#v1-tbody tr:not(.v1-detay-tr)').forEach(tr=>{
        tr.style.display = tr.textContent.toLocaleLowerCase('tr').includes(q) ? '' : 'none';
      });
    });
    // Sıralama (th'nin data-sirala'sı ve pasifliği sekmeye göre basliklariAyarla() ile güncelleniyor)
    document.querySelectorAll('[data-sirala]').forEach(th=>th.addEventListener('click',()=>{
      if(th.dataset.kapali==='1') return;      // DT'de baslik/il sıralaması kapalı
      const k=th.dataset.sirala; if(sirala===k) yon=!yon; else {sirala=k; yon=true;} sayfa=1; yukle();
    }));

    sekmeAyarla(sekme);   // tek giriş noktası: başlıkları/gizlemeleri kurar ve yukle() çağırır
  })();
})();
</script>
</body>
</html>
