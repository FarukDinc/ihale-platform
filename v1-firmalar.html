<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Ömer Faruk Dinç">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firmalar — İhaleGlobal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v1.css?v=4" />
  <style>
    .v1-sayfa-baslik { font-size:22px; font-weight:800; color:var(--v1-lacivert); margin-bottom:4px; }
    .v1-sayfa-alt { font-size:13.5px; color:var(--v1-muted); margin-bottom:16px; }
    .v1-sekmeler { display:flex; gap:26px; border-bottom:2px solid var(--v1-cizgi); margin-bottom:18px; flex-wrap:wrap; }
    .v1-sekme { background:none; border:none; padding:10px 2px 12px; font-family:var(--v1-font); font-size:15px;
      font-weight:700; color:var(--v1-muted); cursor:pointer; position:relative; }
    .v1-sekme.aktif { color:var(--v1-lacivert); }
    .v1-sekme.aktif::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:3px; background:var(--v1-mavi); border-radius:2px; }
    .v1-firma-ad { color:var(--v1-mavi); font-weight:600; }
    .v1-uyari { background:var(--v1-mavi-acik); border:1px solid #CFE2F5; border-radius:12px; padding:16px 18px;
      font-size:13.5px; color:var(--v1-metin); margin-bottom:16px; }
  </style>
</head>
<body class="v1" data-v1-aktif="firmalar" data-v1-kirinti="İhaleGlobal > Firmalar">
<div class="v1-app">
  <div class="v1-main">
    <div class="v1-govde">
      <div class="v1-sayfa-baslik">Yüklenici Firmalar</div>
      <div class="v1-sayfa-alt">Kamu ihalesi kazanan firmalar — sözleşme sayısı ve toplam ciroya göre sıralı.</div>

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="v1-sekmeler" style="margin:0;">
          <button class="v1-sekme aktif" id="s-tum">Tüm Firmalar</button>
          <button class="v1-sekme" id="s-takip">Takip Ettiklerim</button>
          <button class="v1-sekme" id="s-yildiz">Parlayan Yıldızlar</button>
        </div>
        <span style="flex:1;"></span>
        <a href="v1-firma-segmentleri" style="display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--v1-mavi);
          border:1.5px solid var(--v1-cizgi);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px;text-decoration:none;">⭐ Firma Segmentleri →</a>
      </div>

      <div id="v1-misafir" class="v1-uyari" style="display:none;">
        🔒 Firma listesi ve ciro verileri <strong>üyelere özeldir</strong>.
        <a href="login">Giriş yapın</a> veya <a href="fiyatlandirma_odeme_bolumu">üye olun</a> →
      </div>

      <div class="v1-kart" style="padding:18px 20px;">
        <div class="v1-tablo-bas">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--v1-lacivert);" id="v1-liste-baslik">Tüm Firmalar</div>
            <div class="v1-tablo-sayi" id="v1-sayi">Yükleniyor…</div>
          </div>
          <div class="v1-listede-ara">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--v1-muted)"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.25 1.42-1.42-4.25-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>
            <input type="text" id="v1-ara-liste" placeholder="Firma adı ara">
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="v1-tablo" id="v1-tablo">
            <thead><tr>
              <th style="width:44px;">#</th><th>Firma</th>
              <th style="width:100px;">İl</th>
              <th style="width:120px;">Sözleşme</th>
              <th style="width:160px;">Toplam Ciro</th>
              <th style="width:120px;"></th>
            </tr></thead>
            <tbody id="v1-tbody"><tr><td colspan="6" class="v1-bos">Yükleniyor…</td></tr></tbody>
          </table>
        </div>
        <div class="v1-sayfalama" id="v1-sayfalama"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/v1-kabuk.js?v=6"></script>
<script>
(() => {
  const SB_URL="https://ihaleglobal.com", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0MzA3MTU4LCJleHAiOjE5NDE5ODcxNTh9.CjNKulvirotDD_y2oO2QKgo0kbqYvL0jUSV1RiDMoso";
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const num=(n)=>(Number(n)||0).toLocaleString('tr-TR');
  const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tl=(v)=>v==null?'—':'₺'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:0});
  const trFold=(s)=>(s||'').toLocaleLowerCase('tr').replace(/i̇/g,'i').replace(/ç/g,'c').replace(/ğ/g,'g')
    .replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u');
  const P=new URLSearchParams(location.search);
  const BOY=25;
  let sayfa=1, uyeMi=false, mod='tum', takipli=new Set(), aramaT;

  async function yukle(){
    const tb=document.getElementById('v1-tbody');
    tb.innerHTML='<tr><td colspan="6" class="v1-bos">Yükleniyor…</td></tr>';
    if(!uyeMi){
      document.getElementById('v1-misafir').style.display='block';
      tb.innerHTML='<tr><td colspan="6" class="v1-bos">🔒 Firma listesi üyelere özeldir. <a href="login">Giriş yapın →</a></td></tr>';
      document.getElementById('v1-sayi').textContent='';
      return;
    }
    try{
      const q=(document.getElementById('v1-ara-liste').value||'').trim();
      let sorgu=sb.from('yukleniciler').select('id,ad,il,toplam_sozlesme_sayisi,toplam_ciro');
      if(mod==='takip'){
        const ids=[...takipli]; if(!ids.length){ tb.innerHTML='<tr><td colspan="6" class="v1-bos">Henüz firma takip etmiyorsunuz.</td></tr>'; document.getElementById('v1-sayi').textContent=''; return; }
        sorgu=sorgu.in('ad',ids);
      }
      if(q) sorgu=sorgu.ilike('arama_fold','%'+trFold(q)+'%');
      // Parlayan Yıldızlar: son dönemde yükselen — ciroya göre değil sözleşme sayısına göre (proxy)
      const sirala = (mod==='yildiz') ? 'toplam_sozlesme_sayisi' : 'toplam_ciro';
      const bas=(sayfa-1)*BOY;
      const {data,error}=await sorgu.order(sirala,{ascending:false,nullsFirst:false}).range(bas,bas+BOY-1);
      if(error) throw error;
      if(!data||!data.length){ tb.innerHTML='<tr><td colspan="6" class="v1-bos">Sonuç bulunamadı.</td></tr>'; document.getElementById('v1-sayi').textContent=''; return; }
      document.getElementById('v1-sayi').innerHTML=`Sayfa <strong>${sayfa}</strong> · ${data.length} firma gösteriliyor`;
      tb.innerHTML=data.map((r,i)=>{
        const t=takipli.has(r.ad);
        return `<tr>
          <td style="color:var(--v1-muted);font-weight:700;">${(sayfa-1)*BOY+i+1}</td>
          <td><a class="v1-firma-ad" href="v1-firma-analiz?ara=${encodeURIComponent(r.ad)}">${esc(r.ad)}</a></td>
          <td style="font-size:13px;">${esc(r.il||'—')}</td>
          <td style="font-weight:700;color:var(--v1-lacivert);">${num(r.toplam_sozlesme_sayisi)}</td>
          <td style="font-weight:700;color:var(--v1-mavi);">${tl(r.toplam_ciro)}</td>
          <td style="text-align:right;">
            <button class="v1-tk" data-ad="${esc(r.ad)}" style="background:${t?'var(--v1-mavi)':'#fff'};color:${t?'#fff':'var(--v1-mavi)'};
              border:1.5px solid var(--v1-mavi);border-radius:8px;padding:6px 12px;font-family:var(--v1-font);
              font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;">${t?'✓ Takipte':'+ Takip Et'}</button></td></tr>`;
      }).join('');
      tb.querySelectorAll('.v1-tk').forEach(b=>b.addEventListener('click',()=>takipToggle(b.dataset.ad)));
      sayfalama(data.length);
    }catch(e){ tb.innerHTML=`<tr><td colspan="6" class="v1-bos">Liste yüklenemedi. ${esc(e.message||'')}</td></tr>`; }
  }

  function sayfalama(adet){
    const el=document.getElementById('v1-sayfalama');
    el.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">‹ Önceki</button>`+
      `<button class="aktif" disabled>${sayfa}</button>`+
      `<button ${adet<BOY?'disabled':''} data-s="${sayfa+1}">Sonraki ›</button>`;
    el.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
    }));
  }

  async function takipToggle(ad){
    if(!uyeMi){ alert('Firma takibi için giriş yapmalısınız.'); return; }
    try{
      if(takipli.has(ad)){ await sb.from('takip_firmalar').delete().eq('firma_adi',ad); takipli.delete(ad); }
      else { await sb.from('takip_firmalar').insert({firma_adi:ad}); takipli.add(ad); }
      yukle();
    }catch(e){ alert('İşlem başarısız: '+(e.message||'')); }
  }

  (async()=>{
    try{ const {data}=await sb.auth.getSession(); uyeMi=!!(data&&data.session);
      if(uyeMi){
        try{ const {data:t}=await sb.from('takip_firmalar').select('firma_adi'); (t||[]).forEach(r=>takipli.add(r.firma_adi)); }catch(_){}
        const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',data.session.user.id).maybeSingle();
        if(window.v1PaketYaz) v1PaketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel');
      } else if(window.v1PaketYaz) v1PaketYaz('Misafir');
    }catch(_){}
    if(P.get('ara')) document.getElementById('v1-ara-liste').value=P.get('ara');
    document.getElementById('v1-ara-liste').addEventListener('input',()=>{clearTimeout(aramaT); aramaT=setTimeout(()=>{sayfa=1;yukle();},350);});
    const sek=(id,m,baslik)=>document.getElementById(id).addEventListener('click',()=>{
      mod=m; sayfa=1;
      ['s-tum','s-takip','s-yildiz'].forEach(x=>document.getElementById(x).classList.toggle('aktif',x===id));
      document.getElementById('v1-liste-baslik').textContent=baslik; yukle();
    });
    sek('s-tum','tum','Tüm Firmalar'); sek('s-takip','takip','Takip Ettiğim Firmalar'); sek('s-yildiz','yildiz','Parlayan Yıldızlar');
    yukle();
  })();
})();
</script>
</body>
</html>
