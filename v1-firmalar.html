  // â”€â”€ Segment Ã§ipleri â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  function cipleriYaz(){
    el('v1-cipler').innerHTML=
      `<button class="v1-cip${segment?'':' aktif'}" data-seg="">TÃ¼mÃ¼</button>`+
      Object.keys(SEGMENTLER).map(k=>
        `<button class="v1-cip${segment===k?' aktif':''}" data-seg="${esc(k)}">${SEGMENTLER[k].emoji} ${esc(SEGMENTLER[k].ad)}</button>`

    el('v1-cipler').querySelectorAll('[data-seg]').forEach(b=>{
      b.addEventListener('click',()=>{
        const s=b.dataset.seg||'';
        if(s===segment) return;
        segment=s;
        // KullanÄ±cÄ± kendi sÄ±ralamasÄ±nÄ± seÃ§mediyse segmentin doÄŸal (indeksli) sÃ¼tununa geÃ§
        if(!siralaSecildi && segment){
          sirala=SEGMENTLER[segment].dogalSirala; yon=SEGMENTLER[segment].dogalYon;
        } else if(!siralaSecildi){

  function ipucuYaz(){
    const e=el('v1-seg-ipucu');
    if(segment && SEGMENTLER[segment]){
      e.innerHTML=`${SEGMENTLER[segment].emoji} <strong>${esc(SEGMENTLER[segment].ad)}</strong> â€” ${esc(SEGMENTLER[segment].ipucu)}`;

  function temizleGoster(){
    // Misafirde il/arama kutularÄ± disabled, segment Ã§ipi hiÃ§ basÄ±lmÄ±yor â†’ temizlenecek
    // hiÃ§bir ÅŸey YOK. ?ara= disabled kutuya yine de yazÄ±lÄ±yor (link neyi arÄ±yordu
    // gÃ¶rÃ¼nsÃ¼n diye); dÃ¼ÄŸmeyi ona bakarak aÃ§arsak hiÃ§bir ÅŸey yapmayan dÃ¼ÄŸme Ã§Ä±kÄ±yordu.
    if(!uyeMi){ el('v1-temizle').style.display='none'; return; }
    const q=(el('v1-ara-liste').value||'').trim();
    el('v1-temizle').style.display=(il||segment||q)?'inline-block':'none';

  function listeBasligiYaz(){
    let b = (mod==='takip') ? 'Takip EttiÄŸim Firmalar'
          : (segment && SEGMENTLER[segment]) ? SEGMENTLER[segment].emoji+' '+SEGMENTLER[segment].ad
          : 'TÃ¼m Firmalar';
    if(il) b+=' â€” '+il;
    el('v1-liste-baslik').textContent=b;
  }

  // â”€â”€ Liste â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  async function yukle(){
    const tb=el('v1-tbody');
    const KS=kolonSayisi();
    // Her yÃ¼kleme bir sÄ±ra numarasÄ± alÄ±r: arama debounce'u/sekme deÄŸiÅŸimi Ã¼st Ã¼ste
    // binince ESKÄ° isteÄŸin geÃ§ dÃ¶nen cevabÄ± yeniyi ezmesin.
    const benim=++istekNo;
    const bosalt=()=>{ el('v1-sayi').textContent=''; el('v1-sayfalama').innerHTML=''; };
    listeBasligiYaz();
    tb.innerHTML=`<tr><td colspan="${KS}" class="v1-bos">YÃ¼kleniyorâ€¦</td></tr>`;
    if(!uyeMi){
      el('v1-misafir').style.display='block';
      tb.innerHTML=`<tr><td colspan="${KS}" class="v1-bos">ğŸ”’ Firma listesi Ã¼yelere Ã¶zeldir. <a href="login">GiriÅŸ yapÄ±n â†’</a></td></tr>`;
      bosalt();
      return;
    }
    try{
      const q=(el('v1-ara-liste').value||'').trim();
      if(mod==='takip' && !takipli.size){
        tb.innerHTML=`<tr><td colspan="${KS}" class="v1-bos">HenÃ¼z firma takip etmiyorsunuz.</td></tr>`;
        bosalt(); return;
      }
      const bas=(sayfa-1)*BOY;
      const cfg=SIRALANABILIR[sirala]||SIRALANABILIR[VARSAYILAN_SIRALA];
      // Her deneme iÃ§in TAZE builder: supabase-js builder'Ä± bir kez await edildikten sonra
      // yeniden filtrelenip Ã§alÄ±ÅŸtÄ±rÄ±lamaz.
      const temel=()=>{
        let s=sb.from('yukleniciler')
          .select('id,ad,il,toplam_sozlesme_sayisi,toplam_ciro,ciro_son_12ay,ciro_onceki_12ay,buyume_yuzde');
        if(mod==='takip') s=s.in('ad',[...takipli]);
        if(il) s=s.eq('il',il);
        if(segment && SEGMENTLER[segment]) s=s.eq(SEGMENTLER[segment].kolon,true);
        if(cfg.bosOlabilir) s=s.not(sirala,'is',null);
        return s;
      };
      /**
       * âš ï¸ NULL YÃ–NÃœ Ä°NDEKSE GÃ–RE: btree indeksi ancak "ASC NULLS LAST" ya da
       *    "DESC NULLS FIRST" istendiÄŸinde okunabilir (ikisi aynÄ± indeksin ileri/geri
       *    taramasÄ±). Yani nullsFirst = !ascending. Ters yazÄ±lÄ±rsa planlayÄ±cÄ± indeksi
       *    bÄ±rakÄ±p tÃ¼m tabloyu sÄ±ralar. Zaten NULL'lu sÃ¼tunlarda satÄ±rlarÄ± yukarÄ±da
       *    eleyip bu seÃ§imi tamamen etkisiz hÃ¢le getiriyoruz.
       */
      const artan=artanMi();
      const calistir=(s)=>s.order(sirala,{ascending:artan,nullsFirst:!artan}).range(bas,bas+BOY-1);
      // yukleniciler.arama_fold = tr_fold(ad) â€” GENERATED kolon, trigram indeksli.
      // TÃ¼m tablo anon'a kapalÄ± (42501) zaten; bu dal yalnÄ±zca Ã¼yede Ã§alÄ±ÅŸÄ±yor.
      let sorgu=temel();
      if(q){
        if(!window.v1Ara) throw new Error('Arama modÃ¼lÃ¼ yÃ¼klenemedi, sayfayÄ± yenileyin.');
        sorgu=window.v1Ara(sorgu,'arama_fold',q);
      }
      let {data,error}=await calistir(sorgu);
      if(benim!==istekNo) return;   // daha yeni bir yÃ¼kleme baÅŸladÄ±, bu cevabÄ± yazma
      // Emniyet (firma-analiz.html:1191 ile aynÄ± desen): arama_fold prod'da yoksa sayfayÄ±
      // Ã¶ldÃ¼rme, dÃ¼z ad ILIKE'a dÃ¼ÅŸ â€” bu yedek TÃ¼rkÃ§e Ä°/Ä±'da eksik sonuÃ§ verir, uyarÄ± bÄ±rak.
      if(error && q && /arama_fold/.test(error.message||'')){
        console.warn('yukleniciler.arama_fold okunamadÄ±, dÃ¼z ad ILIKE yedeÄŸine dÃ¼ÅŸÃ¼ldÃ¼:',error.message);
        // virgÃ¼l/parantez PostgREST sorgu ayrÄ±ÅŸtÄ±rÄ±cÄ±sÄ±nÄ± bozar â†’ temizle
        ({data,error}=await calistir(temel().ilike('ad','*'+q.replace(/[,()*]/g,' ').trim()+'*')));
        if(benim!==istekNo) return;
      }
      if(error) throw error;
      if(!data||!data.length){ tb.innerHTML=`<tr><td colspan="${KS}" class="v1-bos">SonuÃ§ bulunamadÄ±.</td></tr>`; bosalt(); return; }

      const kapsam = il
        ? `${esc(il)} Â· <strong>${num(ilAdet.get(il)||0)}</strong> firma kayÄ±tlÄ±`
        : 'TÃ¼rkiye geneli';
      const notlar=[];
      if(cfg.bosOlabilir) notlar.push(`${esc(cfg.ad)} verisi olmayan firmalar bu sÄ±ralamada listelenmez`);
      el('v1-sayi').innerHTML=
        `${kapsam} Â· <strong>${esc(cfg.ad)}</strong> ${artan?'artan':'azalan'} Â· Sayfa <strong>${sayfa}</strong> Â· ${data.length} firma gÃ¶steriliyor`+
        (notlar.length?`<br><span style="font-size:12px;">${notlar.join(' Â· ')}</span>`:'');

      tb.innerHTML=data.map((r,i)=>{
        const t=takipli.has(r.ad);
        let ekstra='';
        if(uyeMi){
          const b=r.buyume_yuzde;
          const bHucre=(b==null)
            ? '<td class="v1-sayi" style="color:var(--v1-muted);">â€”</td>'
            : `<td class="v1-sayi ${Number(b)>=0?'v1-buyume-poz':'v1-buyume-neg'}"`+
              ` title="Ã–nceki 12 ay: ${esc(tl(r.ciro_onceki_12ay))}">`+
              `${Number(b)>=0?'+':''}${Number(b).toLocaleString('tr-TR',{maximumFractionDigits:1})}%</td>`;
          ekstra=`<td class="v1-sayi" style="font-weight:700;color:var(--v1-lacivert);">${tl(r.ciro_son_12ay)}</td>`+bHucre;
        }
        return `<tr>
          <td style="color:var(--v1-muted);font-weight:700;">${(sayfa-1)*BOY+i+1}</td>
          <td><a class="v1-firma-ad" href="v1-firma-analiz?ara=${encodeURIComponent(r.ad)}">${esc(r.ad)}</a></td>
          <td style="font-size:13px;">${esc(r.il||'â€”')}</td>
          <td class="v1-sayi" style="font-weight:700;color:var(--v1-lacivert);">${num(r.toplam_sozlesme_sayisi)}</td>
          <td class="v1-sayi" style="font-weight:700;color:var(--v1-mavi);">${tl(r.toplam_ciro)}</td>
          ${ekstra}
          <td style="text-align:right;">
            <button class="v1-tk" data-ad="${esc(r.ad)}" style="background:${t?'var(--v1-mavi)':'#fff'};color:${t?'#fff':'var(--v1-mavi)'};
              border:1.5px solid var(--v1-mavi);border-radius:8px;padding:6px 12px;font-family:var(--v1-font);
              font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;">${t?'âœ“ Takipte':'+ Takip Et'}</button></td></tr>`;
      }).join('');
      tb.querySelectorAll('.v1-tk').forEach(b=>b.addEventListener('click',()=>takipToggle(b)));
      sayfalama(data.length);
    }catch(e){
      if(benim!==istekNo) return;
      tb.innerHTML=`<tr><td colspan="${KS}" class="v1-bos">Liste yÃ¼klenemedi. ${esc(e.message||'')}</td></tr>`;
      bosalt();   // yoksa "YÃ¼kleniyorâ€¦" sayacÄ± ve ESKÄ° sayfalama dÃ¼ÄŸmeleri ekranda kalÄ±yordu
    }
  }

  function sayfalama(adet){
    const e=el('v1-sayfalama');
    e.innerHTML=`<button ${sayfa===1?'disabled':''} data-s="${sayfa-1}">â€¹ Ã–nceki</button>`+
      `<button class="aktif" disabled>${sayfa}</button>`+
      `<button ${adet<BOY?'disabled':''} data-s="${sayfa+1}">Sonraki â€º</button>`;
    e.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{
      const s=+b.dataset.s; if(s<1)return; sayfa=s; yukle(); window.scrollTo({top:0,behavior:'smooth'});
      const m=document.querySelector('.v1-main'); if(m) m.scrollTop=0;
    }));
  }

  function tkBoya(btn,t){
    btn.style.background=t?'var(--v1-mavi)':'#fff';
    btn.style.color=t?'#fff':'var(--v1-mavi)';
    btn.textContent=t?'âœ“ Takipte':'+ Takip Et';
  }

  // â›” Ä°KÄ° SESSÄ°Z HATA VARDI:
  //    1) kolon adÄ± `firma_adi` idi â€” canlÄ± ÅŸema `firma_ad` (REST: 42703 "does not exist"),
  //    2) `kullanici_id` NOT NULL + default YOK â†’ gÃ¶nderilmeyince satÄ±r hiÃ§ yazÄ±lmÄ±yordu.
  //    ÃœstÃ¼ne supabase-js yazma Ã§aÄŸrÄ±larÄ± HATA FIRLATMAZ, {error} dÃ¶ndÃ¼rÃ¼r; try/catch boÅŸ
  //    geÃ§iyor ve dÃ¼ÄŸme koÅŸulsuz "âœ“ Takipte" oluyordu. ArtÄ±k her Ã§aÄŸrÄ±da {error} kontrol
  //    ediliyor, hata varsa dÃ¼ÄŸme eski haline dÃ¶nÃ¼yor ve kullanÄ±cÄ±ya sÃ¶yleniyor.
  async function takipToggle(btn){
    const ad=btn.dataset.ad;
    if(!uyeMi||!uid){ alert('Firma takibi iÃ§in giriÅŸ yapmalÄ±sÄ±nÄ±z.'); return; }
    const oncekiDurum=takipli.has(ad);
    btn.disabled=true; btn.style.opacity='.6'; btn.textContent='â€¦';
    try{
      if(oncekiDurum){
        const {error}=await sb.from('takip_firmalar').delete()
          .eq('kullanici_id',uid).eq('firma_ad',ad);
        if(error) throw error;
        takipli.delete(ad);
      } else {
        // UNIQUE(kullanici_id,firma_ad) migration_takip_firmalar.sql:22'de var AMA canlÄ±da
        // olduÄŸu anon anahtarla doÄŸrulanamÄ±yor (INSERT 42501). UygulanmamÄ±ÅŸsa on_conflict
        // 42P10 ile HER takip denemesini Ã¶ldÃ¼rÃ¼rdÃ¼ â†’ dÃ¼z insert'e dÃ¼ÅŸ; 23505 (zaten takipte)
        // hata deÄŸil, baÅŸarÄ± sayÄ±lÄ±r.
        let {error}=await sb.from('takip_firmalar').upsert(
          {kullanici_id:uid, firma_ad:ad},
          {onConflict:'kullanici_id,firma_ad', ignoreDuplicates:true});
        if(error && error.code==='42P10'){
          console.warn('takip_firmalar UNIQUE kÄ±sÄ±tÄ± canlÄ±da yok, dÃ¼z insert:',error.message);
          ({error}=await sb.from('takip_firmalar').insert({kullanici_id:uid, firma_ad:ad}));
        }
        if(error && error.code!=='23505') throw error;
        takipli.add(ad);
      }
      // "Takip Ettiklerim" sekmesinde liste Ã¼yeliÄŸi deÄŸiÅŸti â†’ yeniden Ã§iz
      if(mod==='takip'){ yukle(); return; }
      btn.disabled=false; btn.style.opacity='';
      tkBoya(btn,takipli.has(ad));
    }catch(e){
      btn.disabled=false; btn.style.opacity='';
      tkBoya(btn,oncekiDurum);
      alert('Takip iÅŸlemi kaydedilemedi: '+(e.message||'bilinmeyen hata'));
    }
  }

  // â”€â”€ AÃ§Ä±lÄ±ÅŸ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  (async()=>{
    urlOku();
    try{ const {data}=await sb.auth.getSession(); uyeMi=!!(data&&data.session);
      uid=uyeMi?data.session.user.id:null;
      if(uyeMi){
        // takip_firmalar.firma_ad (firma_adi DEÄÄ°L) + kendi satÄ±rlarÄ±n
        const {data:t,error:tHata}=await sb.from('takip_firmalar')
          .select('firma_ad').eq('kullanici_id',uid);
        if(tHata) console.warn('Takip listesi okunamadÄ±:',tHata.message);
        else (t||[]).forEach(r=>takipli.add(r.firma_ad));
        const {data:k}=await sb.from('kullanici_krediler').select('plan').eq('kullanici_id',uid).maybeSingle();
        paketYaz(['standart','kurumsal'].includes(k?.plan)?'Pro':'Temel');
      } else paketYaz('Misafir');
    }catch(_){ if(!uyeMi) paketYaz('Misafir'); }

    yetkiyeGoreKirp();
    // Segment URL'den geldiyse ve kullanÄ±cÄ± sÄ±ralama seÃ§mediyse doÄŸal sÃ¼tuna geÃ§
    if(segment && !siralaSecildi){
      sirala=SEGMENTLER[segment].dogalSirala; yon=SEGMENTLER[segment].dogalYon;
    }

    const araEl=el('v1-ara-liste');
    const ilEl=el('v1-il');
    // âš ï¸ ?ara= kutuya illeriYukle()'DEN Ã–NCE yazÄ±lmalÄ±: geÃ§ersiz bir ?il= geldiÄŸinde
    //    illeriYukle onu dÃ¼ÅŸÃ¼rÃ¼p urlYaz() Ã§aÄŸÄ±rÄ±yor, urlYaz da arama kutusunu okuyor.
    //    Kutu henÃ¼z boÅŸken Ã§alÄ±ÅŸÄ±rsa ?ara= URL'den sessizce siliniyordu.
    if(P.get('ara')) araEl.value=P.get('ara');
    // Misafirde yukleniciler tablosunun tamamÄ± anon'a kapalÄ± (42501) â†’ arama kutusu ve
    // il sÃ¼zgeci Ã¶lÃ¼, boÅŸuna Ã§alÄ±ÅŸtÄ±rmak yerine kilitli gÃ¶ster. Segment Ã§ipleri seg_*
    // kolonlarÄ±nÄ± okuduÄŸu iÃ§in misafire HÄ°Ã‡ basÄ±lmaz.
    if(!uyeMi){
      araEl.disabled=true; araEl.placeholder='Arama Ã¼yelere Ã¶zel'; araEl.style.cursor='not-allowed';
      ilEl.disabled=true; ilEl.title='Ä°l sÃ¼zgeci Ã¼yelere Ã¶zel';
      el('v1-segment-alan').style.display='none';
    } else {
      el('v1-segment-alan').style.display='flex';
      cipleriYaz();
      // Normalde await YOK â€” liste il aÃ§Ä±lÄ±r listesini beklemesin. AMA derin linkte
      // (?il=ANKARA) sayaÃ§ satÄ±rÄ± ilAdet'ten besleniyor; beklemezsek "0 firma kayÄ±tlÄ±"
      // yazÄ±p Ã¶yle kalÄ±yor (ikinci bir Ã§izim yok). AyrÄ±ca URL'deki il geÃ§ersizse
      // illeriYukle onu dÃ¼ÅŸÃ¼rÃ¼yor; bunu yukle()'den Ã–NCE Ã¶ÄŸrenmemiz gerekiyor.
      if(il) await illeriYukle(); else illeriYukle();
    }

    araEl.addEventListener('input',()=>{clearTimeout(aramaT); aramaT=setTimeout(()=>{
      sayfa=1; temizleGoster(); urlYaz(); yukle();
    },350);});

    ilEl.addEventListener('change',()=>{
      il=ilEl.value||''; sayfa=1; temizleGoster(); urlYaz(); yukle();
    });

    el('v1-temizle').addEventListener('click',()=>{
      il=''; segment=''; araEl.value='';
      if(!siralaSecildi){ sirala=VARSAYILAN_SIRALA; yon=VARSAYILAN_YON; }
      ilEl.value=''; sayfa=1;
      if(uyeMi) cipleriYaz();
      basliklariYaz(); ipucuYaz(); temizleGoster(); urlYaz(); yukle();
    });

    const sek=(id,m)=>el(id).addEventListener('click',()=>{
      if(mod===m) return;
      mod=m; sayfa=1;
      ['s-tum','s-takip'].forEach(x=>el(x).classList.toggle('aktif',x===id));
      urlYaz(); yukle();
    });
    sek('s-tum','tum'); sek('s-takip','takip');

    basliklariYaz(); ipucuYaz(); temizleGoster();
    yukle();
  })();
})();
